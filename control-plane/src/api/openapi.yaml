          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/drafts/{draftId}/export:
    get:
      operationId: exportDraft
      summary: Export a draft as Markdown, DOCX or UDF (deneysel)
      description: >
        `format=md` renders in-process; the mandatory review banner ("Bu
        taslak makine üretimidir; avukat incelemesi zorunludur.") is the
        FIRST line. `format=docx` shells to the repo venv's Python exporter
        (export.cli --format dilekce-docx), which RE-VERIFIES the draft's
        evidence closure and refuses (EXPORT_REFUSED) rather than writing an
        unverifiable document.


        W12: `format=udf` (export.cli --format dilekce-udf) writes a UYAP
        UDF container. It is DENEYSEL — verified to round-trip through this
        repo's own UDF reader, not opened in the UYAP Doküman Editörü; the
        response therefore carries the `X-ColleX-Experimental: udf` header
        and the file is unsigned. Note text on every udf surface:
        "deneysel — UYAP Doküman Editörü'nde açarak doğrulayın".
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: true
          description: >
            W14 B-13 added `denetim-docx`: the Atıf Denetim Raporu of THIS
            draft. It needs no resolver — every citation in our own draft is
            already a hash-bound evidence record; a row whose digest does not
            hold, whose source is unused in the body, or whose quote bond is
            broken becomes `belirsiz` with its reason written out.
          schema:
            type: string
            enum: [md, docx, udf, denetim-docx]
        - name: annex
          in: query
          required: false
          description: >
            Additive (W14 B-02, L-EVID). `none` omits the künye table, the
            `Uyarılar` list, the `EK — DOĞRULAMA BİLGİLERİ` section, the
            `DAYANAK KAYNAKLARI` appendix and the format notes, and the body
            citation line becomes `Dayanak: <künye>` instead of
            `Dayanak [K-n]: …` (a machine number is meaningless with no annex
            to point at). The evidence/hash package remains available as a
            SEPARATE file (`export/bundle*.py`).
          schema:
            type: string
            enum: [full, none]
            default: full
        - name: marks
          in: query
          required: false
          description: >
            Additive (W14 B-02). `none` omits only the SCREEN marks (the
            `⚠ KAYNAKSIZ — ` prefix and the `Not: …` lines).


            `annex=none&marks=none` is the FILABLE final copy: the file is
            named `… - v<N> - NİHAİ.<ext>` and the title says (NİHAİ); every
            other combination is TASLAK. Removing the ink does NOT remove the
            discipline: `verify_draft_or_refuse` — quote digests, citation
            closure, the KAYNAKSIZ count and the B-01 integrity check — runs
            IDENTICALLY in every mode, and the mandatory review band and the
            footer stay in every mode.
          schema:
            type: string
            enum: [all, none]
            default: all
      responses:
        "200":
          description: The exported document (attachment)
          headers:
            X-ColleX-Experimental:
              description: Present (value `udf`) only for the experimental UDF format.
              schema:
                type: string
                const: udf
          content:
            text/markdown:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: >
            Missing/unknown format, or an invalid `annex` / `marks` value
            (INVALID_REQUEST; `error.message` is directly displayable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown draftId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >
            NEW in W14 (B-01, L-EVID) and distinct from the 500 below: the
            draft's own state refuses the export, which is not a client error.
            `error.kind = EXPORT_REFUSED`, `error.code = QUOTE_ALTERED`, and
            `error.paragraphs[]` names each paragraph that lost its bond so
            the editor can mark them and offer "Alıntıya dön". The gate runs
            BEFORE any format branch — the Markdown path is rendered in
            TypeScript and never reached the Python verifier, which is exactly
            where the defect used to escape — and the exporter process is not
            even spawned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: >
            Exporter refused (EXPORT_REFUSED, exit 2 — evidence closure could
            not be verified, nothing written) or failed (EXPORT_FAILED).
            Additive (W12-FIX2, P2-14): the body carries `detail` and
            `correlationId`; the exporter's stderr goes to the server log
            only. W12-FIX2 (P2-5): a 200 answers with
            `Content-Disposition: attachment; filename="<Belge> - <Dosya> -
            v<N>.<ext>"` (ASCII-safe) plus a UTF-8 `filename*`; the Dosya
            part is the matter title when the draft is filed under a matter;
            timestamps inside the file are local time. A `draftId` that does
            not match `^[A-Za-z0-9][A-Za-z0-9._-]{0,119}$` is a 404 before
            the store is consulted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
