  /v1/matters/{id}/items:
    post:
      operationId: addMatterItem
      summary: Add an item (file / answer / draft / note / event / deadline)
      description: >
        Payload conventions per kind (contract [M]): file {fileName}; answer
        {question, status, mode, fileScope?} — filing with just `refId` (a
        runId) fills the payload from the stored answer (including
        `fileScope` for an answer asked over uploads, W12-API2) and attaches
        it; draft {title, template, version}; note {text, source:
        manual|ai|belge:<fileId>}; event {date, title, source, verified}
        where `source` is `manual`, `belge:<fileId>` (a date the upload's
        heuristic analysis found, no chunk identity — W12-API2) or
        `belge:<fileId>:<chunkId>` (traceable to one chunk); deadline
        {title, dueDate, ruleId?, startDate?, computed?, status: acik|tamam,
        source: manual|hesap}. Unknown payload keys are kept.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              additionalProperties: false
              properties:
                kind:
                  type: string
                  enum: [file, answer, draft, note, event, deadline, hearing]
                refId:
                  type: string
                  nullable: true
                payload:
                  type: object
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatterItem"
        "400":
