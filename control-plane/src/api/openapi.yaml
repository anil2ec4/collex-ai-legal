    # ----------------------------------------------- answer: temporal (B-09)
    TemporalVersion:
      type: object
      required: [evidenceId, documentId, documentVersionId, title, role]
      properties:
        evidenceId:
          type: string
        documentId:
          type: string
        documentVersionId:
