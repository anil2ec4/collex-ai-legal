  # ------------------------------------------------------- cloud AI ledger (B-23)
  /v1/library/status:
    get:
      operationId: getLibraryStatus
      summary: What the local library holds — queued, published, and the corpus count
      description: >
        W14 B-20, second half (ADR-027). Three counts reported SIDE BY SIDE and
        never summed: `queued` = envelope files waiting in the spool
        (`serve.mjs --library-dir`, default `var/library`); `ingested` =
        envelope files the Python publisher moved to `<libraryDir>/yayimlandi/`
        after a successful publish; `publicDocuments` = `legal.documents` rows
        with scope `public` — the SAME expression `/v1/health.corpus.publicDocuments`
        evaluates, so the two pages cannot disagree. A count this route did
        not measure is `null`, never 0 (`publicDocuments` when the database
        did not answer). `lastIngest` is what THIS process remembers of its
        newest run; it is null after a restart. Mounted only when a library
        directory is configured; otherwise 404.
      responses:
        "200":
          description: The library status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryStatus"
  /v1/library/ingest:
    post:
      operationId: ingestLibrary
      summary: Publish the queued live-research documents into the local database now
      description: >
        W14 B-20, second half (ADR-027). Spawns the ONE publication path,
        `python -m ingestion.library --dsn <dsn> --dir <libraryDir> --json`
        (`execFile` with an argument array, never a shell), which validates
        every `collex.library.document/v1` envelope (schema, NFC text,
        re-derived SHA-256, code-point length), refuses a `fixture-*` source,
        and hands the records to the SAME `ingestion.pipeline.Pipeline` the
        fixture corpus and the tenant uploads go through — identity,
        temporal versioning (ADR-012), non-overlapping chunks (ADR-013),
        citator edges. Provenance (source, url, fetch time, tool, sha256) is
        preserved in the version metadata under `fixture_meta.library`, with
        `synthetic:false` and `origin_label:"resmî kaynak"`.


        Idempotent: a landed envelope is MOVED to `yayimlandi/`, so a second
        run scans nothing; a re-queued envelope with identical content is
        `unchanged` (deduplicated by content hash) and writes no row. A
        partial run (some envelopes rejected or failed) is still 200 — the
        counts are the truth and `complete:false` says so; a failed envelope
        is never deleted and is retried next run.


        Failure mapping: the publisher's typed `STORE_UNAVAILABLE` → 503 with
        the launcher remedy; a refused database name → 400 `INVALID_REQUEST`;
        an overrun (600 s) → 504 `LIBRARY_INGEST_TIMEOUT`; a crash → 500
        `LIBRARY_INGEST_FAILED` with `detail` + `correlationId` — the child's
        stderr goes to the server log line under that id and NEVER into this
        body. One ingest at a time per process (409
        `LIBRARY_INGEST_IN_PROGRESS`). Body is optional and strict: an
        unknown field is a 400 that names it.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dryRun:
                  type: boolean
                  description: Read-only — report what WOULD be published; nothing is written or moved.
      responses:
        "200":
          description: The publisher's report (a partial run is 200 with `complete:false`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryIngestReport"
        "400":
          description: INVALID_REQUEST — unknown body field (named in `issues[].path`) or a database name the publisher refuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: LIBRARY_INGEST_IN_PROGRESS — another ingest is still running in this process
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: LIBRARY_INGEST_FAILED — the publisher process died; `detail` + `correlationId`, stderr only in the server log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: STORE_UNAVAILABLE (local PostgreSQL not accepting connections) | LIBRARY_UNAVAILABLE (no DSN configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: LIBRARY_INGEST_TIMEOUT — the publisher overran its 600 s budget; the queue is untouched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
