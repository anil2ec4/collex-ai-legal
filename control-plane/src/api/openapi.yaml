                format: date-time
        chronology:
          type: array
          items:
            type: object
            properties:
              itemId:
                type: string
              date:
                type: string
                format: date
              title:
                type: string
              source:
                type: string
              verified:
                type: boolean
        today:
          type: string
          format: date
    SearchAllResponse:
      type: object
