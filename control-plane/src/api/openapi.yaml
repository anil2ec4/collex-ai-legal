      summary: The matter page — matter + items grouped by kind
      description: >
        Item payloads are MERGED with live summaries when the answer/draft
        stores can provide them (answer items gain evidenceCount,
        finalizable, answeredAt; draft items gain version, title, template,
        unsupportedCount, createdAt); the stored payload is the fallback.
      parameters:
