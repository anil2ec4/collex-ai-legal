        status:
          type: string
          enum: [acik, beklemede, kapali]
        notes:
          type: string
          maxLength: 20000
    MatterPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        client:
          type: string
        opposing:
          type: string
        court:
          type: string
        docketNo:
          type: string
        kind:
          type: string
          enum: [dava, danismanlik, sozlesme, icra, diger]
        status:
          type: string
          enum: [acik, beklemede, kapali]
        notes:
          type: string
    Matter:
      type: object
      required: [id, title, client, opposing, court, docketNo, kind, status, notes, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        client:
          type: string
        opposing:
          type: string
        court:
          type: string
        docketNo:
          type: string
        kind:
          type: string
          enum: [dava, danismanlik, sozlesme, icra, diger]
        status:
          type: string
          enum: [acik, beklemede, kapali]
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MatterSummary:
      type: object
      description: GET /v1/matters row — the matter plus derived workspace facts.
      required: [id, title, client, opposing, court, docketNo, kind, status, createdAt, updatedAt, counts, nextDeadline, lastActivityAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        client:
          type: string
        opposing:
          type: string
        court:
          type: string
        docketNo:
          type: string
        kind:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        counts:
          type: object
          required: [files, answers, drafts, notes, events, deadlines]
          properties:
            files:
              type: integer
            answers:
              type: integer
            drafts:
              type: integer
            notes:
              type: integer
            events:
              type: integer
            deadlines:
              type: integer
            hearings:
              type: integer
              description: Additive (W14 B-17).
        overdueCount:
          type: integer
          description: >
            Additive (W14 B-26). Open deadlines whose due date has PASSED,
            counted separately — `nextDeadline` now skips the past instead of
            showing a 49-day-old date as if it were the next thing due.
        nextDeadline:
          type: object
          nullable: true
          description: >
            Earliest open deadline that is NOT in the past. W14 B-26 changed
            this: overdue ones are counted in `overdueCount` instead.
          required: [itemId, title, dueDate]
          properties:
            itemId:
              type: string
            title:
              type: string
            dueDate:
              type: string
              format: date
            daysLeft:
              type: integer
              description: Additive (W14 B-26).
            overdue:
              type: boolean
              description: Additive (W14 B-26).
        nextHearing:
          type: object
          nullable: true
          description: Additive (W14 B-17). The next hearing, or null.
          properties:
            itemId:
              type: string
            title:
              type: string
            date:
              type: string
              format: date
            time:
              type: string
            kind:
              type: string
            daysLeft:
              type: integer
        lastActivityAt:
          type: string
          format: date-time
    MatterItem:
      type: object
      description: >
        A polymorphic record of a matter. `payload` conventions per kind:
        file {fileName}; answer {question, status, mode(local|live),
        fileScope?} (+ live evidenceCount, finalizable, answeredAt on the
        matter page; `fileScope` — W12-API2 — only for an answer asked over
        uploads, so the console can label it "Belge"); draft {title,
        template, version} (+ unsupportedCount, createdAt); note {text,
        source}; event {date, title, source: manual | belge:<fileId> |
        belge:<fileId>:<chunkId>, verified}; deadline {title, dueDate,
        ruleId?, startDate?, computed?, status, source}; hearing (W14 B-17)
        {date, time 'SS:DD', court, salon, kind: durusma|kesif|e-durusma,
        title?, note, status: planlandi|yapildi|ertelendi}.
      required: [itemId, matterId, kind, refId, payload, createdAt, updatedAt]
      properties:
        itemId:
          type: string
          format: uuid
        matterId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [file, answer, draft, note, event, deadline, hearing]
          description: >
            W14 B-17 added `hearing` (additive value). The database CHECK
            constraint was widened by
            `20260904090000_hearing_kind_and_search_indexes.sql`; before that
            migration a Pg-backed instance answered a typed
            `503 ITEM_KIND_UNSUPPORTED` with one Turkish sentence rather than
            a driver error.
        refId:
          type: string
          nullable: true
          description: fileId / runId / draftId for file / answer / draft items.
        payload:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
