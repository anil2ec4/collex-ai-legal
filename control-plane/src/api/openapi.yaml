            format: uuid
      responses:
        "200":
          description: Tasks with availability, limits and the model in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatterAnalysisCapabilities"
        "404":
          description: MATTER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/matters/{matterId}/analysis/{runId}/findings:
    get:
      operationId: getMatterAnalysisFindings
      summary: Bir incelemenin tespitleri (Matter Intelligence), kaynaklarıyla
      description: >
        Every item carries one or more SOURCES: the stored observation's
        document version, code-point offsets, exact quote, quote sha256,
        locator ("s. 3") and the chunk it starts in. The database refuses to
        commit an item without a source (deferred constraint trigger).
        Available once the run is finished (done / cancelled / failed); an
        active run answers 409 RUN_NOT_FINISHED with its progress.
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Run view plus items, links, value relations and file names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatterAnalysisFindings"
        "404":
          description: RUN_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: RUN_NOT_FINISHED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/matters/{matterId}/analysis/{runId}/cancel:
    post:
      operationId: cancelMatterAnalysis
      summary: İncelemeyi durdur
      description: >
        Requests cancellation. The worker stops claiming units of the run;
        finished units and their observations are kept; untouched units stay
        UNIT_NOT_PROCESSED, so the run's coverage can never read complete.
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Cancellation requested
          content:
            application/json:
              schema:
                type: object
                required: [runId, status]
                properties:
                  runId: { type: string, format: uuid }
                  status: { type: string, enum: [cancelling] }
        "404":
          description: RUN_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: RUN_NOT_ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/matters/{matterId}/intelligence:
    get:
      operationId: getMatterIntelligence
      summary: Dosyanın en son inceleme sonuçları, bayat olup olmadıklarıyla
      description: >
        The latest FINISHED run per task. Derived intelligence is a cache:
        when a source file has a newer version than the one the run read,
        `stale` is true and `sourceChanged` names the files; a new run
        rebuilds it.
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Latest result per task
          content:
            application/json:
              schema:
                type: object
                required: [matterId, tasks]
                properties:
                  matterId: { type: string, format: uuid }
                  tasks:
                    type: array
                    items:
                      type: object
                      required: [task, runId, complete, stale, sourceChanged]
                      properties:
                        task: { type: string }
                        taskTitle: { type: string }
                        runId: { type: string, format: uuid }
                        finishedAt: { type: string, format: date-time, nullable: true }
                        complete: { type: boolean }
                        analysisComplete: { type: boolean }
                        coverageSummary: { type: string, nullable: true }
                        stale: { type: boolean }
                        sourceChanged:
                          type: array
                          items: { type: string }
                        sourceAdded:
                          type: array
                          items: { type: string }
                        sourceRemoved:
                          type: array
                          items: { type: string }
                        items:
                          type: object
                          additionalProperties: { type: integer }
  # ------------------------------------------------ review tables (W20 grid)
  /v1/review-tables:
    post:
      operationId: createReviewTable
      summary: Belge × soru tablosu — kalıcı ve kaldığı yerden süren
      description: >
        W20: the console grid, persisted. One cell per (document × question),
        each with a lease and a retry budget, so a closed tab or a restart
        never loses a finished cell and one failed cell can be retried alone.
        Column mode `answer` is targeted retrieval through the SAME answer
        pipeline (one call per cell, scoped to that document); the
        `extract_*` modes read EVERY analysis unit of the document's pinned
        version and carry that document's processing coverage. With a
        `matterId`, every file must belong to the matter (409
        FILES_OUTSIDE_MATTER); unknown files are 409 FILES_NOT_FOUND.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewTableRequest"
      responses:
        "202":
          description: Table created; cells queued
          content:
            application/json:
              schema:
                type: object
                required: [tableId, status, progress]
                properties:
                  tableId: { type: string, format: uuid }
                  status: { type: string, enum: [queued] }
                  progress:
                    $ref: "#/components/schemas/ReviewTableProgress"
        "400":
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: MATTER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: FILES_OUTSIDE_MATTER or FILES_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listReviewTables
      summary: Kayıtlı tablolar
      parameters:
        - name: matterId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recent tables, newest first
          content:
            application/json:
              schema:
                type: object
                required: [tables]
                properties:
                  tables:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReviewTableSummary"
  /v1/review-tables/{tableId}:
    get:
      operationId: getReviewTable
      summary: Tablonun tanımı, belgeleri, soruları ve her hücresi
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewTable"
        "404":
          description: TABLE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/review-tables/{tableId}/cells/{rowNo}/{columnNo}/retry:
    post:
      operationId: retryReviewTableCell
      summary: Tek bir hücreyi yeniden dene
      description: Re-queues ONE finished, failed or cancelled cell. Nothing else is recomputed.
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: rowNo
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: columnNo
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "202":
          description: The cell is pending again
        "404":
          description: TABLE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            CELL_BUSY (the cell is being computed right now), or W21
            ROW_VERSION_STALE (the pinned document version can no longer be read
            exactly, so the cell is refused instead of being answered from
            another version; the message says so separately when the file
            itself was deleted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/review-tables/{tableId}/cancel:
    post:
      operationId: cancelReviewTable
      summary: Kalan hücreleri durdur
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Cancellation requested; pending cells become cancelled
        "404":
          description: TABLE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: TABLE_NOT_ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/review-tables/{tableId}/export.csv:
    get:
      operationId: exportReviewTable
      summary: Tabloyu indir (Excel'de açılır)
      description: >
        UTF-8 with a byte-order mark, semicolon-separated. Every cell keeps
        its provenance (locations and quote fingerprints) and its coverage
        verdict. A field starting with = + - @ is prefixed with an apostrophe
        so it can never execute as a spreadsheet formula. W21: only a
        FINISHED cell exports an answer; a failed or re-queued cell exports
        why it has none ("Durum" hesaplanamadı / sırada, "Cevap" = the
        error), never a previous run's text. "Belge durumu" says per row why
        it is stale (rows[].staleReason in words — a deleted file is "belge
        silindi", never "a newer version was uploaded"). The "Destek" label
        of an abstention names the passages retrieved for the question, not
        the whole document. "Belge durumu" is the last column (13th), so the
        12 columns of a W20 export keep their positions. Cells stored before
        grid-v3 are exported as GET reports them (see cells[].generatorVersion).
        W21 round two: the "Destek" of a census cell that read every page but
        is not COMPLETE (it met date/amount-like text it could not read, or it
        was counted before grid-v4) is "belgenin tamamı okundu; sayım eksik
        olabilir", never "belgenin tamamı okundu" alone.
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: CSV attachment
          content:
            text/csv:
              schema: { type: string }
        "404":
          description: TABLE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  # ---------------------------------------------------- matters: package (B-30)
  /v1/matters/{id}/package:
    post:
      operationId: packageMatter
      summary: Dosya paketi — one ZIP a colleague can verify without this system
      description: >
        W14 B-30 (packager L-EVID, HTTP endpoint W14-L-FIX §5). Collects the
        matter's uploads, drafts and stored answers, writes a
        `collex.matter-package/v1` plan and calls
        `python -m export.cli --package`.


        The route itself reads NO bytes and computes NO digest: the plan
        carries absolute paths plus the sha256 RECORDED AT INGEST, and the
        Python packager recomputes every digest inside the finished archive
        and REFUSES the whole package if one does not hold (exit 2 →
        `500 EXPORT_REFUSED` + `correlationId`, nothing written, and the child
        process's stderr never enters the body). A record that could not be
        packaged is written into `notes`, never silently dropped.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The ZIP package (attachment)
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          description: MATTER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: PACKAGE_EMPTY — nothing in this matter could be packaged (`notes[]` says why)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: EXPORT_REFUSED (integrity) / EXPORT_FAILED, with `correlationId`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: STORE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  # ----------------------------------------------------- global search (B-29)
  /v1/matters/search:
    get:
      operationId: searchEverything
      summary: One box over matters, document bodies, notes, events, deadlines, hearings, answers and drafts
      description: >
        W14 B-29 (L-MATTER). Document BODIES are searched through the Turkish
        FTS index on `legal.chunks` (with an ILIKE fallback), tenant uploads
        only, and every document row anchors to
        `#belge/<fileId>?parca=<chunkId>&offset=<startChar>` where the offset
        is a Unicode CODE POINT (ADR-003).


        When the document port is not wired the answer says
        `documentsSearched: false` — there is no silent empty group.


        MEASURED: 6 ms over 400 matters × 12 records (synthetic, 02.09.2026).
        That measurement does NOT include the document-body half; the
        2 000-document probe database was never built.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Grouped results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchAllResponse"
        "400":
          description: INVALID_REQUEST (q shorter than 2, unrecognized query parameter)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: STORE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/search/all:
    get:
      operationId: searchEverythingAlias
      summary: Alias of GET /v1/matters/search (the console's top-bar box)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Grouped results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchAllResponse"
        "400":
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: STORE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  # ------------------------------------------------------------- files (W14)
  /v1/files/search:
    get:
      operationId: searchFileBodies
      summary: Search inside uploaded document bodies only
      description: >
        The document half of B-29, reachable on its own so the console can use
        it even when the matters router has no document port.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Chunk hits
          content:
            application/json:
              schema:
                type: object
                required: [q, hits]
                properties:
                  q:
                    type: string
                  hits:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileSearchHit"
        "400":
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: STORE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/files/{fileId}/reanalyze:
    post:
      summary: Refresh analysis from the verified locally stored original
      description: >-
        No client path is accepted. Verifies original SHA-256 before the
        normal quarantine and extraction pipeline. Preserves file identity,
        original bytes and prior evidence; refreshes derived analysis metadata.
        Read GET /v1/files/{fileId} after success for the current detail.
      parameters:
        - in: path
          name: fileId
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{16}$'
      responses:
        '200':
          description: Analysis refreshed
          content:
            application/json:
              schema:
                type: object
                required: [fileId, reanalyzed]
                properties:
                  fileId:
                    type: string
                  reanalyzed:
                    type: boolean
                    enum: [true]
        '404':
          description: File record or original bytes unavailable
        '422':
          description: Original integrity or extraction check failed
        '503':
          description: Local store unavailable
        '504':
          description: Processing timed out; refresh detail before retrying

  /v1/files/{fileId}/original:
    get:
      operationId: downloadOriginalFile
      summary: Download the uploaded bytes, byte for byte
      description: >
        W14 B-30 (L-MATTER). Streamed from
        `<COLLEX_DATA_DIR>/uploads/<sha256><ext>` — the same folder intake
        writes to — falling back to `<repo>/var/uploads` when
        `COLLEX_DATA_DIR` is unset; the sha256 comes FROM THE DATABASE and is
        checked against `^[0-9a-f]{64}$` and the extension is chosen from a
        `.pdf/.docx/.txt/.udf` allow-list, so no request can name a path.


        W14-F-API (V-4): until that pass `createApp` passed no `uploadsDir` to
        this router, so an installation that set `COLLEX_DATA_DIR` — exactly
        what the backup card advises — had intake writing to one folder and
        this route reading another, and "Aslını indir" answered 404 for EVERY
        document. The same value now reaches this route and the matter
        packager, and `serve.mjs` supplies it with the same expression it
        already gave the backup port.
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{16}$"
      responses:
        "200":
          description: The original bytes (attachment; ASCII `filename` plus RFC 5987 `filename*`)
          headers:
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: >
            NOT_FOUND (unknown or malformed fileId) or ORIGINAL_NOT_FOUND —
            verbatim today: "Bu belgenin aslı bilgisayarda bulunamadı — veri
            klasörünüzdeki uploads klasöründe yok (varsayılan: var/uploads);
            yalnız çıkarılan metin ve alıntılar elinizde."


            W14 phase C (N-2) closed the staleness W14-F-API §7.4 reported:
            the sentence used to name `var/uploads` outright, which is the
            WRONG folder on a `COLLEX_DATA_DIR` installation. It now names the
            data folder and gives the default in parentheses. The identical
            wording lives in `files/routes.ts`, `matters/packageRoutes.ts` and
            here; the three change together or none of them does.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: STORE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/files/{fileId}/usage:
    get:
      operationId: getFileUsage
      summary: What will be orphaned if this document is deleted
      description: >
        W14 B-26 (L-MATTER). Answers the matter records, draft exhibits and
        stored answers that point at this document, plus the three verbatim
        Turkish `warnings[]` the delete confirmation prints.
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{16}$"
      responses:
        "200":
          description: The usage report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUsage"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: STORE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  # ------------------------------------------------------- draft versions (W14)
  /v1/drafts/{draftId}/versions/{version}:
    get:
      operationId: getDraftVersionBody
      summary: The full body of one earlier draft version
      description: >
        W14 B-26. Works in BOTH modes: `PgDraftStore` stores one row per
        version, and `InMemoryDraftStore` gained `getVersionBody` in the
        integration phase (before that, the store wrapper silently failed to
        forward the method and the route answered 501 even against real
        PostgreSQL — W14-L-FIX §3c).
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The draft as it was at that version
          content:
            application/json:
              schema:
                type: object
                required: [draft]
                properties:
                  draft:
                    $ref: "#/components/schemas/Draft"
        "404":
          description: Unknown draftId or version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "501":
          description: NOT_SUPPORTED — the configured store cannot read old versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    # ---------------------------------------------------------------- answers
    AnswerRequest:
      type: object
      required: [question]
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 3
          maxLength: 2000
        asOf:
          type: string
          format: date
          description: >
            ISO date (YYYY-MM-DD) the question is asked "as of". Decides which
            document version was in force and drives the currentness
            assessment. Defaults to today (UTC).
        filters:
          type: object
          additionalProperties: false
          properties:
            sources:
              type: array
              maxItems: 50
              items:
                type: string
            documentTypes:
              type: array
              maxItems: 50
              items:
                type: string
            courtTypes:
              type: array
              maxItems: 20
              items:
                type: string
              description: >
                Additive (contract D): restrict RULINGS to these court types
                (Turkish-normalized substring match). Norm texts always pass
                — the filter narrows case law, never the statute itself.
            dateFrom:
              type: string
              format: date
              description: Keep rulings decided on/after this date (additive).
            dateTo:
              type: string
              format: date
              description: Keep rulings decided on/before this date (additive).
            fileIds:
              type: array
              maxItems: 50
              items:
                type: string
                maxLength: 200
              description: >
                W12-B file scope: retrieve ONLY from the caller's own uploaded
                documents (external ids from /v1/files). Evidence then carries
                `origin: upload`, the result a `fileScope` block and a KAPSAM
                banner; the citator lane is skipped (SKIPPED_FILE_SCOPE).
            includeCorpus:
              type: boolean
              description: Under file scope only — union the public corpus back in.
            chambers:
              type: array
              maxItems: 20
              items:
                type: string
              description: >
                Additive (W14 B-16, wired by W14-L-FIX §3e). Daire filter,
                already implemented by `passesCourtDateFilters` and accepted by
                POST /v1/search; the answer schema stays `.strict()`, so the
                four fields had to be declared before they could be sent.
            yearFrom:
              type: integer
              description: Additive (W14 B-16). Keep rulings decided in/after this year.
            yearTo:
              type: integer
              description: Additive (W14 B-16). Keep rulings decided in/before this year.
            excludeTerms:
              type: array
              maxItems: 10
              items:
                type: string
              description: Additive (W14 B-16). Drop passages carrying these terms.
        limits:
          description: >
            Retrieval ceilings. CLAMPED to the server tier: a request may only
            lower the work the server does, never raise it. W14-F-PERF added
            two server-side trigram controls — the fallback threshold (8) and
            the lane's 2 500 ms wall budget — and DELIBERATELY did NOT expose
            them here: `additionalProperties: false` means a caller sending
            `trigramFallbackMinHits` or `trigramBudgetMs` gets
            `INVALID_REQUEST`, so no caller can raise its own budget.
          type: object
          additionalProperties: false
          properties:
            resultLimit:
              type: integer
              minimum: 1
              maximum: 100
            lexicalLimit:
              type: integer
              minimum: 1
              maximum: 200
            trigramLimit:
              type: integer
              minimum: 1
              maximum: 200
            trigramMinSimilarity:
              type: number
              minimum: 0
              maximum: 1
            perDocumentCap:
              type: integer
              minimum: 1
              maximum: 20
        includeTexts:
          type: boolean
          description: >
            Include the canonical document texts in the embedded evidence
            bundle. Off by default; only an auditor re-deriving quotes from
            offsets needs them.
        useCloudAi:
          type: boolean
          description: >
            W12-B/E per-request consent: route THIS request's drafting and
            entailment through the configured cloud model (`result.aiUsed`).
            When the server has no ANTHROPIC_API_KEY the request continues
            rule-based with an `AI_UNAVAILABLE:<Türkçe>` warning. The
            coverage gate runs BEFORE the drafter, so an uncovered question
            never reaches the cloud. W20: under COLLEX_DATA_BOUNDARY=LOCAL_ONLY
            the cloud ports are never touched and the answer carries
            `CLOUD_AI_REFUSED_LOCAL_ONLY:<Türkçe>`.
        useLocalAi:
          type: boolean
          description: >
            W20: draft and verify with the configured LOCAL model (the
            `answer` and `verifier` roles of llm/providerFactory.ts). Takes
            precedence over `useCloudAi`. A local drafter failure falls back
            to the rule-based drafter (`LOCAL_DRAFTER_FALLBACK`); with no
            local model the request continues rule-based with
            `LOCAL_AI_UNAVAILABLE:<Türkçe>`. Model-written claims are verified
            like cloud-written ones (possible paraphrase).
        matterId:
          type: string
          format: uuid
          description: >
            W12-A: file the answer under this dava dosyası (an `answer` item
            with {question, status, mode}). 404 MATTER_NOT_FOUND before any
            retrieval when the matter does not exist; a link that fails after
            the answer exists adds `MATTER_LINK_FAILED:<Türkçe>` to
            `warnings` and never fails the request.
        scope:
          allOf:
            - $ref: "#/components/schemas/AnswerScope"
          description: >-
            Additive (W19 phase C): WHERE TO SEARCH. `matterId` above is
            FILING (where the answer is put); this is SCOPING (where
            evidence is looked for). They are different questions.
    AnswerSummary:
      type: object
      description: One row of GET /v1/answers and the matter page (W12).
      required: [runId, question, status, mode, matterId, createdAt, evidenceCount, finalizable]
      properties:
        runId:
          type: string
        question:
          type: string
        status:
          $ref: "#/components/schemas/AnswerStatus"
        mode:
          type: string
          enum: [local, live]
        matterId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        evidenceCount:
          type: integer
        finalizable:
          type: boolean
        fileScope:
          allOf:
            - $ref: "#/components/schemas/FileScope"
          description: >
            W12-API2 (additive): present only for an answer asked over the
            caller's uploads (read from the stored `result.fileScope`). The
            console labels such a row "Belge"; a corpus or live answer has
            no `fileScope`.
    QuestionCoverage:
      type: object
      description: >
        W12-B question-coverage gate (always present). `ratio` is the
        weighted share of the question's content words found in the
        retrieved passages; the gate `failed` -> status ABSTAIN with reason
        QUESTION_NOT_COVERED and the passages listed by identity only
        (`setAside`); `bypassed-by-reference` when the question cites a
        provision/decision that was pinned.
      required: [ratio, covered, missing, gate, floor, lexemes, passages, bestPassageCovered, setAside]
      properties:
        ratio:
          type: number
        covered:
          type: array
          items:
            type: string
        missing:
          type: array
          items:
            type: string
        gate:
          type: string
          enum: [passed, failed, bypassed-by-reference]
        floor:
          type: number
        lexemes:
          type: array
          items:
            type: string
        passages:
          type: integer
        bestPassageCovered:
          type: integer
        setAside:
          type: integer
        partiallyCovered:
          type: boolean
          description: >
            Additive (W12-FIX). True when the gate was bypassed by an explicit
            reference but the ADMITTED passages still cover less than the floor
            of the question's content words: the cited text is shown, the
            question is not answered — status PARTIAL, `finalizable:false`,
            reason QUESTION_PARTIALLY_COVERED. Under a bypass only the pinned
            text is admitted by right; every other passage must anchor the
            question on its own or be reached from an admitted passage by a
            stored edge (relation / citation / divergence).
        measuredOn:
          type: string
          enum: [soru, "soru+olay"]
          description: >
            Additive (W14 B-08, L-ANSWER). Which text the coverage ratio was
            measured on. A question longer than
            `LONG_QUESTION_CODE_POINTS = 400` has its LEGAL QUESTION extracted
            (interrogative sentences + last sentence + sentences carrying a
            parsed citation) and the gate is measured on that (`"soru"`);
            retrieval still receives the whole narrative as a ranking signal
            and a SECOND primary query is planned. Below the threshold the
            value is `"soru+olay"` and the code path and results are identical
            to before W14. Absent = the pre-W14 behaviour.
    AiUsed:
      type: object
      description: Which drafter/judge produced this answer (W12-B; always present).
      required: [drafter, entailment, label]
      properties:
        drafter:
          type: boolean
        entailment:
          type: boolean
        label:
          type: string
          description: '"Kural tabanlı — yerel" or "Anthropic <model>".'
    FileScope:
      type: object
      description: Present only when the request restricted retrieval to uploaded files.
      required: [fileIds, includeCorpus]
      properties:
        fileIds:
          type: array
          items:
            type: string
        includeCorpus:
          type: boolean
    AnswerStatus:
      type: string
      enum: [COMPLETE, QUALIFIED, PARTIAL, ABSTAIN]
      description: >
        COMPLETE — every claim is supported by validated evidence.
        QUALIFIED — supported, but with a caveat or a conflicting authority.
        PARTIAL — something could not be verified, or the corpus could not be
        fully searched; the answer must not be finalized.
        ABSTAIN — no verifiable source; `evidence` and `claims` are EMPTY and
        no citation card is produced.
    Verdict:
      type: string
      enum:
        [SUPPORTED, QUALIFIED, CONFLICTING_AUTHORITIES, INSUFFICIENT_EVIDENCE,
         OUT_OF_DATE_SOURCE, PARTIAL_SOURCE_COVERAGE]
    Confidence:
      type: object
      description: >
        The five confidence dimensions, each a probability in [0,1]. W12-B2:
        when the claim's `currentnessApplicable` is false (every validated
        supporting passage is an uploaded document) `currentness` holds the
        NEUTRAL score 1.0 — currentness did not gate the claim — and must be
        rendered as "yüklediğiniz belge — yürürlük değerlendirilemez", never
        as a percentage.
      required: [retrieval, entailment, authority, currentness, coverage]
      properties:
        retrieval:
          type: number
        entailment:
          type: number
        authority:
          type: number
        currentness:
          type: number
        coverage:
          type: number
    AuthorityAssessment:
      type: object
      required: [tier, label, rationale, score]
      properties:
        tier:
          type: integer
          minimum: 1
          maximum: 7
          description: 1 mevzuat > 2 AYM > 3 içtihadı birleştirme > 4 daire > 5 BAM/ilk derece > 6 kurul > 7 unknown.
        label:
          type: string
        rationale:
          type: string
        score:
          type: number
    CurrentnessAssessment:
      type: object
      required: [status, score, asOf, rationale]
      properties:
        status:
          type: string
          enum: [IN_FORCE, OUT_OF_DATE, REPEALED, NOT_YET_IN_FORCE, UNKNOWN, NOT_APPLICABLE]
          description: >
            W12-B2 adds NOT_APPLICABLE: the passage is an UPLOADED document
            (`origin: upload`) — not legislation or case law, so the
            yürürlük question does not apply; `score` is the neutral 1.0 and
            the label on every surface is "yüklediğiniz belge — yürürlük
            değerlendirilemez". A `live` passage is assessed like `corpus`.
        score:
          type: number
        asOf:
          type: string
        rationale:
          type: string
    EvidenceView:
      type: object
      description: >
        One citable passage, independently verifiable. `startChar`/`endChar`
        are Unicode CODE POINT indices into the NFC-normalized canonical text
        of `documentVersionId` (project-wide offset policy).
      required:
        [evidenceId, documentId, documentVersionId, chunkId, source, sourceUrl,
         sourceUrlAllowed, title, documentType, startChar, endChar, quote,
         quoteSha256, contentSha256, retrievedAt, authority, currentness,
         stance, polarity, polarityMarkers, retrievalScore, retrieval]
      properties:
        evidenceId:
          type: string
        documentId:
          type: string
        documentVersionId:
          type: string
        chunkId:
          type: string
        source:
          type: string
        sourceUrl:
          type: string
        sourceUrlAllowed:
          type: boolean
          description: >
            True only when sourceUrl is https on the source-host allowlist. A
            renderer MUST NOT emit a live link when this is false.
        title:
          type: string
        documentType:
          type: string
        court:
          type: string
        decisionDate:
          type: string
        docketNo:
          type: string
        decisionNo:
          type: string
        legislationNo:
          type: string
        article:
          type: string
        paragraph:
          type: string
        startChar:
          type: integer
        endChar:
          type: integer
        quote:
          type: string
          description: Exact canonical text of the span — never a provider snippet.
        quoteSha256:
          type: string
        contentSha256:
          type: string
        retrievedAt:
          type: string
          format: date-time
        authority:
          $ref: "#/components/schemas/AuthorityAssessment"
        currentness:
          $ref: "#/components/schemas/CurrentnessAssessment"
        stance:
          type: string
          enum: [supporting, contrary, neutral]
        polarity:
          type: string
          enum: [AFFIRMATIVE, NEGATIVE, NEUTRAL]
        polarityMarkers:
          type: array
          items:
            type: string
        retrievalScore:
          type: number
        quoteTruncated:
          type: boolean
          description: >
            Additive (W12-FIX2, P1-5b). True when the passage was longer than
            the quote cap (`DEFAULT_MAX_QUOTE_CODE_POINTS` = 4000 code points)
            and `quote` is the window carrying the most question lexemes
            (word-boundary snapped, deterministic). `startChar`/`endChar`,
            `quote` and `quoteSha256` all describe the SHOWN window, so the
            validator and the exporter re-slice it unchanged; the result
            carries `QUOTE_TRUNCATED:<chunkId>:<n>><cap>` in `warnings` and
            the console shows the chip "alıntı kısaltıldı". Absent (never
            false) when the quote is the whole passage.
        origin:
          type: string
          enum: [upload, corpus, live]
          description: >
            W12-B (always present): `upload` = the caller's own uploaded
            document (rendered "Kaynak türü: yüklediğiniz belge"), `corpus` =
            the local corpus, `live` = fetched from an official source by
            the live research lane at run time (rendered "canlı resmî
            kaynak"; emitted by /v1/research and /v1/research/start results
            since W12-API2 — a live answer stored before that carries no
            origin and a client should default it to `live` when
            `mode === "live"`).
        retrieval:
          type: object
          description: >
            Audit trail for the ranking. `lanes` says WHICH lane produced the
            passage; `citation`, `contrary` and `relation` say WHY that lane
            produced it. All three are optional and additive — a passage the
            primary lexical/exact lanes found carries none of them. W12-B:
            one-hop citation expansion arrives UNPINNED on its own `citation`
            lane at 0.9 x its seed's fused score; `pinned` again means only
            "the exact lane matched the QUESTION".
          required: [pinned, fusedScore, lanes, queries]
          properties:
            pinned:
              type: boolean
            pinReason:
              type: string
            fusedScore:
              type: number
            lanes:
              type: array
              items:
                type: string
                enum: [exact, lexical, trigram, dense, relation, citation]
            queries:
              type: array
              items:
                type: string
            citation:
              type: object
              description: >
                Present when one-hop citation expansion pulled this passage in:
                a passage already ranked cited it, and the citation was
                resolved through the ordinary as-of-filtered pin lookup.
              required: [citedByChunkId, reference]
              properties:
                citedByChunkId:
                  type: string
                  description: chunkId of the passage whose text carried the citation.
                reference:
                  type: string
                  description: The resolved reference, e.g. "5237 m.157".
            contrary:
              type: object
              description: >
                Present when the divergence-completion pass admitted this
                passage because its outcome opposes one already retrieved.
              required: [polarity, markers, opposesChunkId, opposesPolarity]
              properties:
                polarity:
                  type: string
                  enum: [AFFIRMATIVE, NEGATIVE, NEUTRAL]
                markers:
                  type: array
                  description: Outcome markers that fired, verbatim.
                  items:
                    type: string
                opposesChunkId:
                  type: string
                opposesPolarity:
                  type: string
                  enum: [AFFIRMATIVE, NEGATIVE, NEUTRAL]
            relation:
              type: object
              description: >
                Present when the citator lane followed a stored amendment edge
                (legal.document_relations) to this passage. This is the whole
                value of that lane: an amending instrument shares almost no
                vocabulary with the article it rewrites, so "why is this
                here?" can only be answered by the EDGE — its id, direction,
                role, the resolver that decided it and the confidence recorded
                at ingest. Only edges with resolutionStatus "resolved" are
                ever followed.
              required:
                [direction, kind, role, relationId, resolutionStatus,
                 resolverVersion, viaChunkId]
              properties:
                direction:
                  type: string
                  description: >
                    Which side of the edge the SEED passage was on. "inbound":
                    the seed is the amended provision and the edge leads to the
                    instrument that amended it. "outbound": the seed is the
                    amending instrument and the edge leads to the provision it
                    changed.
                  enum: [inbound, outbound]
                kind:
                  type: string
                  description: legal.relation_kind, e.g. AMENDS or REPEALS.
                role:
                  type: string
                  description: Which end of the edge THIS passage is.
                  enum: [amending, amended]
                relationId:
                  type: string
                resolutionStatus:
                  type: string
                  description: Always "resolved" — the lane follows nothing else.
                confidence:
                  type: number
                  nullable: true
                  description: Resolver confidence recorded at ingest, in [0,1].
                resolverVersion:
                  type: string
                viaChunkId:
                  type: string
                  description: >
                    chunkId of the already-ranked passage whose document
                    matched the edge — the "you asked about this" anchor.
                targetLegislationNo:
                  type: string
                  nullable: true
                targetArticleNo:
                  type: string
                  nullable: true
    ClaimView:
      type: object
      required:
        [claimId, text, material, treatment, verdict, evidenceIds,
         draftedEvidenceIds, contraryEvidenceIds, confidence, citationChecks,
         entailments, reasons]
      properties:
        claimId:
          type: string
        text:
          type: string
        material:
          type: boolean
        treatment:
          type: string
          enum: [supported, qualified, conflicted, unsupported]
        verdict:
          $ref: "#/components/schemas/Verdict"
        evidenceIds:
          type: array
          description: Evidence ids whose citation PASSED deterministic validation.
          items:
            type: string
        draftedEvidenceIds:
          type: array
          items:
            type: string
        contraryEvidenceIds:
          type: array
          items:
            type: string
        confidence:
          $ref: "#/components/schemas/Confidence"
        citationChecks:
          type: array
          items:
            type: object
            required: [evidenceId, ok]
            properties:
              evidenceId:
                type: string
              ok:
                type: boolean
              reason:
                type: string
                description: >
                  OFFSET_OUT_OF_RANGE | QUOTE_OFFSET_MISMATCH |
                  QUOTE_HASH_MISMATCH | DOCUMENT_VERSION_MISMATCH |
                  EVIDENCE_NOT_IN_PACK | CANONICAL_TEXT_UNAVAILABLE
        entailments:
          type: array
          items:
            type: object
            required: [evidenceId, entails, score, rationale]
            properties:
              evidenceId:
                type: string
              entails:
                type: boolean
              score:
                type: number
              rationale:
                type: string
        entailmentAggregation:
          type: string
          enum: [segments, set, max, none]
          description: >
            Additive (W14 B-31, L-ANSWER). How the entailment score of a
            multi-passage claim was aggregated. `segments`: the claim carries
            `ClaimDraft.segments` and each segment was judged against ITS OWN
            passage, then combined with `min`. `set`: no segments, rule-based
            drafter — judged against the UNION surface of the cited passages
            (`assessSet`). `max`: no segments and a CLOUD drafter — the old
            best-single-passage rule, made visible by the reason
            `ENTAILMENT_UNSEGMENTED_CLOUD_CLAIM`. A single-evidence claim is
            unchanged. `ENTAILMENT_THRESHOLD` stays 0.85.
        entailmentMeasured:
          type: boolean
          description: >
            Additive (W14 B-31). FALSE under the rule-based drafter, where the
            claim text IS the quotes and the axis is a tautology (ARCH W2).
            The console must then show the "Anlamsal doğrulama" axis as
            "— (kural tabanlı üretimde ölçülmez)" and print NO percentage.
        reasons:
          type: array
          items:
            type: string
        currentnessApplicable:
          type: boolean
          description: >
            W12-B2 (additive). False when every validated supporting passage
            of the claim is an uploaded document: `confidence.currentness`
            then holds the neutral 1.0 and MUST be rendered as "yüklediğiniz
            belge — yürürlük değerlendirilemez", not as a percentage.
            Absent or true: the strict yürürlük rule applied (an upload can
            never mask a stale statute cited by the same claim).
    StageTrace:
      type: object
      required: [name, ms, counts, notes]
      properties:
        name:
          type: string
        ms:
          type: number
        counts:
          type: object
          additionalProperties:
            type: number
        notes:
          type: array
          items:
            type: string
    ContraryCoverage:
      type: object
      required:
        [executed, usable, lanes, contraryEvidenceIds, conflictedClaimIds,
         observed, scope, note]
      properties:
        executed:
          type: boolean
        skipped:
          type: boolean
          description: >
            ADDITIVE (W14 phase C, V-21). The contrary lanes were PLANNED and
            then deliberately NOT run, because the primary lanes brought back
            no passage that shares a single content word with the question and
            nothing was pinned — the coverage gate is then certain to set every
            passage aside, so there is no basis for a contrary lane to
            contradict. `executed:false` alone could not tell that apart from
            "no contrary query could be built for this question", and the
            sentence on screen has to say which of the two happened. The
            guarantee is unchanged for answers that DO have a basis: one
            anchoring passage (or one pinned passage) and every contrary lane
            runs as before. Absent on an answer recorded before that pass,
            which is why it is not in `required`.
        usable:
          type: boolean
          description: >
            At least one contrary lane came back without a provider error. A
            lane that ERRORED is not coverage: an outage is not the same as an
            absence of opposing authority.
        lanes:
          type: array
          items:
            type: object
            required: [issueId, issueLabel, kind, baseTerm, flipPhrase, query, status, hits, newPassages]
            properties:
              issueId:
                type: string
              issueLabel:
                type: string
              kind:
                type: string
              baseTerm:
                type: string
              flipPhrase:
                type: string
              query:
                type: string
              status:
                type: string
                enum: [ok, partial, error, skipped]
              hits:
                type: integer
              newPassages:
                type: integer
              error:
                type: string
                description: >
                  Lane failure text. W12: the citator outcome may be
                  SKIPPED_FILE_SCOPE (no citator under file scope), a
                  connection-class failure reads
                  "lane <x> failed: CORPUS_UNAVAILABLE (<code>)".
        contraryEvidenceIds:
          type: array
          items:
            type: string
        conflictedClaimIds:
          type: array
          items:
            type: string
        observed:
          type: array
          description: >
            Passages retrieved but NOT admitted as evidence. Identity only,
            never a quote: an unadmitted passage has not been through the
            citation validator, so quoting it would present unverified text as
            evidence.
          items:
            type: object
            required: [chunkId, documentVersionId, title, documentType, polarity, polarityMarkers, reason]
            properties:
              chunkId:
                type: string
              documentVersionId:
                type: string
              title:
                type: string
              documentType:
                type: string
              court:
                type: string
              decisionDate:
                type: string
              docketNo:
                type: string
              decisionNo:
                type: string
              polarity:
                type: string
              polarityMarkers:
                type: array
                items:
                  type: string
              reason:
                type: string
        scope:
          type: object
          required: [intent, rationale, scopedOut]
          properties:
            intent:
              type: string
              enum: [NORM_CONTENT, APPLICATION]
            rationale:
              type: string
            scopedOut:
              type: integer
        note:
          type: string
    ConsoleGuard:
      type: object
      description: >
        Render-guard report attached for the operator console (additive; a
        client may ignore it). It LABELS an instruction-shaped passage rather
        than editing it — editing evidence would break the verification chain.
      required: [markdownWasGuarded, evidence, flaggedEvidenceIds]
      properties:
        markdownWasGuarded:
          type: boolean
        flaggedEvidenceIds:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            type: object
            required: [evidenceId, injectionFlagged, injectionSignals, invisibleChars, sourceUrlAllowed]
            properties:
              evidenceId:
                type: string
              injectionFlagged:
                type: boolean
              injectionSignals:
                type: array
                items:
                  type: string
              invisibleChars:
                type: integer
              sourceUrlAllowed:
                type: boolean
    AnswerResult:
      type: object
      required:
        [schema, runId, question, normalizedQuestion, asOf, status, finalizable,
         reasons, warnings, claims, evidence, rejectedEvidence,
         contraryCoverage, trace, markdown, bundle, corpusNotice, generatedAt]
      properties:
        schema:
          type: string
          const: collex.answer.result/v1
        persisted:
          type: boolean
          description: >
            Additive (W12-FIX, POST /v1/answer only). Whether the answer row
            reached the database; `false` adds `ANSWER_PERSIST_FAILED:<Türkçe>`
            to `warnings`. The answer is still served from the cache.
        runId:
          type: string
        question:
          type: string
        normalizedQuestion:
          type: string
        asOf:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/AnswerStatus"
        finalizable:
          type: boolean
          description: >
            False for ABSTAIN and PARTIAL. An abstention is never finalizable:
            there is nothing to finalize.
        reasons:
          type: array
          description: >
            Machine codes. W12 additions: QUESTION_NOT_COVERED (coverage gate
            failed; passages set aside), CORPUS_UNAVAILABLE (the local
            database could not be reached — never driver text),
            ABSTENTION_NOT_FINALIZABLE. W12-B2: UPLOAD_ONLY_EVIDENCE — every
            evidenced claim rests only on the caller's uploaded documents;
            the answer may be finalizable, but "Cevap yalnızca yüklediğiniz
            belgedeki pasajlara dayanır; belgenin doğruluğu ve güncelliği
            denetlenmemiştir." (also printed in `markdown`'s Kesinleştirme
            line). A mixed answer is never marked with it. W12-FIX2:
            TIME_BUDGET_EXCEEDED — the answer time budget
            (`DEFAULT_ANSWER_TIME_BUDGET_MS` = 60 000 ms, checked between
            pipeline stages, not inside a single port call) ran out. The same
            code covers two runs. Before the drafter: the drafter is skipped,
            a cloud judge gives way to the local one, there are no `claims`,
            and `markdown` says "Cevap süre bütçesini aştı; tespit yazımı ve
            doğrulama eksik bırakıldı". After the drafter (W21): the claims
            were already written and the verification step still ran on
            them, each with its own verdict; `markdown` then says "Cevap süre
            bütçesini tespitler yazıldıktan sonra aştı; doğrulama adımı yine
            de çalıştı ve her tespitin sonucu kendi satırında yazıyor, ancak
            cevap KISMİ sayıldı ve kesinleştirilmedi", never "tespit yazımı …
            eksik bırakıldı". Either way status PARTIAL, `finalizable:false`,
            the found passages are still shown, and the code itself is
            unchanged (the review-table worker reads it). W14 codes: TEMPORAL_COMPARISON_MISSING (B-09 — a
            temporal question whose evidence carries only ONE version of the
            provision; the status can then never be COMPLETE),
            `ENTAILMENT_UNSEGMENTED_CLOUD_CLAIM:<claimId>` and
            `UNUSED_CITATION:<claimId>:<evidenceId>` (B-31).
          items:
            type: string
        warnings:
          type: array
          description: >
            Degradation notices (lane failures, caps applied, rejected
            evidence). W12 codes: `QUESTION_NOT_COVERED:<n>`,
            `CORPUS_UNAVAILABLE:<lane>:<Türkçe>`, `AI_UNAVAILABLE:<Türkçe>`,
            `MATTER_LINK_FAILED:<Türkçe>`. W12-FIX2 codes:
            `TIME_BUDGET_EXCEEDED:<elapsed>ms><budget>ms` (see `reasons`),
            `QUOTE_TRUNCATED:<chunkId>:<codePoints>><cap>` (see
            `EvidenceView.quoteTruncated`), `STORED_WITHOUT_TEXTS:<Türkçe>`
            (POST /v1/answer only: the canonical texts exceeded
            `MAX_STORED_TEXT_BYTES` = 5 MiB, so the stored bundle keeps quotes
            and digests but not `texts`; `GET …/evidence-bundle?texts=true`
            then carries no texts and the exporter verifies by quote digest).
            W14: `RETRIEVAL_LANE_DEGRADED:<lane>:<detay>` — one retrieval lane
            dropped out; the answer is still 200 and the console draws a
            VISIBLE line ("Arama şeritlerinden biri zaman aşımına uğradı;
            sonuç eksik olabilir."), never a hidden note. W14-F-PERF (V-1)
            changed WHICH limit cuts the trigram lane: it is no longer the
            connection's 15 s `statement_timeout` (paid once per lane, three
            to four lanes per answer) but the lane's OWN 2 500 ms wall budget,
            reported as `TRIGRAM_BUDGET_EXCEEDED` — the budget, not the
            driver's "canceling statement due to statement timeout" prose. The
            lane is also a real FALLBACK now: it is SKIPPED when exact +
            lexical already produced 8 distinct passages, so a saturated
            corpus produces no degradation warning at all. The skip/run/cut
            distinction is carried internally on `SearchPipelineResult.trigram`
            (`SKIPPED_PRIMARY_SUFFICIENT` / `EXECUTED_FOUND` /
            `EXECUTED_NONE_FOUND` / `BUDGET_EXCEEDED` / `FAILED` /
            `DISABLED`); it is NOT on any HTTP response yet and no screen
            draws it. `LIBRARY_WRITE_FAILED:<n>` — a fetched
            document could not be queued to the local library; the answer and
            its quotes are untouched.
          items:
            type: string
        coverage:
          $ref: "#/components/schemas/QuestionCoverage"
        temporal:
          $ref: "#/components/schemas/TemporalView"
        aiUsed:
          $ref: "#/components/schemas/AiUsed"
