            application/json:
              schema:
                $ref: "#/components/schemas/Matter"
        "400":
          description: Validation failed (Turkish issues)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          description: Local database unreachable (STORE_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/matters/deadlines:
    get:
      operationId: listMatterDeadlines
      summary: Open deadlines across every matter, due date ascending
      description: >
        Deadline items whose status is not `tamam`, joined with their
        matter's title; `until` (YYYY-MM-DD) keeps only those due on or
        before that day. `today` is the server's ISO date. Matters with
        status `kapali` are included when they still carry open deadlines.
      parameters:
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: from
          in: query
          required: false
          description: Additive (W14 B-26). Window start; default is today.
          schema:
            type: string
            format: date
        - name: include
          in: query
          required: false
          description: >
            Additive (W14 B-26). `computed` re-attaches the full step-by-step
            `computed` block. It is OFF by default: four deadlines used to
            answer 9 965 bytes, and the measured lean body is under 20 % of
            the full one.
          schema:
            type: string
            enum: [computed]
        - name: format
          in: query
          required: false
          description: >
            Additive (W14 B-17). `ics` answers the same window as an RFC 5545
            calendar instead of JSON.
          schema:
            type: string
            enum: [ics]
      responses:
        "200":
          description: Deadlines (and, since W14, the window's hearings)
          content:
            application/json:
              schema:
                type: object
                required: [deadlines, today]
                properties:
                  deadlines:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/MatterItem"
                        - type: object
                          required: [matterTitle]
                          properties:
                            matterTitle:
                              type: string
                  hearings:
                    type: array
                    description: >
                      Additive (W14 B-17). The same window's hearings, so the
                      panel and the calendar are drawn from ONE response.
                    items:
                      allOf:
                        - $ref: "#/components/schemas/MatterItem"
                        - type: object
                          properties:
                            matterTitle:
                              type: string
                  window:
                    type: object
                    description: Additive (W14 B-26). The window actually applied.
                    properties:
                      from:
                        type: string
                        format: date
                      until:
                        type: string
                        format: date
                  includedComputed:
                    type: boolean
                    description: Additive (W14 B-26).
                  today:
                    type: string
                    format: date
            text/calendar:
              schema:
                type: string
        "400":
          description: Malformed until
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Local database unreachable (STORE_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/matters/{id}:
    get:
