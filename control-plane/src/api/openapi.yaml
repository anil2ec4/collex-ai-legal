      properties:
        q:
          type: string
        total:
          type: integer
        groups:
          type: object
          description: >
            Eight groups, always present (an empty one is an empty array):
            matters · documents · notes · events · deadlines · hearings ·
            answers · drafts. Every row carries an `href` anchor.
          properties:
            matters:
              type: array
              items:
                type: object
            documents:
              type: array
              items:
                $ref: "#/components/schemas/FileSearchHit"
            notes:
              type: array
              items:
                type: object
            events:
              type: array
              items:
                type: object
            deadlines:
              type: array
              items:
                type: object
            hearings:
              type: array
              items:
                type: object
            answers:
              type: array
              items:
                type: object
            drafts:
              type: array
              items:
                type: object
        documentsSearched:
          type: boolean
          description: >
            False when no document port is wired. The console prints "Belge
            içeriği bu sunucuda aranamıyor." — it does NOT draw an empty group.
        tookMs:
