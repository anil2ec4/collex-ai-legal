  # ---------------------------------------------------------- deadlines (W12-D)
  /v1/deadlines/rules:
    get:
      operationId: listDeadlineRules
      summary: Source-cited procedural deadline rules (30) + the mandatory disclaimer
      description: >
        Every rule carries `verified` — as shipped ALL are `dogrulanmadi`
        (the build session had no network); check the article text before
        relying on a period. `computable:false` rules are note-only.
      responses:
        "200":
          description: Rules
          content:
