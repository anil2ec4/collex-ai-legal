  /v1/matters/{matterId}/analysis/capabilities:
    get:
      operationId: getMatterAnalysisCapabilities
      summary: Hangi incelemeler şu an yapılabilir
      description: >
        W20 task honesty. contradictions and chronology are deterministic and
        always available. claim_evidence, full_review and red_team need the
        configured LOCAL model (llm/providerFactory.ts); without one they are
        `available: false` with the reason, and POST refuses them with 409
