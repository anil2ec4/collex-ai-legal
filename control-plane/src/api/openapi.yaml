        Requested budget ceilings. Each dimension is CLAMPED to the server
        tier maximum (min(requested, tier)); a request may only LOWER the
        effective budget, never raise it. Omitted dimensions keep the tier
        default. The effective budget is visible on the run state
        (GET /v1/research-runs/{id} -> budgets).
      type: object
