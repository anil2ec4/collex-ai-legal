    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [kind, message]
          properties:
            kind:
              type: string
              description: >
                Machine code, English UPPER_SNAKE. W14 additions:
                FOREIGN_HOST (421) and FORBIDDEN_ORIGIN (403) from
                `localGuard` (B-04) — they can be answered on ANY route, before
                the body limiter, before the pipeline, before the intake
                process and before the model; AI_RATE_LIMITED (429, B-23);
                FILE_NOT_FOUND (404, B-26); ITEM_KIND_UNSUPPORTED (503, B-17);
                ORIGINAL_NOT_FOUND (404, B-30); NOT_SUPPORTED (501);
                LIMIT_EXCEEDED (409, B-42); QUOTE_ALTERED as `error.code` under
                EXPORT_REFUSED (409, B-01); ALL_SOURCES_FAILED and
                UPSTREAM_UNAVAILABLE (502, B-16); TARIFF_YEAR_NOT_FOUND /
                TARIFF_LINE_NOT_FOUND (400, B-35); BACKUP_IN_PROGRESS (409),
                PG_TOOLS_MISSING / DUMP_FAILED / COPY_FAILED / VERIFY_FAILED
                (500, B-03); PACKAGE_EMPTY (422, B-30).
            message:
              type: string
            code:
              type: string
              description: >
                Additive (W14 B-01). A sub-code that narrows `kind`. Today the
                only value is QUOTE_ALTERED under EXPORT_REFUSED: the drafted
                paragraph no longer contains, verbatim in NFC canonical form,
                the quote it cites — the evidence bond is broken and the
                export is refused with nothing written.
            paragraphs:
              type: array
              description: >
                Additive (W14 B-01). Which paragraphs broke their bond, so the
                editor can mark them and offer "Alıntıya dön".
              items:
                type: object
                properties:
                  paragraphId:
                    type: string
                  sectionId:
                    type: string
                  ref:
                    type: string
            missingFileIds:
              type: array
              description: >
                Additive (W14 B-26). On a 404 FILE_NOT_FOUND from POST
                /v1/answer: the `filters.fileIds` entries that no longer
                exist. Before this check the file scope collapsed to the empty
                set and the answer came back ABSTAIN, which reads on screen as
                a statement ABOUT the document when the truth is that the
                document is gone.
              items:
                type: string
            failedSources:
              type: array
              description: Additive (W14 B-16). Present on 502 ALL_SOURCES_FAILED.
              items:
                $ref: "#/components/schemas/SourceFailure"
            limits:
              type: object
              description: Additive (W14 B-23). Present on 429 AI_RATE_LIMITED.
              properties:
                callsPerHour:
                  type: integer
                inputTokensPerDay:
                  type: integer
            usage:
              type: object
              description: Additive (W14 B-23). Present on 429 AI_RATE_LIMITED.
              properties:
                callsLastHour:
                  type: integer
                inputTokensToday:
                  type: integer
            notes:
              type: array
              description: >
                Additive (W14 B-30). Present on 422 PACKAGE_EMPTY: why each
                record could not be packaged. A record is never dropped in
                silence.
              items:
                type: string
            detail:
              type: string
              description: >
                Additive. Human Turkish detail line. For INTAKE_FAILED /
                EXPORT_FAILED / EXPORT_REFUSED (W12-FIX2, P2-14) it reads
                "Ayrıntı sunucu günlüğüne yazıldı (kayıt no: <uuid>)" — the
                child process's stderr (paths, DSN, tracebacks) is written to
                the server log only, never echoed to the client.
            correlationId:
              type: string
              format: uuid
              description: >
                Additive (W12-FIX2, P2-14). Present on INTAKE_FAILED (POST
                /v1/files) and EXPORT_FAILED / EXPORT_REFUSED
                (GET /v1/drafts/{id}/export): the id under which the server
                logged the failure (`[collex] INTAKE_FAILED id=…` /
                `EXPORT_FAILED id=…`). Quote it when reporting a problem.
            issues:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                    description: >
                      The offending field's own dotted path, and it is NEVER
                      empty (W14 phase C, V-19). zod reports an
                      `unrecognized_keys` problem on the path of the
                      CONTAINING object — the empty array for the body itself —
                      so every `.strict()` rejection used to answer
                      `{"path":"","label":"","message":"Tanınmayan alan."}`,
                      an issue no interface could attach to anything. Every
                      `.strict()` route now goes through one helper
                      (`src/api/zodIssues.ts`) that emits ONE issue PER
                      unrecognized key, named by that key (two extra fields are
                      two lines, not one joined string), and a nested object's
                      rejected key is reported as `profile.imza`, not
                      `profile`.
                  label:
                    type: string
                    description: >
                      Human Turkish label of the offending field (additive;
                      drafting routes populate it so a form can attach the
                      error to the right input via a data-path match). For an
                      unrecognized key the label is `Fazladan alan (<anahtar>)`
                      — Turkish first, the machine string in parentheses —
                      never a bare echo of the key.
                  message:
                    type: string
    # ------------------------------------------------------------------ files
    FileExtraction:
      type: object
      required: [chars, chunkCount, ocr]
      properties:
        chars:
          type: integer
          description: Code points of the NFC canonical extracted text.
        chunkCount:
          type: integer
        pages:
          type: integer
          description: Present for PDFs only.
        ocr:
          type: boolean
          description: Always false — OCR is fail-closed in this build.
    FileAnalysis:
      type: object
      description: >
        Heuristic v1 analysis over the extracted text (labeled "sezgisel" in
        the console — never presented as legal analysis).
      properties:
        parties:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              role:
                type: string
              alsoRoles:
                type: array
                description: >
                  Additive (W14 B-37). The same person appearing under a
                  second role. Deduplication is now by NORMALIZED NAME (the
                  "Av." title is dropped), not by (name, role), so one vekil
                  no longer shows up twice.
                items:
                  type: string
        references:
          type: array
          description: >
            W14 B-37 split this into TWO buckets. `references` holds the ones
            whose legislation context was resolved; a bare "Madde 3" that is
            probably the contract's OWN clause number goes to
            `referencesAmbiguous` instead of being shown as a statute
            reference.
          items:
            type: object
            properties:
              raw:
                type: string
              legislationNo:
                type: string
              articleNo:
                type: string
              docketNo:
                type: string
              decisionNo:
                type: string
              court:
                type: string
              count:
                type: integer
                description: >
                  Additive (W14 B-37). "TBK m.315" and a later bare "m.315"
                  in the same paragraph collapse into ONE row with count 2.
              resolvedFromContext:
                type: boolean
                description: >
                  Additive (W14 B-37). The legislation came from the
                  surrounding paragraph, not from this reference's own text.
        referencesAmbiguous:
          type: array
          description: >
            Additive (W14 B-37). References with no resolvable legislation
            context. The console shows them under "Belirsiz" with the note
            "Kanun bağlamı bulunamadı — sözleşme madde numarası olabilir".
          items:
            type: object
            properties:
              raw:
                type: string
              articleNo:
                type: string
        dates:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              context:
                type: string
                description: >
                  W14 B-37: the ±40-character window is now pulled out to WORD
                  BOUNDARIES and a trimmed edge is marked with "…". Before
                  this, 7 of 7 measured contexts cut mid-word.
              count:
                type: integer
              title:
                type: string
                description: >
                  Additive (W14 B-18). A directly filable event title, taken
                  from the context and trimmed at a word boundary to at most
                  120 CODE POINTS (ADR-003).
              source:
                type: string
                description: Additive (W14 B-18). `belge:<fileId>`.
              verified:
                type: boolean
                description: >
                  Additive (W14 B-18). Always false: this is a heuristic
                  reading of a document, and the chip says
                  "belgeden sezgisel çıkarım — doğrulanmadı".
        claims:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              ordinal:
                type: integer
                description: >
                  Additive (W14 B-37). Numbered SONUÇ VE İSTEM items are now
                  extracted individually, in order; the sentence splitter used
                  to swallow the whole block as one "talep".
              fromDemandBlock:
                type: boolean
                description: Additive (W14 B-37).
    FilePageStats:
      type: object
      description: W12-F per-page PDF text-layer statistics (1-based page numbers).
      required: [pageCount, pagesWithText, emptyPages]
      properties:
        pageCount:
          type: integer
        pagesWithText:
          type: integer
        emptyPages:
          type: array
          items:
            type: integer
        sparsePages:
          type: array
          description: >
            Optional 1-based pages whose text layer exists but contains too
            little text to establish that the page was fully read. These
            pages remain preserved in the extracted text; OCR is not implied.
            W21 round two: it also holds pages local OCR READ but not fully —
            read with low confidence, adding only a few characters beyond a
            short text layer, or with near-copy lines withheld (those pages
            are in `ocrPages` too). The file's warnings then carry
            `OCR_LOW_CONFIDENCE_PAGES:<n>` or `OCR_WITHHELD_LINES_PAGES:<n>`
            beside `IMAGE_TEXT_PAGES:<n>`, each with its Turkish sentence.
          items:
            type: integer
    FileUploadResult:
      type: object
      description: >
        POST /v1/files 200 body (the intake CLI's IntakeResult). W12-F:
        `action` says whether the bytes were new or already stored
        (`already-existed` + Turkish `message`); `pages` (PDF only) reports
        the per-page text layer — a MIXED PDF ingests its text pages and
        warns `SCANNED_PAGES:<n>` plus a Turkish sentence naming the pages.
        `pages.sparsePages` separately marks pages with a very short text
        layer; the extracted short text is retained but full readability is
        not established;
        an all-scanned PDF is still 422. `warnings` may also carry
        `MATTER_LINK_FAILED:<Türkçe>` when `matterId` was given and the
        filing failed after the upload succeeded.
      required: [fileId, name, mime, sha256, sizeBytes, kind, extraction, analysis, warnings]
      properties:
        action:
          type: string
          enum: [created, already-existed]
        message:
          type: string
          description: Turkish notice for `already-existed` ("Bu belge zaten yüklüydü").
        pages:
          $ref: "#/components/schemas/FilePageStats"
        fileId:
          type: string
          description: First 16 hex chars of the file's SHA-256 (content id).
        name:
          type: string
        mime:
          type: string
          description: Verified from CONTENT, never trusted from the filename.
        sha256:
          type: string
        sizeBytes:
          type: integer
        kind:
          type: string
          enum: [pdf, docx, txt, udf]
        extraction:
          $ref: "#/components/schemas/FileExtraction"
        analysis:
          $ref: "#/components/schemas/FileAnalysis"
        warnings:
          type: array
          items:
            type: string
    FileListEntry:
      type: object
      required: [fileId, name, mime, sha256, kind, uploadedAt, chars, chunkCount]
      properties:
        fileId:
          type: string
        name:
          type: string
        mime:
          type: string
        sha256:
          type: string
        kind:
          type: string
        uploadedAt:
          type: string
          format: date-time
        chars:
          type: integer
        chunkCount:
          type: integer
        sizeBytes:
          type: integer
          minimum: 0
          description: Original uploaded byte count when available from intake metadata.
        matterId:
          type: string
          nullable: true
          description: Additive (W14 B-26).
        matterTitle:
          type: string
          nullable: true
          description: Additive (W14 B-26).
        pages:
          allOf:
            - $ref: "#/components/schemas/FilePageStats"
          description: >
            W12-API2 (additive): the same per-page text-layer statistics the
            detail read returns, on the LIST row — including sparse pages — so
            the Belgeler list can show the scan/readability warning without a
            detail round trip.
            Absent for non-PDF uploads and for files ingested before the
            statistics were recorded.
    FileChunkPreview:
      type: object
      required: [chunkId, ordinal, preview, startChar, endChar]
      properties:
        chunkId:
          type: string
        ordinal:
          type: integer
        preview:
          type: string
          description: Whitespace-collapsed, capped at 240 code points.
        startChar:
          type: integer
          description: Code-point offset into the canonical text (ADR-003).
        endChar:
          type: integer
    FileDetail:
      allOf:
        - $ref: "#/components/schemas/FileListEntry"
        - type: object
          required: [extraction, analysis, warnings, chunks]
          properties:
            extraction:
              $ref: "#/components/schemas/FileExtraction"
            analysis:
              $ref: "#/components/schemas/FileAnalysis"
            warnings:
              type: array
              items:
                type: string
            chunks:
              type: array
              description: The requested WINDOW of previews (`chunkCount` stays the total).
              items:
                $ref: "#/components/schemas/FileChunkPreview"
            chunkWindow:
              type: object
              description: W12-F pagination echo.
              required: [offset, limit, total]
              properties:
                offset:
                  type: integer
                limit:
                  type: integer
                total:
                  type: integer
            pages:
              $ref: "#/components/schemas/FilePageStats"
    # --------------------------------------------------------------- research
    ResearchRequest:
      type: object
      required: [question]
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 3
          maxLength: 2000
        asOf:
          type: string
          description: ISO date (YYYY-MM-DD).
        budgets:
          type: object
          additionalProperties: false
          description: Clamped to maxToolCalls<=24, maxFetches<=10, maxWallTimeMs<=120000.
          properties:
            maxToolCalls:
              type: integer
              minimum: 1
            maxFetches:
              type: integer
              minimum: 1
            maxWallTimeMs:
              type: integer
              minimum: 1
        fileIds:
          type: array
          maxItems: 50
          items:
            type: string
          description: Accepted per contract; the uploaded-claims lane is interface-only in v1.
        filters:
          type: object
          additionalProperties: false
          description: >
            Additive (contract D): court/date narrowing, enforced at the
            evidence boundary of the live run. A fetched RULING outside the
            requested courts/date range never becomes citable evidence;
            exclusions are counted in an EVIDENCE_FILTERED warning. Norm
            texts always pass.
          properties:
            courtTypes:
              type: array
              maxItems: 20
              items:
                type: string
            dateFrom:
              type: string
              format: date
            dateTo:
              type: string
              format: date
        matterId:
          type: string
          format: uuid
          description: >
            W12: file the finished run under this matter (persisted with the
            answer; 404 MATTER_NOT_FOUND up front when it does not exist).
    ResearchToolCall:
      type: object
      description: One gateway call in the live run's trace, in call order.
      required: [capability, tool, ok, ms]
      properties:
        capability:
          type: string
        tool:
          type: string
        ok:
          type: boolean
        ms:
          type: number
        resultCount:
          type: integer
        status:
          type: string
          enum: [ok, failed, timeout]
          description: W12-F per-call outcome (a timeout also adds a `TIMEOUT:<n>` warning).
        errorKind:
          type: string
    ResearchProgressStep:
      type: object
      description: One folded progress step with a lawyer-Turkish label (W12-F).
      required: [at, label, status]
      properties:
        at:
          type: string
          format: date-time
        label:
          type: string
          description: e.g. "Yargıtay/Danıştay kararları aranıyor", "Belge çekiliyor 2/6".
        tool:
          type: string
        status:
          type: string
          enum: [running, ok, failed, timeout]
        count:
          type: integer
        ms:
          type: number
        errorKind:
          type: string
    ResearchRunView:
      type: object
      description: >
        GET /v1/research/runs/{runId} body (W12-F). `warnings` (W12-API2,
        always present) carries run-level notices that are NOT part of the
        answer: today only `MATTER_LINK_FAILED:<Türkçe>` when the finished run
        could not be filed under its `matterId` — the answer itself is stored
        and readable through /v1/answers/{runId}; the lawyer can file it by
        hand. It is recorded BEFORE `state` becomes `done`, so a poller that
        stops at `done` sees it.
      required: [runId, state, startedAt, matterId, question, progress, warnings]
      properties:
        warnings:
          type: array
          items:
            type: string
          description: '`CODE:<Türkçe>` strings; empty when nothing went wrong around the run.'
        runId:
          type: string
        state:
          type: string
          enum: [running, done, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        matterId:
          type: string
          nullable: true
        question:
          type: string
        progress:
          type: object
          required: [steps, toolCalls, fetches]
          properties:
            steps:
              type: array
              items:
                $ref: "#/components/schemas/ResearchProgressStep"
            toolCalls:
              type: integer
            fetches:
              type: integer
        result:
          $ref: "#/components/schemas/LiveResearchResult"
        error:
          type: object
          required: [kind, message]
          properties:
            kind:
              type: string
            message:
              type: string
    ResearchBlock:
      type: object
      description: Additive block distinguishing a LIVE run from a corpus answer.
      required: [mode, toolCalls, fetchedDocuments, budgetSpent, upstream]
      properties:
        mode:
          type: string
          const: live
        toolCalls:
          type: array
          items:
            $ref: "#/components/schemas/ResearchToolCall"
        fetchedDocuments:
          type: array
          items:
            type: object
            required: [title, source, externalId, sha256]
            properties:
              title:
                type: string
              source:
                type: string
              externalId:
                type: string
              sha256:
                type: string
              injectionFlagged:
                type: boolean
                description: Injection heuristics fired on this document's text.
        budgetSpent:
          type: object
          properties:
            toolCalls:
              type: integer
            fetches:
              type: integer
            wallTimeMs:
              type: integer
        upstream:
          type: object
          properties:
            healthy:
              type: boolean
            notes:
              type: array
              items:
                type: string
    LiveResearchResult:
      allOf:
        - $ref: "#/components/schemas/AnswerResult"
        - type: object
          required: [research]
          properties:
            research:
              $ref: "#/components/schemas/ResearchBlock"
    ResearchHealth:
      type: object
      required: [gateway, state]
      properties:
        gateway:
          type: string
          enum: [ok, unreachable]
        toolCount:
          type: integer
          description: Transport-measured tool inventory (54 offline).
        state:
          type: string
          enum: [off, starting, ok, down]
          description: >
            W12-F launcher lifecycle of the MCP child: `off` (started
            without --with-mcp), `starting` (child spawned, not ready —
            answered without probing), `ok` (probe succeeded), `down`
            (child gone or probe failed).
    # --------------------------------------------------------------- drafting
    DraftTemplate:
      type: object
      required: [id, kind, title, description, requiredFields]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [dilekce, sozlesme]
        domain:
          type: string
          enum: [ozel-hukuk, ceza, idare, icra, genel]
          description: >
            Additive (W12-FIX2, P1-1b). Field of law the template belongs to;
            the drafting relevance gate (`src/drafting/relevance.ts`) parks
            evidence of an incompatible domain (a TCK provision under a kira
            cevap dilekçesi) in `unusedEvidence` with `unusedReason:
            DOMAIN_MISMATCH` instead of writing it as a Dayanak. As shipped:
            12 templates are `ozel-hukuk`, `icra-itiraz-dilekcesi` is `icra`
            (which also accepts özel hukuk evidence).
        title:
          type: string
        description:
          type: string
        requiredFields:
          type: array
          items:
            type: string
        fields:
          type: array
          description: >
            Additive (contract B): human-labeled input fields for form
            builders. `path` is the FULL request path
            ("matter.ekBilgiler.karar"), matching the `path` of 400 issues
            1:1. Consumers without this field fall back to requiredFields.
          items:
            $ref: "#/components/schemas/TemplateField"
    TemplateField:
      type: object
      required: [path, label, required]
      properties:
        path:
          type: string
        label:
          type: string
          description: Human Turkish label — never a machine path.
        placeholder:
          type: string
        multiline:
          type: boolean
        required:
          type: boolean
        kind:
          type: string
          enum: [text, list, party-list, event-list, date, number, select]
          description: >
            W12 form-builder hint. `list` / `party-list` / `event-list`
            inputs may be posted as a multiline string (one entry per line;
            parties as `Rol : Ad`, events as `GG.AA.YYYY — olay`) or as the
            structured array.
        options:
          type: array
          items:
            type: string
          description: "Choices for kind=select."
        help:
          type: string
        group:
          type: string
          description: One of the /v1/draft-templates `fieldGroups`.
    DraftVekil:
      type: object
      additionalProperties: false
      required: [ad]
      properties:
        ad:
          type: string
        baro:
          type: string
        sicilNo:
          type: string
        adres:
          type: string
    DraftParty:
      type: object
      required: [ad, rol]
      additionalProperties: false
      properties:
        ad:
          type: string
        rol:
          type: string
        tckn:
          type: string
          pattern: "^\\d{11}$"
          description: W12 HMK m.119 — T.C. kimlik numarası.
        vkn:
          type: string
          pattern: "^\\d{10}$"
        adres:
          type: string
        vekil:
          $ref: "#/components/schemas/DraftVekil"
    DraftEvent:
      type: object
      required: [metin]
      additionalProperties: false
      properties:
        tarih:
          type: string
        metin:
          type: string
    DraftMatter:
      type: object
      required: [taraflar, olaylar, talepler]
      additionalProperties: false
      properties:
        baslik:
          type: string
        mahkeme:
          type: string
          description: W12 — addressed court; renders the başlık line with the dative suffix.
        esasNo:
          type: string
        davaDegeri:
          type: string
        arabuluculuk:
          type: object
          additionalProperties: false
          required: [yapildi]
          properties:
            yapildi:
              type: boolean
              description: Also accepts "evet" / "hayır" (normalized before validation).
            tarih:
              type: string
            sonuc:
              type: string
        vekil:
          $ref: "#/components/schemas/DraftVekil"
        matterId:
          type: string
          nullable: true
          description: W12 — the dava dosyası this draft belongs to (persisted; filed automatically).
        tarih:
          type: string
          description: Document date, YYYY-MM-DD or GG.AA.YYYY (rendered GG.AA.YYYY).
        taraflar:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/DraftParty"
        olaylar:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/DraftEvent"
        talepler:
          type: array
          maxItems: 50
          items:
            type: string
        ekBilgiler:
          type: object
          description: Template-specific extra fields (see requiredFields).
    DraftRequest:
      type: object
      required: [kind, template, matter]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [dilekce, sozlesme]
        template:
          type: string
        matter:
          $ref: "#/components/schemas/DraftMatter"
        evidence:
          type: object
          additionalProperties: false
          properties:
            runId:
              type: string
              description: A stored answer's runId (POST /v1/answer response).
            fileIds:
              type: array
              maxItems: 20
              items:
                type: string
        instructions:
          type: string
    DraftParagraph:
      type: object
      required: [id, text, evidenceIds, supported, role]
      properties:
        id:
          type: string
        text:
          type: string
        evidenceIds:
          type: array
          items:
            type: string
          description: Ids into the draft's OWN evidence list — never anywhere else.
        supported:
          type: boolean
          description: >
            true = beyan/İRADE or evidence-bound; false = a legal assertion
            without verified backing (KAYNAKSIZ, counted in unsupportedCount).
        note:
          type: string
        role:
          type: string
        binding:
          description: >
            W12 — how the citations were established: `lexical` (the quote
            overlaps the paragraph text) or an entailment judgement accepted
            only from the server-side AI paragraph writer.
          oneOf:
            - type: string
              const: lexical
            - type: object
              required: [kind, score, judge]
              properties:
                kind:
                  type: string
                  const: entailment
                score:
                  type: number
                  minimum: 0
                  maximum: 1
                judge:
                  type: string
    DraftPatch:
      type: object
      description: PUT /v1/drafts/{id} body (contract [D]).
      required: [sections]
      additionalProperties: false
      properties:
        baseVersion:
          type: integer
          minimum: 1
          description: >
            Additive (W12-FIX): the version the client edited. When present and
            different from the stored version the save is refused with 409
            VERSION_CONFLICT (`currentVersion`, `baseVersion` in the error) so a
            stale tab never overwrites another save. Absent = last writer wins.
        reviewChecklist:
          type: object
          description: >
            Additive (W14 B-36, L-EVID). The three pre-filing verification
            boxes, keyed `citationsOpened` ("Her [K-n] kaynağını açıp
            okudum"), `unsupportedReviewed` ("Her ⚠ KAYNAKSIZ paragrafı
            gözden geçirdim") and `contraryRead` ("KARŞI İÇTİHAT bölümünü
            okudum"). An unknown key is IGNORED AND REPORTED, never invented.
            A PUT that says nothing about the record KEEPS it; unticking a box
            reopens the document. It never blocks an export — while a box is
            unticked, every output (DOCX, UDF, Markdown, audit report) carries
            the line "Doğrulama tamamlanmadı: …".
          additionalProperties:
            $ref: "#/components/schemas/ReviewMark"
        evidenceReview:
          type: object
          description: >
            Additive (W14 B-36). Per-evidence review state, keyed by
            `evidenceId`.
          additionalProperties:
            $ref: "#/components/schemas/ReviewMark"
        sections:
          type: array
          maxItems: 40
          items:
            type: object
            required: [id, paragraphs]
            additionalProperties: false
            properties:
              id:
                type: string
              paragraphs:
                type: array
                maxItems: 400
                items:
                  type: object
                  required: [text]
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                      description: Existing paragraph id to keep; unknown/absent = new paragraph.
                    text:
                      type: string
                      maxLength: 20000
                    evidenceIds:
                      type: array
                      maxItems: 50
                      items:
                        type: string
                    role:
                      type: string
                    binding:
                      oneOf:
                        - type: string
                          const: lexical
                        - type: object
                          required: [kind, score, judge]
                          properties:
                            kind:
                              type: string
                              const: entailment
                            score:
                              type: number
                            judge:
                              type: string
        evidenceUse:
          type: object
          additionalProperties:
            type: boolean
          description: evidenceId -> use as HUKUKÎ SEBEP (true) or park it in unusedEvidence (false).
        note:
          type: string
          maxLength: 2000
    DraftSummary:
      type: object
      description: One row of GET /v1/drafts and /versions (W12).
      required: [draftId, version, kind, template, title, matterId, createdAt, unsupportedCount]
      properties:
        draftId:
          type: string
        version:
          type: integer
        kind:
          type: string
        template:
          type: string
        title:
          type: string
        matterId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: updatedAt of that version when present (so listings sort by activity).
        updatedAt:
          type: string
          format: date-time
          description: >
            Additive (W14 B-26). Pass-through of the version's own timestamp,
            so the version list stops showing two rows with the same date.
        unsupportedCount:
          type: integer
    DraftSuggestedFact:
      type: object
      description: A fact-like sentence found in an uploaded exhibit — never auto-inserted (W12).
      required: [metin, fileId, chunkId]
      properties:
        tarih:
          type: string
        metin:
          type: string
        fileId:
          type: string
        chunkId:
          type: string
    DraftSection:
      type: object
      required: [id, title, paragraphs]
      properties:
        id:
          type: string
        title:
          type: string
        paragraphs:
          type: array
          items:
            $ref: "#/components/schemas/DraftParagraph"
    DraftEvidence:
      type: object
      required: [evidenceId, label, source, title, quote, quoteSha256, contentSha256]
      properties:
        evidenceId:
          type: string
        label:
          type: string
        source:
          type: string
        title:
          type: string
        court:
          type: string
        decisionDate:
          type: string
        docketNo:
          type: string
        decisionNo:
          type: string
        legislationNo:
          type: string
        article:
          type: string
        quote:
          type: string
        quoteSha256:
          type: string
          description: SHA-256 hex over the UTF-8 bytes of `quote`.
        contentSha256:
          type: string
          description: SHA-256 hex over the UTF-8 bytes of the full source text.
        direction:
          type: string
          enum: ["destekleyen", "karşıt", "yön belirtmez"]
          description: >
            Additive (contract A): which way the evidence points relative to
            the request. "karşıt" evidence never renders under HUKUKÎ
            SEBEPLER; it lives in the optional karşı içtihat section
            (id "karsi-ictihat", title "DEĞERLENDİRİLMESİ GEREKEN KARŞI
            İÇTİHAT"), whose every paragraph carries the fixed avukat-decides
            note. Absent = "yön belirtmez".
        fileId:
          type: string
          description: W12 — upload provenance (source UPLOAD entries).
        chunkId:
          type: string
        unusedReason:
          type: string
          enum: [DOMAIN_MISMATCH, NOT_RELEVANT]
          description: >
            Additive (W12-FIX2, P1-1b). Present only on `unusedEvidence`
            entries the relevance gate parked: `DOMAIN_MISMATCH` (the entry's
            field of law — derived from court, legislation number, title and
            source family — is incompatible with the template's `domain`) or
            `NOT_RELEVANT` (no lexical overlap with the matter's own text,
            judged with the coverage gate's tokenizer). An entry explicitly
            referenced by the matter (kanun no + madde, esas no) is never
            parked. The draft carries one Turkish warning and a machine line
            `DOMAIN_MISMATCH:<id>` / `NOT_RELEVANT:<id>`; `evidenceUse:true`
            on PUT pulls the entry in and clears the mark. Absent on used
            entries and on merely-uncited unused entries.
    Draft:
      type: object
      description: >
        collex.draft/v1 — an evidence-disciplined document skeleton. W12:
        body citations read `Dayanak [K-n]: <künye>` (n = 1-based index
        into `evidence`); hashes and ids live only in the machine-owned
        final section `ek-dogrulama` (EK — DOĞRULAMA BİLGİLERİ) and the
        appendix; all user-facing dates are GG.AA.YYYY.
      required:
        [schema, draftId, kind, template, title, createdAt, version, reviewRequired,
         sections, evidence, unusedEvidence, suggestedFacts, unsupportedCount, warnings, synthetic]
      properties:
        schema:
          type: string
          const: collex.draft/v1
        persisted:
          type: boolean
          description: >
            Additive (W12-FIX, HTTP responses only — not stored). Whether this
            version reached the database. `false` comes with the Turkish warning
            in `warnings` and `DRAFT_PERSIST_FAILED:<Türkçe>` in `machineWarnings`;
            the draft is still served from the cache for the life of the process.
        draftId:
          type: string
        reviewChecklist:
          type: object
          description: >
            Additive (W14 B-36). `at` is the SERVER'S timestamp, not the
            client's — that is the whole value of the record. It travels
            forward across versions. Verbatim on every surface: "Bu kayıt bir
            doğrulama değildir: sistem doğrulamaz, avukatın doğruladığını
            kaydeder."
          additionalProperties:
            $ref: "#/components/schemas/ReviewMark"
        evidenceReview:
          type: object
          description: Additive (W14 B-36). Keyed by `evidenceId`.
          additionalProperties:
            $ref: "#/components/schemas/ReviewMark"
        kind:
          type: string
          enum: [dilekce, sozlesme]
        template:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: W12 — set by every revision.
        version:
          type: integer
          description: W12 — 1 for a new draft; PUT and the AI paragraph writer increment.
        matterId:
          type: string
          nullable: true
          description: W12 — owning matter (filed automatically).
        reviewRequired:
          type: boolean
          const: true
          description: ALWAYS true — a machine draft is never final.
        sections:
          type: array
          items:
            $ref: "#/components/schemas/DraftSection"
        evidence:
          type: array
          description: The closure set (entries cited by the document) + uploaded exhibits.
          items:
            $ref: "#/components/schemas/DraftEvidence"
        unusedEvidence:
          type: array
          description: W12 — validated entries the document does NOT use; never rendered; `evidenceUse` on PUT pulls one in.
          items:
            $ref: "#/components/schemas/DraftEvidence"
        suggestedFacts:
          type: array
          items:
            $ref: "#/components/schemas/DraftSuggestedFact"
        unsupportedCount:
          type: integer
          description: Number of paragraphs with supported:false (KAYNAKSIZ).
        warnings:
          type: array
          items:
            type: string
          description: Human Turkish warnings — no claim ids, no raw enums.
        machineWarnings:
          type: array
          items:
            type: string
          description: >
            Additive: machine-audience diagnostics (claim ids, raw verdict
            enums) behind the human `warnings`. Never rendered to the lawyer.
        synthetic:
          type: boolean
          description: True when any bound evidence comes from the SENTETİK fixture corpus.
        syntheticNotice:
          type: string
    # ---------------------------------------------------------------- matters
    NewMatter:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        client:
