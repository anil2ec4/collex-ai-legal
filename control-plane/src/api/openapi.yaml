  /v1/matters/{id}/items/{itemId}:
    patch:
      operationId: updateMatterItem
      summary: Update an item (payload shallow-merged, then validated for its kind)
      description: >
        W12-FIX2 (P2-19): for `file`, `answer` and `draft` items the `refId`
        is IMMUTABLE — a body naming a different `refId` is refused with 400
        `INVALID_REQUEST` (issue path `refId`, message
        REF_ID_IMMUTABLE_MESSAGE_TR: "Belge, cevap ve taslak kayıtlarının
        referansı değiştirilemez; kaydı çıkarıp yeniden ekleyin.") and the
        filing is left untouched; the same `refId` with a payload change is
        a normal 200. `note` items keep the old behaviour.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          required: true
          schema:
