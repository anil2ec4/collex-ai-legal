              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/research/health:
    get:
      operationId: researchHealth
      summary: MCP gateway health (handshake + tools/list probe)
      description: >
        Performs the real MCP streamable-HTTP handshake and a paginated
        tools/list against the configured gateway; `toolCount` is the
        transport-level measurement of the 54-tool invariant. W12: `state`
        is the launcher's view of the gateway child (`starting` and `down`
        are answered without probing).
      responses:
        "200":
          description: Gateway reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchHealth"
        "503":
          description: Gateway unreachable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchHealth"
  /v1/draft-templates:
    get:
      operationId: listDraftTemplates
      summary: List the drafting template registry (13 templates)
      description: >
        W12: seven dilekçe templates (dava-dilekcesi, cevap-dilekcesi,
        istinaf-basvuru, temyiz-dilekcesi, ihtarname, icra-itiraz-dilekcesi,
