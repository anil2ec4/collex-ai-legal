    ReviewTableRequest:
      type: object
      additionalProperties: false
      required: [fileIds, questions]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        matterId: { type: string, format: uuid }
        fileIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 200 }
        questions:
          type: array
          minItems: 1
          maxItems: 10
          items:
            oneOf:
              - type: string
                minLength: 1
                maxLength: 1000
              - type: object
                additionalProperties: false
                required: [text]
                properties:
                  text: { type: string, minLength: 1, maxLength: 1000 }
                  mode:
                    type: string
                    enum: [answer, extract_dates, extract_amounts, extract_ratios]
                    default: answer
        asOf: { type: string, format: date }
        useLocalAi: { type: boolean }
    ReviewTableProgress:
      type: object
      description: >-
        Cells per state, counted as cells[].state reports them (W21 #17: a W20
        "abstention" whose run did not end in ABSTAIN counts as failed).
      required: [total, pending, running, done, failed, cancelled]
      properties:
        total: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        running: { type: integer, minimum: 0 }
        done: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
    ReviewTableSummary:
      type: object
      required: [tableId, title, status, createdAt]
      properties:
        tableId: { type: string, format: uuid }
        matterId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        status: { type: string, enum: [queued, running, done, cancelled] }
        options: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        cancelRequested: { type: boolean }
    ReviewTable:
      type: object
      required: [table, columns, rows, cells, progress]
      properties:
        table:
          $ref: "#/components/schemas/ReviewTableSummary"
        columns:
          type: array
          items:
            type: object
            required: [columnNo, question, mode]
            properties:
              columnNo: { type: integer, minimum: 1 }
              question: { type: string }
              mode: { type: string, enum: [answer, extract_dates, extract_amounts, extract_ratios] }
        rows:
          type: array
          items:
            type: object
            required: [rowNo, fileId]
            properties:
              rowNo: { type: integer, minimum: 1 }
              fileId: { type: string }
              fileName: { type: string, nullable: true }
              documentVersionId:
                type: string
                format: uuid
                nullable: true
                description: The version this row is pinned to. Every cell reads exactly this version (W21).
              currentDocumentVersionId:
                type: string
                format: uuid
                nullable: true
                description: W21 — the file current version now; null when the file is gone.
              stale:
                type: boolean
                description: >-
                  W21 — the pin is missing or differs from the current version. Cells
                  still read the pinned version. WHY the row is stale is in staleReason;
                  stale does not mean a newer upload exists.
              staleReason:
                type: string
                nullable: true
                enum: [newer_version, file_deleted, pin_gone, no_readable_current]
                description: >-
                  W21 — why the row is stale; null exactly when stale is false.
                  newer_version: a newer published version of the file exists.
                  file_deleted: the file itself was deleted (a new table cannot
                  include it). pin_gone: the file exists but the pinned version
                  was deleted or can no longer be read exactly. no_readable_current:
                  the pin is readable but the file has no readable current version
                  (a newer upload failed or is still being processed).
        cells:
          type: array
          items:
            type: object
            required: [rowNo, columnNo, state, attempts, provenance]
            properties:
              rowNo: { type: integer, minimum: 1 }
              columnNo: { type: integer, minimum: 1 }
              state:
                type: string
                enum: [pending, running, done, failed, cancelled]
                description: >-
                  W21 (#17) — a cell stored as done by the W20 worker as an
                  abstention although its answer run did not end in ABSTAIN (the
                  run could not finish) is reported as failed, with the
                  ANSWER_INCOMPLETE error and no answer fields; it can be retried.
                  progress counts it as failed too. The stored row is unchanged.
              attempts: { type: integer, minimum: 0 }
              answerStatus: { type: string, nullable: true }
              answerText:
                type: string
                nullable: true
                description: >-
                  W21 (#18, CB3) — an abstention speaks about the passages retrieved
                  for the question ("Bu soru için getirilen pasajlarda ...; belgenin
                  tamamı taranmadı."). "Bu belgede karşılığı bulunamadı — şu
                  sözcüklerin geçtiği bir yer yok: ..." appears only for words
                  verified absent from the whole pinned text, i.e. only in a cell
                  whose generatorVersion is grid-v3 or later; an older cell's
                  abstention is re-stated passage-scoped, keeping the words it named.
                  W21 round two (R2-22) — an extract_* census never says a value is
                  absent from the document: it lists (or finds no) values IN THE
                  RECOGNISED FORMATS and names them ("Belgenin tamamı okundu;
                  tanınan biçimlerde yazılmış bir tarih bulunmadı (tanınan
                  biçimler: ...)"), and names by example date/amount-like text it
                  could not read (then answerStatus is PARTIAL). A census stored
                  before grid-v4, or counted with an extractor older than the
                  current one (grid-v4 and grid-v5 cells), is reported with
                  answerStatus PARTIAL and a text that starts "Bu hücre, bazı
                  yazımları tanımayan eski bir sayımla hesaplandı"; its old
                  whole-document sentence is not repeated.
              supportState:
                type: string
                nullable: true
                enum: [verified, partially_verified, unverified, abstained, no_evidence, exhaustive_complete, exhaustive_incomplete]
                description: >-
                  exhaustive_complete / exhaustive_incomplete are the READING
                  coverage of a census (every page of the pinned version read or
                  not). Whether the census itself is complete is answerStatus:
                  COMPLETE only when it also met no value-like text it could not
                  read (W21 R2-22). partially_verified is a verifier verdict on a
                  claim whose passage support WAS judged — a claim the judge never
                  assessed is not stored (see error; W21 R2-21).
              provenance:
                type: array
                items:
                  type: object
                  required: [fileId, documentVersionId, startChar, endChar, quoteSha256]
                  properties:
                    fileId: { type: string }
                    documentVersionId: { type: string }
                    chunkId: { type: string }
                    startChar: { type: integer, minimum: 0 }
                    endChar: { type: integer, minimum: 1 }
                    quoteSha256: { type: string }
                    locator: { type: string }
              processingCoverage:
                allOf:
                  - $ref: "#/components/schemas/ProcessingCoverage"
                nullable: true
              answerRunId: { type: string, nullable: true }
              generatorVersion:
                type: string
                nullable: true
                description: >-
                  The worker version that finished the cell. grid-v3 (W21): answer
                  cells follow CB2 (an unfinished run fails) and CB3 (the absolute
                  sentence only after a whole-text check). grid-v2 (W20): neither;
                  such cells are reported as described for state and answerText.
                  grid-v4 (W21 round two): R2-21, R2-23 and R2-24 as described for
                  error; census cells counted with extract-v3 or later and scoped to the
                  recognised formats (R2-22). grid-v5 and grid-v6 (the closing
                  re-checks) move with the census extractor (grid-v6 counts with
                  extract-v7, which reads no exchange rate as an amount); answer
                  cells are unchanged since grid-v4. A census cell of an older
                  generator is re-stated as described for answerText.
              error:
                type: string
                nullable: true
                description: >-
                  Why the cell has no answer. W21 — an answer run the pipeline
                  could not finish (time budget spent, retrieval or drafter failed)
                  is not stored as an abstention: the cell fails (retryable) with
                  "Bu hücre tamamlanamadı: arama başarısız oldu ya da süre doldu;
                  yeniden deneyin." A failed or re-queued cell carries no previous
                  answer text. W21 round two — a spent time budget fails the cell
                  only when the run has no claim; claims drafted and verified before
                  the budget ran out are stored (R2-24). A claim whose passage
                  support the judge never assessed (ENTAILMENT_NOT_CHECKED) fails
                  the cell, retryably: "Bu hücre tamamlanamadı: cevap cümlesi
                  yazıldı, ama pasajın bu cümleyi destekleyip desteklemediği
                  denetlenemedi ..." (R2-21). An abstention from a search in which
                  an exact, lexical, trigram or dense lane failed fails the cell,
                  retryably: "Bu hücre tamamlanamadı: arama şeritlerinden biri
                  başarısız oldu ..." (R2-23).
        progress:
          $ref: "#/components/schemas/ReviewTableProgress"
        modesTr: { type: object, additionalProperties: { type: string } }
        supportTr: { type: object, additionalProperties: { type: string } }
        sourceChanged:
          type: array
          description: W21 — file ids whose current version differs from the row pin.
          items: { type: string }
        stale:
          type: boolean
          description: W21 — at least one row is stale (see rows[].stale).
    AnalysisTaskProgress:
      type: object
      required: [stage, state, count]
      properties:
        stage:
          type: string
          enum: [weigh_claim, weigh_defense, contradiction_group, synthesis_group, synthesis_reduce]
        state:
          type: string
          enum: [pending, running, done, failed, excluded]
        count: { type: integer, minimum: 0 }
    ExtractionCoverage:
      type: object
      description: >-
        W21 — what structured (model-assisted) extraction achieved, separate
        from processingCoverage (what was read). A unit counts as succeeded
        only when nothing was truncated and every proposed item was grounded
        in the source; rejected or ambiguous quotes keep it incomplete.
      required: [required, unitsRequiringStructuredExtraction, unitsExtractionSucceeded, complete, gapsTr]
      properties:
        required: { type: boolean }
        unitsRequiringStructuredExtraction: { type: integer, minimum: 0 }
        unitsExtractionAttempted: { type: integer, minimum: 0 }
        unitsExtractionSucceeded: { type: integer, minimum: 0 }
        unitsExtractionIncomplete: { type: integer, minimum: 0 }
        unitsExtractionFailed: { type: integer, minimum: 0 }
        unitsExtractionPending: { type: integer, minimum: 0 }
        generatedItems: { type: integer, minimum: 0 }
        acceptedGroundedItems: { type: integer, minimum: 0 }
        malformedItems: { type: integer, minimum: 0 }
        rejectedQuotes: { type: integer, minimum: 0 }
        ambiguousQuotes: { type: integer, minimum: 0 }
        truncatedResponses: { type: integer, minimum: 0 }
        continuationPasses: { type: integer, minimum: 0 }
        repairPasses: { type: integer, minimum: 0 }
        complete: { type: boolean }
        gapsTr:
          type: array
          items: { type: string }
    IntelligenceCoverage:
      type: object
      description: >-
        W21 — which analytical stages reached a terminal, successful state.
        claimsWeighed counts a claim only when every candidate batch of it
        finished and was answered; a claim the planner never gave a task is
        pending, never weighed.
      required: [requiredStages, claimsTotal, claimsWeighed, defensesTotal, defensesWeighed, complete, gapsTr]
      properties:
        requiredStages:
          type: array
          items:
            type: string
            enum: [deterministic_relations, claim_weighing, defense_weighing, semantic_contradictions, synthesis]
        claimsTotal: { type: integer, minimum: 0 }
        claimsWeighed: { type: integer, minimum: 0 }
        claimsFailed: { type: integer, minimum: 0 }
        claimsPending: { type: integer, minimum: 0 }
        claimsUnresolved: { type: integer, minimum: 0 }
        defensesTotal: { type: integer, minimum: 0 }
        defensesWeighed: { type: integer, minimum: 0 }
        defensesFailed: { type: integer, minimum: 0 }
        defensesPending: { type: integer, minimum: 0 }
        defensesUnresolved: { type: integer, minimum: 0 }
        evidenceItemsTotal: { type: integer, minimum: 0 }
        evidenceCandidateAnalysesPlanned: { type: integer, minimum: 0 }
        evidenceCandidateAnalysesCompleted: { type: integer, minimum: 0 }
        claimsWithCompleteSearch: { type: integer, minimum: 0 }
        contradictionGroupsTotal: { type: integer, minimum: 0 }
        contradictionGroupsProcessed: { type: integer, minimum: 0 }
        contradictionPairsTotal: { type: integer, minimum: 0 }
        contradictionPairsClassified: { type: integer, minimum: 0 }
        semanticContradictionLane:
          type: string
          enum: [PERFORMED, NOT_REQUIRED, NOT_AVAILABLE]
        synthesisGroupsTotal: { type: integer, minimum: 0 }
        synthesisGroupsProcessed: { type: integer, minimum: 0 }
        synthesisLevels: { type: integer, minimum: 0 }
        unresolvedStages:
          type: array
          items: { type: string }
        failedStages:
          type: array
          items: { type: string }
        truncatedStages:
          type: array
          items: { type: string }
        finalized: { type: boolean }
        complete: { type: boolean }
        gapsTr:
          type: array
          items: { type: string }
    AnalysisCompleteness:
      type: object
      description: >-
        W21 — source, extraction and analysis coverage combined in exactly one
        place. complete is true only when all three are complete.
      required: [state, sourceComplete, extractionComplete, intelligenceComplete, complete, headlineTr, sectionsTr, refusedBecause]
      properties:
        state:
          type: string
          enum: [COMPLETE, INCOMPLETE, IN_PROGRESS]
        sourceComplete: { type: boolean }
        extractionComplete: { type: boolean }
        intelligenceComplete: { type: boolean }
        complete: { type: boolean }
        headlineTr: { type: string }
        sectionsTr:
          type: object
          required: [source, extraction, analysis]
          properties:
            source: { type: string }
            extraction: { type: string }
            analysis: { type: string }
        refusedBecause: { type: string, nullable: true }
    MatterAnalysisRun:
      type: object
      required: [runId, matterId, task, status, createdAt]
      properties:
        runId: { type: string, format: uuid }
        matterId: { type: string, format: uuid }
        task: { type: string }
        status:
          type: string
          enum: [queued, mapping, aggregating, reducing, done, failed, cancelled]
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
        processingCoverage:
          allOf:
            - $ref: "#/components/schemas/ProcessingCoverage"
          nullable: true
        coverageSummary: { type: string, nullable: true }
        exhaustiveClaimRefusedBecause: { type: string, nullable: true }
        taskTitle: { type: string }
        cancelRequested: { type: boolean }
        resumed:
          type: boolean
          description: POST only — true when the identical active run was joined.
        progress:
          $ref: "#/components/schemas/MatterAnalysisProgress"
        stale:
          type: boolean
          description: >-
            The run no longer speaks for the matter as it is now: a pinned file
            has a newer version or was deleted (sourceChanged), a document was
            added to the matter after a whole-matter run (sourceAdded), or a
            pinned document left the matter (sourceRemoved). W21: a stale run
            is never reported complete (analysisCompleteness.complete false,
            exhaustiveClaimRefusedBecause set).
        sourceChanged:
          type: array
          items: { type: string }
        sourceAdded:
          type: array
          description: W21 — documents of the matter this whole-matter run never read.
          items: { type: string }
        sourceRemoved:
          type: array
          description: W21 — documents this run read that are no longer in the matter.
          items: { type: string }
        summary: { type: object, additionalProperties: true }
        model: { type: string, nullable: true }
        limitsTr:
          type: array
          items: { type: string }
        links: { type: object, additionalProperties: { type: string } }
        analysisProgress:
          type: array
          description: W21 — analytical task counts by stage and state (claim weighing, contradiction batches, synthesis groups).
          items:
            $ref: "#/components/schemas/AnalysisTaskProgress"
        extractionCoverage:
          $ref: "#/components/schemas/ExtractionCoverage"
        intelligenceCoverage:
          $ref: "#/components/schemas/IntelligenceCoverage"
        analysisCompleteness:
          allOf:
            - $ref: "#/components/schemas/AnalysisCompleteness"
          nullable: true
          description: >-
            W21 — the ONLY field that may license the statement that the
            analysis is complete. processingCoverage.complete (every page read)
            may be true while this is false; the two are different claims.
        analysisComplete:
          type: boolean
          description: >-
            List views only — source read, extraction complete and every
            analytical stage complete (the same rule as analysisCompleteness).
    AnswerScope:
      type: object
      additionalProperties: false
      description: >
        WHERE TO SEARCH (W19 phase C), as opposed to `filters`, which says
        which documents to KEEP once found.


        `scope.matterId` is resolved to the matter's own uploads ON THE
        SERVER, so a browser never has to enumerate (and could not
        enumerate) the membership of a matter holding a hundred documents.
        Naming both a matter and explicit `fileIds` VERIFIES the ids against
        that membership; it never widens past the matter.


        Legacy `filters.fileIds` / `filters.includeCorpus` keep working
        unchanged; when both are present, `scope` wins.
      properties:
        matterId:
          type: string
          format: uuid
        fileIds:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 200
        includeCorpus:
          type: boolean
          description: >-
            Union the public corpus back in. Default false — matter evidence
            only.
  responses:
    PayloadTooLarge:
      description: >
        Additive (W12-FIX2, P2-13). The request body exceeds the server-wide
        limit enforced before any route runs — non-multipart bodies 1 MiB
        (`JSON_BODY_LIMIT_BYTES`), multipart bodies 40 MiB
        (`MULTIPART_BODY_LIMIT_BYTES`; the 25 MiB upload and 32 MiB OCR caps
        still apply per route). `Content-Length` is honoured and chunked bodies
        are counted. Body: `{ error: { kind: "PAYLOAD_TOO_LARGE", message:
        <Türkçe> } }`. Matter item routes additionally refuse a single item
        payload above 64 KiB (`MAX_ITEM_PAYLOAD_BYTES`) with the same kind.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
