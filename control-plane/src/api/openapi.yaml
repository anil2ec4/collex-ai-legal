openapi: 3.1.0
info:
  title: ColleX Control-Plane API
  version: 1.0.0
  description: >
    v1 surface of the ColleX research control-plane. Search responses are typed
    Outcome envelopes (ok / partial / error) mirroring the TypeScript contract
    in src/capabilities/types.ts. Response shapes only ever gain fields
    (additive evolution); existing fields never change meaning.


    Two families of route live here. `/v1/search` and `/v1/research-runs` fan
    out to the upstream MCP providers through the gateway. `/v1/answer` and the
    evidence-bundle routes answer from the LOCAL legal corpus and are
    citation-first: every material claim is bound to a passage of a specific
    document version, with the exact quote, its Unicode code-point span and the
    SHA-256 digests needed to re-derive it. A deployment may configure either
    family, both, or (for the operator console) only the corpus one — a route
    whose dependency is absent answers a typed 503 rather than an empty result.


    CORPUS PROVENANCE: every answer carries `corpusNotice`, and every evidence
    bundle carries `synthetic` / `syntheticNotice`. The only corpus this
    repository can ingest today is `evals/fixtures/corpus`, which is SYNTHETIC
    Turkish legal text authored for testing — not real legislation or case law.
servers:
  - url: http://127.0.0.1:8787
    description: Local server (node control-plane/scripts/serve.mjs)
paths:
  /:
    get:
      operationId: getConsole
      summary: Operator console (static, self-contained HTML)
      description: >
        One self-contained page — inline CSS and JS, no build step, no CDN —
        that drives POST /v1/answer and renders numbered kaynak cards, the five
        per-claim confidence dimensions, an explicit ÇEKİMSER (abstention)
        state, the Çelişen Otoriteler section and a collapsible trace timeline.
        Also served at `/console`.


        The page writes every untrusted value with `textContent` and creates a
        link only when the server already decided `sourceUrlAllowed`. The
        response carries a Content-Security-Policy that pins the page's own
        inline script and style by SHA-256 and denies every remote origin
        (`default-src 'none'`, `img-src 'none'`, `connect-src 'self'`).
      responses:
        "200":
          description: The console page
          headers:
            Content-Security-Policy:
              description: Hash-pinned policy derived from the served file.
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            text/html:
              schema:
                type: string
        "503":
          description: The console asset is absent from this build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /console:
    get:
      operationId: getConsoleAlias
      summary: Operator console (identical to GET /)
      responses:
        "200":
          description: The console page
          content:
            text/html:
              schema:
                type: string
        "503":
          description: The console asset is absent from this build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/answer:
    post:
      operationId: answer
      summary: Citation-first answer over the local legal corpus
      description: >
        Runs the full pipeline — normalize + parse references, hybrid retrieval
        with mandatory contrary-authority lanes, evidence-pack construction
        (quotes sliced from the canonical text, never from a search snippet),
        deterministic drafting behind a DrafterPort, verification, rendering —
        and returns the typed AnswerResult.


        Three invariants hold on every response: a search snippet is NEVER
        evidence; no claim finalizes without validated evidence; and an
        unanswerable question yields `status: ABSTAIN` with an empty `evidence`
        array rather than a guess. A corpus that could not be searched is
        `PARTIAL` with a warning — "we could not look" and "there is nothing to
        find" are different answers.


        `limits` may only LOWER the retrieval work: each dimension is clamped
        to the server tier (`min(requested, tier)`, and `max` for
        `trigramMinSimilarity`, where a lower threshold means more rows).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: A verified (or honestly abstaining) answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResult"
        "400":
          description: Request validation or intake validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >
            NEW in W14 (B-26): `filters.fileIds` names a document that no
            longer exists. Checked BEFORE retrieval; the body is
            `FILE_NOT_FOUND` with "Belge kaydı bulunamadı; silinmiş olabilir."
            and `missingFileIds[]`. Previously the file scope collapsed to the
            empty set, every lane came back empty and the answer was ABSTAIN —
            which reads on screen as a sentence ABOUT the document when the
            truth is that the document is gone. The check is never a NEW
            failure path: if the store cannot answer, the request proceeds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          description: >
            The pipeline itself terminated abnormally. The body carries the
            typed kind ANSWER_FAILED only; the underlying message is never
            echoed because it can contain a connection string.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >
            No answer pipeline is configured on this instance (kind
            ANSWER_UNAVAILABLE). This is NOT an empty corpus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/evidence-bundle:
    post:
      operationId: createEvidenceBundle
      summary: Answer a question and return only the structured evidence bundle
      description: >
        Same request contract and same work as POST /v1/answer, but the
        response is only the `collex.answer.evidence-bundle/v1` document. The
        run is still cached, so GET /v1/answers/{runId} works afterwards.


        EXPORTER COMPATIBILITY: this is exactly the shape the Python exporter
        in `export/` consumes (`export/bundle.py`, constant `BUNDLE_SCHEMA`).
        Piping this response into `python -m export.cli` produces the DOCX /
        Markdown evidence bundle without any transformation. Keep the two in
        step: the exporter rejects a missing or wrongly typed field rather than
        defaulting it, because a silently defaulted citation field is what
        turns a verifiable document into a merely plausible one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: The evidence bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceBundle"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          description: No answer pipeline is configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/answers:
    get:
      operationId: listAnswers
      summary: List stored answers (newest first), optionally one matter's or one document's
      description: >
        W12 (contract [P]). Summaries only — no evidence, no texts. With the
        durable store (serve.mjs) the list survives restarts; the in-memory
        store lists what it still caches. `mode` distinguishes a local corpus
        answer from a live research run. W12-API2: `fileId` narrows the list
        to the answers asked over one uploaded document (those whose
        `fileScope.fileIds` contains the id — the "Bu belgeye sorulan
        sorular" list); combinable with `matterId`.
      parameters:
        - name: matterId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: fileId
          in: query
          required: false
          description: >
            An upload id from /v1/files. Only answers whose `fileScope.fileIds`
            contains it are returned (jsonb containment on the durable
            store). Whitespace or more than 200 characters is a 400.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: q
          in: query
          required: false
          description: >
            Additive (W14 B-26, wired by W14-F-API for V-6). Turkish-folded,
            case-insensitive substring filter over the question. Until the
            F-API pass the parameter reached the route and was SILENTLY
            DROPPED (`?q=zzzzunlikely` returned the unfiltered list); it now
            really filters. An empty or whitespace-only value is NOT a filter
            (old behaviour, 200). More than 200 code points is a 400.
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          required: false
          description: >
            Additive (W14 B-26, wired by W14-F-API for V-6). Filters by the
            stored answer status. An unrecognized value is a 400 that lists
            the four accepted ones, never a quietly unfiltered list. An empty
            value is NOT a filter.
          schema:
            type: string
            enum: [COMPLETE, QUALIFIED, PARTIAL, ABSTAIN]
        - name: limit
          in: query
          required: false
          description: Clamped to 1..200 (default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                type: object
                required: [answers]
                properties:
                  answers:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnswerSummary"
        "400":
          description: >
            Malformed `matterId` / `fileId` / `limit`, a `q` over 200 code
            points, a `status` outside COMPLETE|QUALIFIED|PARTIAL|ABSTAIN, or
            (W14-F-API, V-6) an UNRECOGNIZED query parameter — the issue names
            it and lists the accepted ones, the same contract `GET /v1/files`
            already enforced. This is the one non-additive behaviour change of
            the F-API pass, and it replaces a filter that used to be dropped
            in silence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Local database unreachable (STORE_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/answers/{runId}:
    get:
      operationId: getAnswer
      summary: Fetch a stored AnswerResult
      description: >
        Answers are cached in a BOUNDED in-memory store (oldest evicted first),
        because each one holds the canonical text of every document it quoted;
        with the durable store (W12, serve.mjs) a run that left the cache is
        loaded back from app_private.answers before the lookup. A run that
        exists nowhere returns 404; re-POST the question to recompute.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The cached answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResult"
        "404":
          description: Unknown or evicted run id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAnswer
      summary: Delete a stored research record
      description: >
        W14 B-26 (L-MATTER). Removes the cache entry AND the row, and drops
        the matter item that pointed at it — nothing is left orphaned. A
        second call is a 404.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted (no body)
        "404":
          description: Unknown runId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: STORE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/answers/{runId}/evidence-bundle:
    get:
      operationId: getEvidenceBundle
      summary: Structured evidence bundle for a cached answer
      description: >
        Returns `collex.answer.evidence-bundle/v1` — the same contract the
        Python exporter in `export/` consumes (see POST /v1/evidence-bundle).


        With `texts=true` the response additionally carries the canonical NFC
        text of every quoted document version. That upgrades verification from
        "the quote re-hashes to its recorded digest" to the full chain "the
        canonical text hashes to contentSha256 AND the recorded code-point span
        really yields this exact quote". It is off by default because the texts
        are large.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: texts
          in: query
          required: false
          description: Set to `true` to include the canonical document texts.
          schema:
            type: string
            enum: ["true"]
      responses:
        "200":
          description: The evidence bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceBundle"
        "404":
          description: Unknown or evicted run id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness, capability inventory and system status (contract [H])
      description: >
        The original fields never change. The W12 additions are bounded (one
        3 s budget shared by the database probe and the corpus count) and the
        route never throws: `db` is `off` on an instance without a database
        client, `down` when the configured database does not answer,
        `missing` when it answers but the schema is absent, `ok` otherwise.
        `mcp` is the launcher's view of the MCP gateway child; `ai` says
        whether cloud AI is configured (never the key) and that it has not
        been live-tested; `corpus` is null unless `db` is `ok`. W21:
        `dataBoundary` is the EFFECTIVE boundary (the AI policy can force
        LOCAL_ONLY); `aiPolicy` and `ocr` are additive.
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, service, time, capabilities, registeredToolCount]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                  time:
                    type: string
                    format: date-time
                  capabilities:
                    type: array
                    items:
                      type: string
                  registeredToolCount:
                    type: integer
                  db:
                    type: string
                    enum: [off, ok, missing, down]
                  dbName:
                    type: string
                    nullable: true
                  migrations:
                    type: object
                    nullable: true
                    required: [applied, expected, missing]
                    properties:
                      applied:
                        type: integer
                      expected:
                        type: integer
                      missing:
                        type: array
                        items:
                          type: string
                      unknown:
                        type: array
                        items:
                          type: string
                        description: >
                          Additive (W14 B-45/E15). Files the LEDGER records
                          that are not on disk: the database is NEWER than
                          this build. The console prints "Veritabanı bu
                          sürümden daha yeni (N bilinmeyen migrasyon) —
                          ColleX'i güncelleyin."
                  rls:
                    type: object
                    nullable: true
                    description: >
                      Additive (W14 B-05, L-SAFE). Row-level-security policies
                      present vs expected. `present < expected` means a
                      migration ran only half-way and client rows are
                      UNPROTECTED — the console turns that red. A complete
                      database has 18 (12 from the RLS migration, 5 matters,
                      1 the W14 AI ledger).
                    required: [expected, present]
                    properties:
                      expected:
                        type: integer
                      present:
                        type: integer
                  backup:
                    description: >
                      Additive (W14 B-03, L-SAFE). The newest backup on
                      record, or `null` — and `null` is a red banner
                      ("Henüz hiç yedek alınmadı — verileriniz tek bir
                      diskte."), not a blank.
                    oneOf:
                      - $ref: "#/components/schemas/BackupSummary"
                      - type: "null"
                  mcp:
                    type: string
                    enum: [off, starting, ok, down]
                  ai:
                    type: object
                    required: [configured, model, liveTested]
                    properties:
                      configured:
                        type: boolean
                      model:
                        type: string
                        nullable: true
                      liveTested:
                        type: boolean
                        const: false
                  localAi:
                    type: object
                    additionalProperties: true
                    description: >
                      W19: the local generation lane as configured (state,
                      model, trust, reason, roles). Configured is not
                      reachable; it is never probed from health.
                  dense:
                    type: object
                    additionalProperties: true
                    description: >
                      W20: the dense lane (ACTIVE / DEGRADED / DISABLED /
                      FAILED) with a Turkish reason; ACTIVE only when a query
                      can be embedded right now.
                  dataBoundary:
                    type: string
                    enum: [LOCAL_ONLY, ALLOW_CLOUD]
                    description: >
                      The data boundary IN FORCE. W21 changed its meaning from
                      the configured COLLEX_DATA_BOUNDARY to the EFFECTIVE
                      boundary: an AI policy of LOCAL_ONLY or
                      DETERMINISTIC_ONLY reports LOCAL_ONLY here even when the
                      variable says ALLOW_CLOUD.
                  aiPolicy:
                    $ref: "#/components/schemas/AiPolicyHealth"
                  ocr:
                    description: >
                      W21: can this computer read scanned pages? Probed once
                      per process (python -m intake.ocr --status); null until
                      the first probe answers or when no probe is wired. Only
                      OCR_READY means scanned pages can be read.
                    oneOf:
                      - $ref: "#/components/schemas/OcrStatus"
                      - type: "null"
                  demoCorpus:
                    type: boolean
                    description: True when the database is the demo fixture load (collex_demo).
                  corpus:
                    type: object
                    nullable: true
                    required: [publicDocuments, uploads]
                    properties:
                      publicDocuments:
                        type: integer
                        description: legal.documents rows with scope 'public'.
                      uploads:
                        type: integer
                        description: scope 'tenant' AND source 'UPLOAD' (what GET /v1/files lists).
                  uploadsDir:
                    type: string
                    description: >
                      Additive (W14 M-SRV IR-1, raised by C-UI as IR-1 and by
                      C-FINAL §7(2)). ABSOLUTE path of the folder the uploaded
                      ORIGINALS live in: `<COLLEX_DATA_DIR>/uploads` when that
                      variable is set, `<repo>/var/uploads` otherwise. It is
                      the SAME string `createApp` gives the files router and
                      the matter packager — resolved once, so a screen can
                      never name a folder the download route does not read
                      (that disagreement was L-VERIFY V-4). Settings ›
                      "Verilerim nerede?" prints it as a location, which is
                      why a path is allowed here where a machine token would
                      not be.
                  templates:
                    type: integer
                    description: Drafting templates registered (13).
                  deadlineRules:
                    type: integer
                    description: >
                      Deadline rules registered. W14 B-11 raised this from 30
                      to 41 (16 `dogrulandi`, 25 still `dogrulanmadi`).
                      Clients should assert a LOWER BOUND, never an equality:
                      the next verification round adds rules.
                  version:
                    type: string
                    description: >
                      Read from the repo-root `VERSION` file (W14 B-34), which
                      a test pins equal to `pyproject.toml [project].version`.
                      The hand-edited `1.0.0-w12` constant is gone; the value
                      is now `1.0.0`.
                  platform:
                    type: string
                    description: >
                      Additive (W21 round two, R2-36). `process.platform` of
                      the server (`win32`, `darwin`, `linux`, ...). The console
                      chooses platform-specific sentences from it (File
                      Explorer on Windows, Finder on macOS).
                  operatorHints:
                    $ref: "#/components/schemas/OperatorHints"
  /v1/search:
    post:
      operationId: search
      summary: Normalized legal search across the capability surface
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              additionalProperties: false
              properties:
                query:
                  type: string
                  minLength: 1
                filters:
                  $ref: "#/components/schemas/SearchFilters"
                asOf:
                  type: string
                  format: date
                candidateLimit:
                  type: integer
                  minimum: 1
                  maximum: 50
      responses:
        "200":
          description: Outcome envelope (ok or partial) with SearchHit rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchOutcome"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "502":
          description: Typed provider error Outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchOutcome"
        "503":
          description: >
            No upstream provider gateway is configured on this instance (kind
            SEARCH_UNAVAILABLE). A corpus-only deployment serves POST
            /v1/answer instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/research-runs:
    post:
      operationId: createResearchRun
      summary: Create and drive a bounded research run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              additionalProperties: false
              properties:
                query:
                  type: string
                  minLength: 1
                dataClass:
                  type: string
                  enum: [public, client]
                budgets:
                  $ref: "#/components/schemas/ResearchBudgetsPatch"
      responses:
        "201":
          description: Run reached a terminal state
          content:
            application/json:
              schema:
                type: object
                required: [runId, status]
                properties:
                  runId:
                    type: string
                    format: uuid
                  status:
                    $ref: "#/components/schemas/RunStatus"
                  partialReason:
                    type: string
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          description: >
            The run terminated abnormally (a port threw). The run is persisted
            in a terminal `failed` state and remains retrievable via
            GET /v1/research-runs/{id}; the body always carries its runId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunFailure"
  /v1/research-runs/{id}:
    get:
      operationId: getResearchRun
      summary: Fetch the state of a research run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunState"
        "404":
          description: Unknown run id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/files:
    post:
      operationId: uploadFile
      summary: Upload one tenant document (quarantine -> extract -> ingest)
      description: >
        Multipart upload (field `file`; PDF, DOCX, TXT or UDF; 25 MB cap,
        pre-checked before any byte is stored). The API shells to the Python
        intake CLI, which quarantines the bytes (magic-byte/MIME sniff, ZIP
        safety), extracts and NFC-normalizes the text, runs the heuristic v1
        analysis and ingests through the SAME pipeline as the fixture corpus
        (immutable snapshot, append-only version, paragraph chunks with
        code-point offsets). `fileId` is the first 16 hex characters of the
        file's SHA-256 — re-uploading identical bytes returns the SAME
        document with a warning, never a duplicate.


        Scanned PDFs are FAIL-CLOSED: there is no OCR, so an image-only PDF
        answers 422 EXTRACTION_FAILED instead of silently ingesting an empty
        document.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                matterId:
                  type: string
                  format: uuid
                  description: >
                    W12: file the upload under this matter (a `file` item,
                    payload {fileName}). 404 MATTER_NOT_FOUND before the
                    upload starts when the matter does not exist.
      responses:
        "200":
          description: The ingested file (contract #1 IntakeResult body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadResult"
        "400":
          description: Invalid request (missing file, empty file, size cap)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: matterId names a matter that does not exist (MATTER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Unsupported or content/extension-mismatched type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: Extraction failed (e.g. scanned PDF; OCR is fail-closed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: >
            INTAKE_FAILED — the intake process ended abnormally. Additive
            (W12-FIX2, P2-14): the body carries `detail` ("Ayrıntı sunucu
            günlüğüne yazıldı (kayıt no: <uuid>)") and `correlationId`; the
            child's stderr is in the server log only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >
            Files lane not configured, or the local database refused the
            connection (STORE_UNAVAILABLE — the intake CLI answers it within
            ~6 s; the message names ColleX-Baslat.cmd).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: >
            The intake process overran its 180 s budget and was killed
            (UPLOAD_TIMEOUT); try a smaller file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listFiles
      summary: List the tenant's uploaded documents
      description: >
        Direct SQL read over the current (open system_period) version of every
        `scope='tenant'`, `source='UPLOAD'` document of the local tenant.
      parameters:
        - name: q
          in: query
          required: false
          description: W12 — Turkish-insensitive substring filter on the file name.
          schema:
            type: string
        - name: matterId
          in: query
          required: false
          description: >
            Additive (W14 B-26). REALLY filters. If the configured store
            cannot filter, the answer is a typed `400 FILTER_UNSUPPORTED` —
            never the full list pretending to be a filtered one.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Additive (W14 B-32). Default 50, ceiling 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          description: Additive (W14 B-32).
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Upload inventory
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileListEntry"
                  page:
                    type: object
                    description: >
                      Additive (W14 B-32). The list query was rewritten with
                      it: `chars` is read from
                      `metadata.fixture_meta.upload.chars` and only falls back
                      to `length(v.canonical_text)` when that is absent (the
                      detoast was 91 % of the measured query time), and the
                      chunk count is a `left join lateral` bound to the PAGE's
                      rows instead of a `group by` over all of `legal.chunks`.
                    properties:
                      offset:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
        "400":
          description: >
            INVALID_REQUEST (bad limit/offset) or FILTER_UNSUPPORTED — the
            store cannot apply the requested filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Local database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/files/{fileId}:
    get:
      operationId: getFile
