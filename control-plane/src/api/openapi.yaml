              type: string
        liveTested:
          type: boolean
          const: false
    AiDraftParagraphResult:
      type: object
      required: [draft, paragraph, entailment, threshold, kaynakli, warnings, issues, model, usage, liveTested]
      properties:
        draft:
          $ref: "#/components/schemas/Draft"
        paragraph:
          $ref: "#/components/schemas/DraftParagraph"
        entailment:
          type: array
          description: >
            One row per evidence id the model cited, in citation order. A row
            is one of three things: a binding the judge measured and kept
            (`kept: true`), one it measured and stripped (`kept: false`, a
            real `score`), or (W21 R2-29) one it could NOT check
            (`checked: false`). Only the first two are measurements.
          items:
            type: object
            required: [evidenceId, score, entails, kept, rationale]
            properties:
              evidenceId:
                type: string
              score:
                type: number
                description: >
                  The judge's 0-1 probability that the passage supports the
                  paragraph. On a row with `checked: false` it is a
                  placeholder 0, NOT a measurement: a client must not show it
                  as a weak link or as a shortfall below the threshold.
              entails:
                type: boolean
              kept:
                type: boolean
                description: >
                  The JUDGE's verdict (score ≥ threshold and entails). It is
                  not the saved binding: the reviser can still refuse a kept
                  binding (for example a karşıt decision under a legal role).
                  The bindings actually written are `paragraph.evidenceIds`; a
                  kept row whose id is missing there was refused by the reviser
                  and, on a paragraph that stayed sourced, is named in
                  `warnings` ("N kanıt bağı entailment denetimini geçti, ancak
                  taslağın dayanak kurallarınca kabul edilmedi …").
              rationale:
                type: string
                description: >
                  The judge's reason. On a row with `checked: false` it is the
                  fixed Turkish sentence "denetlenemedi — hakemin yanıtı
                  okunamadı ya da kendi içinde çelişkiliydi; bu kanıt bağı
                  paragrafa yazılmadı".
              checked:
                type: boolean
                const: false
                description: >
                  W21 R2-29. Present, and false, only on a binding the judge
                  could not check (its reply was unreadable, out of range, or
                  contradicted itself). Such a binding is never kept and is
                  listed in `warnings` as "N kanıt bağı denetlenemedi …", apart
                  from bindings below the threshold. Absent on every row the
                  judge actually scored. A transport failure of the judge
                  (timeout, network, HTTP, refusal, truncation) is not a row:
                  it fails the whole request and the draft is unchanged.
        threshold:
          type: number
          const: 0.85
        kaynakli:
          type: boolean
          description: >
            The SAVED paragraph's state, equal to `paragraph.supported`. True
            only when at least one binding passed the judge AND the reviser
            attached it to the paragraph it saved. `paragraph` is that saved
            paragraph, found by id or, on append / insertAfter, as the new
            paragraph the reviser saved under an id of its own (so
            `paragraph.id` can differ from any id the server generated). W21:
            when the judge kept a binding but the stricter reviser rejected
            it, `kaynakli` is false, `paragraph.note` is "KAYNAKSIZ — AI
            taslak; entailment eşiğini (≥%85) geçen kanıt bağı taslağın
            dayanak kurallarınca kabul edilmedi; avukat eklemeli" (never the
            "hiçbir kanıt … geçmedi" note), the draft's "Düzenleme notu: AI
            paragraf (…)" warning ends in "KAYNAKSIZ", and `entailment[].kept`
            still shows the judge's own verdict. With nothing kept and at
            least one `checked: false` row, the note is the "denetlenemedi"
            variant. If the paragraph cannot be found in the saved draft,
            `kaynakli` is false, `paragraph` is the paragraph as sent to the
            reviser with `supported: false`, and `warnings` says it was not
            counted as sourced.
        warnings:
          type: array
          items:
            type: string
        issues:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
        model:
          type: string
        usage:
          $ref: "#/components/schemas/AiUsage"
        liveTested:
          type: boolean
          const: false
    # ================================================== W14 schemas ==========
    # -------------------------------------------- citation audit (B-13, L-EVID)
    CitationAuditRequest:
      type: object
      required: [asOf]
      additionalProperties: false
      description: >
        Give `text` (the document to audit) or `citations` (already extracted).
        `asOf` is mandatory and is the DOCUMENT'S date.
      properties:
        text:
          type: string
        citations:
          type: array
          items:
            type: object
            required: [raw]
            properties:
              raw:
                type: string
              count:
                type: integer
        asOf:
          type: string
          format: date
        matterId:
          type: string
        documentTitle:
          type: string
    AuditBucket:
      type: string
      enum: [FOUND, NOT_FOUND, UNCERTAIN]
      description: >
        `NOT_FOUND` = "not in the sources we searched; it may be a fabricated
        künye". `UNCERTAIN` = "we could not decide: out of coverage, source
        unreachable, or the reference is incomplete" — it does NOT mean the
        authority is absent. The two are never rendered in the same colour.
    CitationAuditRow:
      type: object
      required: [raw, count, bucket, bucketLabel, kunye, documentVersionId, currency, currencyLabel, quoteVerified, quoteVerifiedLabel, contrary, reason, href, review]
      properties:
        raw:
          type: string
          description: The reference exactly as the document writes it.
        count:
          type: integer
        bucket:
          $ref: "#/components/schemas/AuditBucket"
        bucketLabel:
          type: string
          description: bulundu | bulunamadı | belirsiz
        kunye:
          type: string
          description: >
            EMPTY STRING when nothing was resolved. The engine never
            synthesizes a künye and the renderer leaves the cell blank — no
            "?", no dash, no guess.
        documentVersionId:
          type: string
        currency:
          type: string
          enum: [IN_FORCE, REPEALED, AMENDED, UNKNOWN]
        currencyLabel:
          type: string
        quoteVerified:
          type: string
          enum: [DOGRULANDI, DOGRULANMADI, ALINTI_YOK]
          description: SHA-256 comparison, never a similarity score.
        quoteVerifiedLabel:
          type: string
        contrary:
          type: array
          items:
            type: object
            required: [kunye, note]
            properties:
              kunye:
                type: string
              note:
                type: string
        reason:
          type: string
          description: Turkish reason; filled for UNCERTAIN rows only.
        href:
          type: string
        review:
          type: object
          required: [reviewed, by, at, note]
          properties:
            reviewed:
              type: boolean
            by:
              type: string
            at:
              type: string
            note:
              type: string
    CitationAuditReport:
      type: object
      required: [schema, asOf, matterId, documentTitle, generatedAt, rows, totals, reviewComplete, notices]
      properties:
        schema:
          type: string
          const: collex.citation-audit/v1
        asOf:
          type: string
          format: date
        matterId:
          type: string
        documentTitle:
          type: string
        generatedAt:
          type: string
          format: date-time
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CitationAuditRow"
        totals:
          type: object
          properties:
            FOUND:
              type: integer
            NOT_FOUND:
              type: integer
            UNCERTAIN:
              type: integer
        reviewComplete:
          type: boolean
        notices:
          type: array
          items:
            type: string
          description: Honesty sentences the renderer must print VERBATIM.
    # ------------------------------------------ contract review (B-24, L-EVID)
    ChecklistItem:
      type: object
      required: [id, label, terms]
      properties:
        id:
          type: string
        label:
          type: string
        terms:
          type: array
          items:
            type: string
        weakTerms:
          type: array
          items:
            type: string
          description: A weak match yields BELİRSİZ rather than VAR.
        note:
          type: string
    Checklist:
      type: object
      required: [id, title, items]
      properties:
        id:
          type: string
        title:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
    ReviewEvidence:
      type: object
      required: [evidenceId, label, quote, quoteSha256]
      description: >
        A hash-bound source. Only these may carry the word "risk", and only
        when the answer store holds the quote under `runId`; the printed label
        is then built from the STORED record, never from `label`.
      properties:
        evidenceId:
          type: string
        label:
          type: string
        quote:
          type: string
        quoteSha256:
          type: string
        runId:
          type: string
          description: >
            Additive (2026-09-27). The answer run that holds this quote.
            Without it the entry cannot be verified and sources nothing.
    ContractReviewRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        checklistId:
          type: string
        checklist:
          $ref: "#/components/schemas/Checklist"
        documentTitle:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ReviewEvidence"
        observations:
          type: array
          items:
            type: object
            required: [clauseIndex, text]
            properties:
              clauseIndex:
                type: integer
              text:
                type: string
              evidenceId:
                type: string
    ChecklistFinding:
      type: object
      required: [itemId, label, state, stateLabel, clauseNumbers, matchedTerm, note]
      properties:
        itemId:
          type: string
        label:
          type: string
        state:
          type: string
          enum: [VAR, YOK, BELIRSIZ]
        stateLabel:
          type: string
        clauseNumbers:
          type: array
          items:
            type: string
        matchedTerm:
          type: string
          description: WHY it matched — shown to the lawyer, not hidden.
        note:
          type: string
        clauseIndexes:
          type: array
          items:
            type: integer
          description: Additive. The clause indexes behind `clauseNumbers`, same order.
        clauseLabels:
          type: array
          items:
            type: string
          description: >
            Additive. Display labels behind `clauseNumbers` — "Özel Şartlar 1"
            when the numbering restarts under a section heading, "Giriş" for
            the unnumbered opening block, else "Madde 5".
        reasonCode:
          type: string
          enum: ["", NEGATED, WEAK_ONLY]
          description: Additive. Why a BELIRSIZ row is BELIRSIZ; "" otherwise.
        reason:
          type: string
          description: Additive. The Turkish sentence for `reasonCode`; "" otherwise.
        excerpt:
          type: string
          description: >
            Additive. The contract's own sentence the state rests on
            (whitespace collapsed, at most 300 code points, cut at word
            boundaries with "…"); "" for YOK.
        excerptClauseIndex:
          type: integer
          nullable: true
          description: Additive. The clause index of `excerpt`; null for YOK.
        matches:
          type: array
          description: Additive. Every matched sentence the state rests on (at most 5, primary first).
          items:
            type: object
            required: [clauseIndex, clauseNumber, clauseLabel, term, strength, negated, excerpt]
            properties:
              clauseIndex:
                type: integer
              clauseNumber:
                type: string
              clauseLabel:
                type: string
              term:
                type: string
              strength:
                type: string
                enum: [strong, weak]
              negated:
                type: boolean
              excerpt:
                type: string
    ClauseObservation:
      type: object
      required: [text, sourced, evidenceId, evidenceLabel]
      properties:
        text:
          type: string
          description: >
            When `sourced` is false the text ALREADY begins with
            `⚠ KAYNAKSIZ — ` and every inflection of "risk" has been replaced
            with "gözlem".
        sourced:
          type: boolean
        evidenceId:
          type: string
        evidenceLabel:
          type: string
    ClauseLine:
      type: object
      required: [clauseNumber, index, itemIds, observations]
      properties:
        clauseNumber:
          type: string
        index:
          type: integer
        label:
          type: string
          description: Additive. Display label ("Özel Şartlar 1", "Madde 5", "Giriş").
        itemIds:
          type: array
          items:
            type: string
        observations:
          type: array
          items:
            $ref: "#/components/schemas/ClauseObservation"
    PetitionAnalysisRequest:
      type: object
      required: [asOf]
      additionalProperties: false
      description: >
        Exactly one of `text` / `fileId`. `asOf` is the PETITION'S date, never
        today: currency is judged as the document was written.
      properties:
        text:
          type: string
          maxLength: 2000000
        fileId:
          type: string
          pattern: "^[0-9a-f]{16}$"
        asOf:
          type: string
          format: date
        matterId:
          type: string
        documentTitle:
          type: string
        own:
          type: boolean
          description: true when the analysed document is one of OUR OWN drafts.
    PetitionClaim:
      type: object
      required: [claimId, index, kind, kindLabel, heading, number, text]
      properties:
        claimId:
          type: string
          description: Positional id, "iddia-1".
        index:
          type: integer
        kind:
          type: string
          enum: [TALEP, VAKIA, HUKUKI_SEBEP, DIGER]
        kindLabel:
          type: string
        heading:
          type: string
          description: The section heading the claim fell under; "" when none.
        number:
          type: string
          description: Numbering as the document wrote it; "" when unnumbered.
        text:
          type: string
    ContraryLaneResult:
      type: object
      required: [kind, query, flipPhrase, state, stateLabel, hits, reason]
      properties:
        kind:
          type: string
          enum: [outcome_flip, dissent, insistence, unification, upheld, inadmissible]
        query:
          type: string
          description: The exact query that ran, or would have run.
        flipPhrase:
          type: string
        state:
          type: string
          enum: [BULUNDU, ARANDI_BULUNAMADI, CALISTIRILMADI, ARAMA_BASARISIZ]
          description: >
            CALISTIRILMADI and ARANDI_BULUNAMADI are DIFFERENT answers: "did
            not run" is never "found nothing".
        stateLabel:
          type: string
        hits:
          type: array
          description: >
            Künye rows. A search row is NOT evidence — it carries no digest
            and no offsets.
          items:
            type: object
            required: [kunye, note, href]
            properties:
              kunye:
                type: string
              note:
                type: string
              href:
                type: string
        reason:
          type: string
    UnsourcedFinding:
      type: object
      required: [sentenceIndex, alinti, line]
      properties:
        sentenceIndex:
          type: integer
        alinti:
          type: string
          description: The document's OWN sentence; nothing of ours is removed from it.
        line:
          type: string
          description: >
            ColleX's observation, prefixed "⚠ KAYNAKSIZ — ". Assessment words
            are replaced by "[…]"; this line may never call a claim weak,
            risky or wrong.
    PetitionClaimAnalysis:
      type: object
      required: [claim, sentenceCount, citations, citationTotals, contrary, unsourced]
      properties:
        claim:
          $ref: "#/components/schemas/PetitionClaim"
        sentenceCount:
          type: integer
        citations:
          type: array
          items:
            $ref: "#/components/schemas/CitationAuditRow"
        citationTotals:
          type: object
          properties:
            FOUND:
              type: integer
            NOT_FOUND:
              type: integer
            UNCERTAIN:
              type: integer
        contrary:
          type: object
          required: [baseTerm, flavor, lanes, sourceBound, note]
          properties:
            baseTerm:
              type: string
              description: >
                The concept or provision the lanes were built around; "" when
                none could be derived. A query string, never a künye.
            flavor:
              type: string
              enum: [general, divergence, aym]
            lanes:
              type: array
              items:
                $ref: "#/components/schemas/ContraryLaneResult"
            sourceBound:
              type: array
              description: Contrary authorities the citation resolver attached.
              items:
                type: object
                required: [kunye, note]
                properties:
                  kunye:
                    type: string
                  note:
                    type: string
            note:
              type: string
        unsourced:
          type: array
          items:
            $ref: "#/components/schemas/UnsourcedFinding"
    PetitionAnalysisReport:
      type: object
      required:
        [schema, asOf, matterId, documentTitle, own, generatedAt, summary, claims, citationAudit, totals, notices]
      properties:
        schema:
          type: string
          const: collex.petition-analysis/v1
        asOf:
          type: string
          format: date
        matterId:
          type: string
        documentTitle:
          type: string
        own:
          type: boolean
        generatedAt:
          type: string
          format: date-time
        summary:
          type: string
          description: >
            The CONSTANT honesty sentence. Verbatim on every report, never
            conditional, never carrying a number.
        claims:
          type: array
          items:
            $ref: "#/components/schemas/PetitionClaimAnalysis"
        citationAudit:
          $ref: "#/components/schemas/CitationAuditReport"
        totals:
          type: object
          required:
            [claims, sentences, byKind, citations, unsourcedSentences, contraryLanesBuilt, contraryLanesRun, contraryHits, claimsWithoutContraryQuery]
          properties:
            claims:
              type: integer
            sentences:
              type: integer
            byKind:
              type: object
              properties:
                TALEP:
                  type: integer
                VAKIA:
                  type: integer
                HUKUKI_SEBEP:
                  type: integer
                DIGER:
                  type: integer
            citations:
              type: object
              properties:
                FOUND:
                  type: integer
                NOT_FOUND:
                  type: integer
                UNCERTAIN:
                  type: integer
            unsourcedSentences:
              type: integer
            contraryLanesBuilt:
              type: integer
            contraryLanesRun:
              type: integer
              description: Lanes that actually executed (BULUNDU + ARANDI_BULUNAMADI).
            contraryHits:
              type: integer
            claimsWithoutContraryQuery:
              type: integer
        notices:
          type: array
          items:
            type: string
    ContractReviewReport:
      type: object
      required: [schema, documentTitle, checklistId, checklistTitle, generatedAt, clauseCount, findings, clauses, totals, notices]
      properties:
        schema:
          type: string
          const: collex.contract-review/v1
        documentTitle:
          type: string
        checklistId:
          type: string
        checklistTitle:
          type: string
        generatedAt:
          type: string
          format: date-time
        clauseCount:
          type: integer
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistFinding"
        clauses:
          type: array
          items:
            $ref: "#/components/schemas/ClauseLine"
        unattachedObservations:
          type: array
          description: >
            Additive. Observations whose `clauseIndex` names no clause of this
            text — returned with a Turkish `note`, never dropped.
          items:
            allOf:
              - $ref: "#/components/schemas/ClauseObservation"
              - type: object
                required: [clauseIndex, note]
                properties:
                  clauseIndex:
                    type: integer
                  note:
                    type: string
        totals:
          type: object
          properties:
            VAR:
              type: integer
            YOK:
              type: integer
            BELIRSIZ:
              type: integer
        notices:
          type: array
          items:
            type: string
    ReviewMark:
      type: object
      description: >
        W14 B-36 (L-EVID). One pre-filing verification box. `at` is the
        SERVER'S timestamp, never the client's — that is the whole value of
        the record. Verbatim honesty line on every surface: "Bu kayıt bir
        doğrulama değildir: sistem doğrulamaz, avukatın doğruladığını
        kaydeder."
      required: [checked]
      properties:
        checked:
          type: boolean
        at:
          type: string
          format: date-time
        by:
          type: string
        note:
          type: string
    # ------------------------------------------------------ fees (B-35, L-LEGAL)
    FeeTariffLine:
      type: object
      required: [id, title, group, kind, rate, amount, yenidenDegerlemeyeTabi, reference, verified, nasilDogrulanir, notes]
      properties:
        id:
          type: string
        title:
          type: string
        group:
          type: string
          enum: [harc, gider, vekalet, kesinlik]
        kind:
          type: string
          enum: [maktu, nispi, oran, sinir]
        rate:
          type: number
          nullable: true
          description: "`nispi`: per-mille (binde). `oran`: a fraction 0..1."
        amount:
          type: number
          nullable: true
          description: >
            TL for `maktu` / `sinir`. `null` means ColleX does NOT know this
            year's figure — an honest answer, not a defect.
        yenidenDegerlemeyeTabi:
          type: boolean
          description: >
            True when `amount` is the BASE written in the statute, raised
            every year by the yeniden değerleme oranı: the base is verified,
            the APPLICABLE figure is not.
        reference:
          type: object
          properties:
            legislationNo:
              type: string
            article:
              type: string
            label:
              type: string
        verified:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [dogrulandi, dogrulanmadi]
            date:
              type: string
            source:
              type: string
              description: >
                A `dogrulandi` line must name its article, its access date and
                mevzuat.gov.tr; a test rejects a sourceless one.
        nasilDogrulanir:
          type: string
        notes:
          type: array
          items:
            type: string
    FeeTariffResponse:
      type: object
      required: [year, years, groups, lines, disclaimer, note]
      properties:
        year:
          type: integer
        years:
          type: array
          items:
            type: integer
        groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/FeeTariffLine"
        disclaimer:
          type: string
          description: FEE_DISCLAIMER, verbatim on every fee response.
        note:
          type: string
    FeeComputeRequest:
      type: object
      required: [year, kind]
      additionalProperties: false
      properties:
        year:
          type: integer
        kind:
          type: string
          enum: [dava-harci, vekalet-ucreti, kesinlik-siniri]
        davaDegeri:
          type: number
        mahkeme:
          type: string
          enum: [sulh, asliye, kanun-yolu]
        yol:
          type: string
          enum: [hmk-istinaf, hmk-temyiz, iik-istinaf, iyuk-istinaf]
        overrides:
          type: object
          additionalProperties:
            type: number
          description: This year's figures, keyed by tariff line id.
    FeeStep:
      type: object
      required: [id, label, detail, amount, durum]
      properties:
        id:
          type: string
        label:
          type: string
        detail:
          type: string
        amount:
          type: number
          nullable: true
        durum:
          type: string
          enum: [hesaplandi, TUTAR_GEREKLI, BILGI]
        lineId:
          type: string
        kullaniciDegeri:
          type: boolean
        verified:
          type: string
          enum: [dogrulandi, dogrulanmadi]
    FeeComputation:
      type: object
      required: [year, kind, davaDegeri, steps, toplam, eksikKalemler, dogrulanmamisKalemler, warnings, disclaimer]
      properties:
        year:
          type: integer
        kind:
          type: string
        davaDegeri:
          type: number
          nullable: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/FeeStep"
        toplam:
          type: number
          nullable: true
          description: null whenever at least one step is TUTAR_GEREKLI.
        eksikKalemler:
          type: array
          items:
            type: string
        dogrulanmamisKalemler:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        disclaimer:
          type: string
        sinirSonucu:
          type: object
          description: Only for kind `kesinlik-siniri`.
          properties:
            yol:
              type: string
            sinir:
              type: number
              nullable: true
            kullaniciDegeri:
              type: boolean
            kanunYoluAcik:
              type: boolean
              nullable: true
            aciklama:
              type: string
    # ------------------------------------------------- sources (B-14/16/20)
    SourceCatalog:
      type: object
      required: [kaynaklar, tamMetinTurleri, icindeAramaTurleri]
      properties:
        kaynaklar:
          type: array
          items:
            type: object
            required: [id, ad, aile, arac]
            properties:
              id:
                type: string
              ad:
                type: string
              aile:
                type: string
                enum: [ictihat, mevzuat, kurul]
              arac:
                type: string
              daireSuzgeci:
                type: boolean
              tarihAraligi:
                type: boolean
              kararTurleri:
                type: array
                items:
                  type: string
        tamMetinTurleri:
          type: array
          items:
            type: object
            properties:
              tur:
                type: string
              ad:
                type: string
        icindeAramaTurleri:
          type: array
          items:
            type: object
            properties:
              tur:
                type: string
              ad:
                type: string
    ManifestSource:
      type: object
      required: [id, ad, aile, durum, durumNotu, sonErisim, arac, bagli, notlar]
      properties:
        id:
          type: string
        ad:
          type: string
        aile:
          type: string
          enum: [ictihat, mevzuat, kurul]
        durum:
          type: string
          enum: [acik, kapali, bilinmiyor]
        durumNotu:
          type: string
        sonErisim:
          type: string
          nullable: true
          description: >
            Null for EVERY source today: no per-source success log is kept and
            the value is not invented. The console prints "ölçülmedi".
        arac:
          type: string
        bagli:
          type: boolean
        notlar:
          type: array
          items:
            type: string
    ManifestGap:
      type: object
      required: [id, baslik, aciklama]
      properties:
        id:
          type: string
        baslik:
          type: string
        aciklama:
          type: string
    ToolReachability:
      type: object
      required: [tool, state, via, note]
      properties:
        tool:
          type: string
        state:
          type: string
          enum: [REACHABLE, NOT_YET_WIRED]
        via:
          type: array
          items:
            type: string
        note:
          type: string
    CoverageManifest:
      type: object
      required: [schema, olusturulma, ozet, kaynaklar, bilinenBosluklar, olculenSayilar, aracEnvanteri, durustlukNotu]
      properties:
        schema:
          type: string
          const: collex.sources.manifest/v1
        olusturulma:
          type: string
          format: date-time
        ozet:
          type: string
        kaynaklar:
          type: array
          items:
            $ref: "#/components/schemas/ManifestSource"
        bilinenBosluklar:
          type: array
          minItems: 5
          items:
            $ref: "#/components/schemas/ManifestGap"
        olculenSayilar:
          type: object
          description: >
            The ONLY numeric block, and every number in it was measured
            elsewhere (the registry, the tool inventory, /v1/health). An
            unmeasured field is `null` — never 0.
          properties:
            kayitliArac:
              type: integer
            baglananArac:
              type: integer
            baglanmayanArac:
              type: integer
            secilebilirKaynak:
              type: integer
            gecitAracSayisi:
              type: integer
              nullable: true
            yerelVeritabani:
              type: string
            yerelVeritabaniAdi:
              type: string
              nullable: true
            migrasyonUygulanan:
              type: integer
              nullable: true
            migrasyonBeklenen:
              type: integer
              nullable: true
            migrasyonEksik:
              type: array
              items:
                type: string
            yerelKorpus:
              type: object
              nullable: true
              additionalProperties:
                type: integer
            yerelKutuphaneAcik:
              type: boolean
            yerelKutuphaneBelge:
              type: integer
              nullable: true
        aracEnvanteri:
          type: array
          items:
            $ref: "#/components/schemas/ToolReachability"
        durustlukNotu:
          type: string
    SourceSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 2
          maxLength: 500
        sources:
          type: array
          items:
            type: string
          description: Catalog ids; empty means Yargıtay + Danıştay.
        exactPhrase:
          type: boolean
        excludeTerms:
          type: array
          maxItems: 10
          items:
            type: string
          description: >
            Applied CLIENT-SIDE for sources whose own grammar has no
            exclusion — never silently ignored.
        chamber:
          type: string
        yearFrom:
          type: integer
        yearTo:
          type: integer
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        decisionType:
          type: string
        legislationNo:
          type: string
        page:
          type: integer
        limit:
          type: integer
    SourceSearchRow:
      type: object
      required: [rowId, sourceId, sourceLabel, provider, externalId, title]
      description: A KÜNYE. It carries no digest and no offsets — it is not evidence.
      properties:
        rowId:
          type: string
        sourceId:
          type: string
        sourceLabel:
          type: string
        provider:
          type: string
        fetchKind:
          type: string
        externalId:
          type: string
        title:
          type: string
        court:
          type: string
        decisionDate:
          type: string
        docketNo:
          type: string
        decisionNo:
          type: string
        legislationNo:
          type: string
        legislationKind:
          type: string
        sourceUrl:
          type: string
        snippet:
          type: string
          description: The matching sentence, FOR THE EYE ONLY. Not evidence.
        injectionFlagged:
          type: boolean
          description: >
            Injection heuristics fired on this row's untrusted text.
            TELEMETRY ONLY — nothing branches on it; it exists so a flagged
            row can be shown with a warning instead of being silently trusted.
    SourceFailure:
      type: object
      required: [sourceId, sourceLabel, kind, message, correlationId]
      properties:
        sourceId:
          type: string
        sourceLabel:
          type: string
        kind:
          type: string
        message:
          type: string
          description: Lawyer Turkish; says "Bu kaynağın sonuçları listede YOK."
        correlationId:
          type: string
    SourceSearchResult:
      type: object
      required: [searchId, query, effectiveQuery, requestedSources, rows, failedSources, okSources, partial, tookMs, generatedAt]
      properties:
        searchId:
          type: string
        query:
          type: string
        effectiveQuery:
          type: string
          description: What was actually sent upstream (audit + repeatability).
        requestedSources:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SourceSearchRow"
        failedSources:
          type: array
          items:
            $ref: "#/components/schemas/SourceFailure"
        okSources:
          type: array
          items:
            type: string
        partial:
          type: boolean
        tookMs:
          type: integer
        totalRecords:
          type: integer
          nullable: true
          description: >
            Additive (W14 M-SRV IR-2, raised by C-UI as IR-2). How many records
            the SOURCES say they hold for this query, summed over the sources
            that published a count (Bedesten's `total_records`). `null` means no
            selected source published one — NEVER 0, which would read as "the
            archives hold nothing". Measured on the live upstreams: the same
            phrase answered 116 090 unquoted and 758 as an exact phrase, while
            the list itself showed 20 rows either way. Not `required`: a result
            recorded before this field existed does not carry it.
        trace:
          type: array
          items:
            type: object
            description: >
              One upstream call. `totalRecords` is that source's own count, or
              `null` when the provider publishes none — and always `null` for a
              source that failed, which told us nothing.
            properties:
              sourceId:
                type: string
              tool:
                type: string
              label:
                type: string
              ok:
                type: boolean
              ms:
                type: integer
              rows:
                type: integer
              errorKind:
                type: string
              totalRecords:
                type: integer
                nullable: true
        generatedAt:
          type: string
          format: date-time
    RelatedSearchRequest:
      type: object
      required: [olay]
      properties:
        olay:
          type: string
          minLength: 10
          maxLength: 4000
          description: The event, in the lawyer's own words. The queries are BUILT from it.
        sources:
          type: array
          maxItems: 30
          items:
            type: string
          description: Catalog ids; empty means Yargıtay + Danıştay.
        filters:
          $ref: "#/components/schemas/RelatedSearchFilters"
        maxQueries:
          type: integer
          minimum: 1
          maximum: 8
          description: >
            Ceiling on the generated queries. It may only ask for FEWER; the
            hard maximum is 8 and a larger number is clamped down.
      additionalProperties: false
    RelatedSearchFilters:
      type: object
      description: >
        Forwarded verbatim to every generated query. There is deliberately no
        `query` / `exactPhrase` / `excludeTerms` here: this lane BUILDS the
        queries and reports every one of them, so a hand-written query would be
        a second, unreported search grammar.
      properties:
        chamber:
          type: string
        yearFrom:
          type: integer
        yearTo:
          type: integer
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        decisionType:
          type: string
        legislationNo:
          type: string
        page:
          type: integer
        limit:
          type: integer
          description: Rows asked of each source per query.
      additionalProperties: false
    RelatedQuery:
      type: object
      required: [queryId, kind, kindLabel, text, exactPhrase, issueId, aciklama, calisti, bulunanSatir, sureMs, totalRecords]
      description: >
        One search made on the lawyer's behalf. Present for EVERY generated
        query, including the ones the budget refused — those carry
        `calisti:false` and `null` counters, never a fabricated 0.
      properties:
        queryId:
          type: string
          description: "`s1`, `s2`, … in generation order; referenced by `bulanSorgular`."
        kind:
          type: string
          enum: [atif, tam-ifade, kavram-capa, es-anlamli]
        kindLabel:
          type: string
          description: Lawyer Turkish name of the query kind.
        text:
          type: string
          description: Exactly what was sent upstream.
        exactPhrase:
          type: boolean
        issueId:
          type: string
          description: The `analyzeIntake` issue this query came from.
        concept:
          type: string
          description: The matched concept-table key, when the query came from one.
        aciklama:
          type: string
          description: One Turkish sentence saying why this search was made.
        calisti:
          type: boolean
          description: False = the budget refused it; see `skippedQueries[]`.
        bulunanSatir:
          type: integer
          nullable: true
          description: >
            Rows this query contributed before deduplication; `null` when it
            did not run, and `null` when it ran but none of the selected
            sources answered (an unknown count is never 0).
        sureMs:
          type: integer
          nullable: true
        totalRecords:
          type: integer
          nullable: true
          description: >
            The sources' own count for THIS query, summed over the sources that
            published one. `null` = nobody published one (never 0), and always
            `null` for a query that did not run.
    SkippedQuery:
      type: object
      required: [queryId, text, reason, message]
      properties:
        queryId:
          type: string
        text:
          type: string
        reason:
          type: string
          enum: [CALL_BUDGET_EXCEEDED, TIME_BUDGET_EXCEEDED]
        message:
          type: string
          description: Lawyer Turkish; says plainly that this search did NOT run.
    RelatedResultRow:
      type: object
      required: [kararId, sourceId, merci, provider, externalId, title, bulanSorgular, mutabakat, kaynakSirasi, merciAgirligi]
      description: >
        One decision, as several searches found it. A KÜNYE — it carries no
        digest and no offsets, so it is not evidence. A künye field the source
        did not publish is ABSENT, never invented and never blanked.
      properties:
        kararId:
          type: string
          description: "Decision identity `<sourceId>::<externalId>` — the dedupe key."
        sourceId:
          type: string
        merci:
          type: string
          description: The searched source's own lawyer-Turkish label.
        provider:
          type: string
        fetchKind:
          type: string
          description: What POST /v1/sources/fetch needs for "Tam metni getir".
        externalId:
          type: string
        title:
          type: string
        mahkeme:
          type: string
          description: >
            The court line EXACTLY as the source published it — court family
            plus the chamber when the source gave one. Deliberately not split
            into merci + daire: Bedesten publishes ONE string and a split would
            be our guess, not the archive's record.
        kararTarihi:
          type: string
        esasNo:
          type: string
        kararNo:
          type: string
        sourceUrl:
          type: string
        snippet:
          type: string
          description: For the eye only. A snippet is never evidence.
        injectionFlagged:
          type: boolean
          description: Telemetry only; nothing branches on it.
        bulanSorgular:
          type: array
          items:
            type: string
          description: The `queryId`s that found this decision, in generation order.
        mutabakat:
          type: integer
          description: >
            How many DIFFERENT searches found this decision. A count of
            AGREEING SEARCHES — not a relevance score, not a percentage, not a
            confidence. See `siralamaNotu`.
        kaynakSirasi:
          type: integer
          description: >
            The best (lowest) position the SOURCE itself gave this decision,
            1-based, across the queries that found it. It is the provider's own
            ordering; we never re-score inside a source's list.
        merciAgirligi:
          type: integer
          description: >
            The ordering's second key. 0 = Yargıtay / Danıştay / AYM /
            Uyuşmazlık / KYB, 1 = istinaf (BAM), 2 = everything else,
            3 = yerel mahkeme.
    RelatedNote:
      type: object
      required: [kind, message]
      properties:
        kind:
          type: string
          description: >
            SIRALAMA_ACIKLAMASI · SORGU_SEFFAFLIGI · KAVRAM_BULUNAMADI ·
            BUTCE_ASILDI · KAYNAK_HATASI · KAYIT_SAYISI · LISTE_KIRPILDI
        message:
          type: string
    RelatedSearchResult:
      type: object
      required: [relatedId, olay, kavramlar, requestedSources, queries, results, skippedQueries, failedSources, okSources, partial, totalRecords, siralamaNotu, notes, tookMs, generatedAt]
      properties:
        relatedId:
          type: string
        olay:
          type: string
        kavramlar:
          type: array
          items:
            type: string
          description: >
            Concepts the shared table recognised, in its own specificity order.
            EMPTY when nothing was recognised — the lawyer's own sentence is
            never presented as a legal concept; the KAVRAM_BULUNAMADI note says
            so instead.
        requestedSources:
          type: array
          items:
            type: string
        queries:
          type: array
          items:
            $ref: "#/components/schemas/RelatedQuery"
          description: EVERY generated query, run or not.
        results:
          type: array
          items:
            $ref: "#/components/schemas/RelatedResultRow"
          description: >
            Deduplicated decisions, ordered mutabakat (desc) -> merci weight
            (asc) -> decision date (desc, unknown last) -> identity (asc).
            Deterministic: the same input yields the same order.
        skippedQueries:
          type: array
          items:
            $ref: "#/components/schemas/SkippedQuery"
        failedSources:
          type: array
          items:
            $ref: "#/components/schemas/SourceFailure"
        okSources:
          type: array
          items:
            type: string
        partial:
          type: boolean
        totalRecords:
          type: integer
          nullable: true
          description: >
            The LARGEST count any single one of these queries was told about —
            never a sum, because the queries overlap and adding them would
            double-count the same decisions. The real union is at least this
            large. `null` when no query got a count; never 0.
        siralamaNotu:
          type: string
          description: >
            The fixed sentence, verbatim: "Bu sıra, kararları kaç ayrı aramanın
            birden bulduğuna göre dizer. Bu bir İLGİLİLİK PUANI DEĞİLDİR; hangi
            kararın sizin olayınıza uyduğunu yalnız siz belirlersiniz." It is
            also `notes[0]`, and both are read from the same constant so they
            cannot diverge.
        notes:
          type: array
          items:
            $ref: "#/components/schemas/RelatedNote"
        tookMs:
          type: integer
        generatedAt:
          type: string
          format: date-time
    SourceFetchRequest:
      type: object
      required: [kind, externalId]
      properties:
        kind:
          type: string
        externalId:
          type: string
        query:
          type: string
          description: Used only to score the suggested quotes.
        extra:
          type: object
          description: >
            Extra provider arguments. The identity parameter is written LAST,
            so `extra` can never overwrite it.
    SourceQuote:
      type: object
      required: [startChar, endChar, quote, quoteSha256, score]
      properties:
        startChar:
          type: integer
          description: Unicode code point offset, inclusive (ADR-003).
        endChar:
          type: integer
          description: Unicode code point offset, exclusive.
        quote:
          type: string
        quoteSha256:
          type: string
        score:
          type: number
    SourceCard:
      type: object
      required: [cardId, kind, kindLabel, provider, externalId, title, sourceUrl, sourceUrlAllowed, contentSha256, contentCodePoints, documentId, documentVersionId, retrievedAt, originLabel, quotes, injectionFlagged]
      properties:
        cardId:
          type: string
        kind:
          type: string
        kindLabel:
          type: string
        provider:
          type: string
        externalId:
          type: string
        title:
          type: string
        sourceUrl:
          type: string
        sourceUrlAllowed:
          type: boolean
          description: False means the console must NOT make the URL clickable.
        contentSha256:
          type: string
        contentCodePoints:
          type: integer
        documentId:
          type: string
        documentVersionId:
          type: string
        retrievedAt:
          type: string
          format: date-time
        originLabel:
          type: string
          const: resmî kaynak
          description: Never "(SENTETİK)" — this text came from the upstream.
        quotes:
          type: array
          items:
            $ref: "#/components/schemas/SourceQuote"
        injectionFlagged:
          type: boolean
    SourceCardResponse:
      type: object
      required: [card, text, kaynakEtiketi]
      properties:
        card:
          $ref: "#/components/schemas/SourceCard"
        text:
          type: string
          description: The full canonical text, so the card re-verifies offline.
        library:
          type: object
          description: Local-library queue outcome; a failure never fails the fetch.
          properties:
            action:
              type: string
              enum: [written, duplicate, failed, disabled]
            key:
              type: string
            reason:
              type: string
        kaynakEtiketi:
          type: string
          description: e.g. "resmî kaynak · alınma 02.09.2026"
    SourceWithinRequest:
      type: object
      required: [kind, id, keyword]
      properties:
        kind:
          type: string
          enum: [mevzuat, sigorta_tahkim]
        id:
          type: string
        keyword:
          type: string
        maxResults:
          type: integer
    SourceWithinResult:
      type: object
      required: [kind, label, tool, id, keyword, sonuc, generatedAt]
      properties:
        kind:
          type: string
        label:
          type: string
        tool:
          type: string
        id:
          type: string
        keyword:
          type: string
        sonuc:
          description: The provider payload. NOT evidence; printed with textContent only.
        generatedAt:
          type: string
          format: date-time
    # ------------------------------------------------------ backup (B-03, L-SAFE)
    BackupResult:
      type: object
      required: [path, sizeBytes, files, at, database, warning]
      properties:
        path:
          type: string
        sizeBytes:
          type: integer
        files:
          type: integer
        at:
          type: string
          format: date-time
        database:
          type: string
        dumpFile:
          type: string
          description: >
            ADDITIVE (W14 phase C, V-14). The archive's file name inside
            `path`, derived from `database` (`collex_local` →
            `collex_local.dump`). Absent on a result recorded before that
            pass, where the name was always `collex_local.dump`; that is why
            it is not in `required`. A reader that needs the name should
            prefer `yedek.json`'s `dump.path`, which has always carried it.
        warning:
          type: string
          description: >
            Verbatim: "Bu klasör müvekkil verisi içerir — şifreli bir diske
            koyun (Windows'ta BitLocker, Mac'te FileVault ile şifrelenmiş bir
            disk)."
    LibraryStatus:
      type: object
      required: [libraryDir, queued, ingested, publicDocuments, running, lastIngest]
      properties:
        libraryDir:
          type: string
          description: Absolute path of the spool (`serve.mjs --library-dir`).
        queued:
          type: integer
          description: Envelope files waiting in `<libraryDir>/*.json` (non-recursive; `.tmp` files ignored).
        ingested:
          type: integer
          description: Envelope files the publisher moved to `<libraryDir>/yayimlandi/`.
        publicDocuments:
          type: integer
          nullable: true
          description: >
            `legal.documents` rows with scope `public` — the SAME expression
            `/v1/health.corpus.publicDocuments` evaluates. `null` when the
            database did not answer; never 0 for "not measured".
        running:
          type: boolean
          description: An ingest is in flight in this process.
        lastIngest:
          type: object
          nullable: true
          description: What THIS process remembers of its newest run (null after a restart).
          required: [at, dryRun, scanned, published, skipped, failed, chunks]
          properties:
            at:
              type: string
              format: date-time
            dryRun:
              type: boolean
            scanned:
              type: integer
            published:
              type: integer
            skipped:
              type: integer
            failed:
              type: integer
            chunks:
              type: integer
    LibraryIngestReport:
      type: object
      description: >
        `ingestion.library.LibraryPublishReport.to_json_dict()` plus the
        additive `complete`. `published + skipped + failed = scanned`;
        `skipped = unchanged + reverted`; `failed = rejected + pipelineFailed`.
      required: [spoolDir, dryRun, scanned, published, skipped, failed, unchanged, reverted, rejected, pipelineFailed, moved, chunks, relations, documents, rejectedEnvelopes, failures, complete]
      properties:
        spoolDir:
          type: string
        dryRun:
          type: boolean
        scanned:
          type: integer
          description: Envelope files seen (valid + rejected).
        published:
          type: integer
          description: Envelopes that produced a NEW document version.
        skipped:
          type: integer
          description: Already in the library — nothing written (content-hash dedupe).
        failed:
          type: integer
          description: Rejected envelopes + pipeline failures; every one is named below and left on disk.
        unchanged:
          type: integer
        reverted:
          type: integer
          description: Text matched an older, already-closed version.
        rejected:
          type: integer
          description: Malformed envelopes (unknown schema, hash/code-point mismatch, non-NFC text, synthetic source...).
        pipelineFailed:
          type: integer
        moved:
          type: integer
          description: Envelopes moved to `yayimlandi/` (0 in a dry run).
        chunks:
          type: integer
        relations:
          type: integer
        documents:
          type: array
          description: One entry per accepted envelope — `path`, `key`, `source`, `externalId`, `action` (published|unchanged|reverted_content), `documentId`, `versionId`, `chunks`, `relations`, `movedTo`.
          items:
            type: object
        rejectedEnvelopes:
          type: array
          description: One entry per refused envelope — `path`, machine `code`, Turkish `message`.
          items:
            type: object
        failures:
          type: array
          description: One entry per pipeline failure — `path`, `key`, `source`, `externalId`, `error`, `errorType`.
          items:
            type: object
        complete:
          type: boolean
          description: Additive — `failed === 0`. A partial run is still 200; this says which.
    OperatorHints:
      type: object
      description: >
        Additive (W21 round two, R2-36). The operator scripts of the platform
        the server RUNS on, relative to the repository root — never
        hard-coded to Windows. The console builds its launcher, stop, backup
        and restore lines from these; on the Mac mini they name
        `deploy/macos/collex-*.sh`, on Windows the `ColleX-*.cmd` launchers.
      required: [start, stop, backup, restore, python]
      properties:
        start:
          type: string
          description: "Windows: ColleX-Baslat.cmd; macOS and other POSIX hosts: deploy/macos/collex-start.sh."
        stop:
          type: string
          description: "Windows: ColleX-Durdur.cmd; macOS and other POSIX hosts: deploy/macos/collex-stop.sh."
        backup:
          type: string
          description: "Windows: ColleX-Yedekle.cmd; macOS and other POSIX hosts: deploy/macos/collex-backup.sh."
        restore:
          type: string
          description: "Windows: ColleX-Geri-Yukle.cmd; macOS and other POSIX hosts: deploy/macos/collex-restore.sh."
        python:
          type: string
          description: "Windows: .venv/Scripts/python.exe; macOS and other POSIX hosts: .venv/bin/python."
    BackupSummary:
      type: object
      required: [path, lastAt, sizeBytes, files, stale]
      properties:
        path:
          type: string
        lastAt:
          type: string
          format: date-time
        sizeBytes:
          type: integer
        files:
          type: integer
        stale:
          type: boolean
          description: True when the newest backup is older than 7 days.
    # -------------------------------------------------- cloud AI (B-23, L-SAFE)
    MaskPreview:
      type: object
      description: >
        `maskMode: "preview"` — the text is masked and SHOWN, and NOTHING is
        sent (`sent: false`). There is no path on which a document leaves the
        machine without first being displayable.
      required: [schema, fileId, maskMode, masked, sent]
      properties:
        schema:
          type: string
          const: collex.ai.mask-preview/v1
        fileId:
          type: string
        fileName:
          type: string
        maskMode:
          type: string
          const: preview
        masked:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
              label:
                type: string
              count:
                type: integer
        clean:
          type: boolean
        summary:
          type: string
        chunksAnalyzed:
          type: integer
        chunksTotal:
          type: integer
        preview:
          type: array
          items:
            type: object
            properties:
              chunkId:
                type: string
              text:
                type: string
        sent:
          type: boolean
          const: false
    AiLedgerEntry:
      type: object
      required: [at, route, model, chars, inputTokens, masked]
      properties:
        at:
          type: string
          format: date-time
        route:
          type: string
        model:
          type: string
        chars:
          type: integer
        inputTokens:
          type: integer
        fileId:
          type: string
        matterId:
          type: string
        draftId:
          type: string
        sectionId:
          type: string
        masked:
          type: boolean
    AiLedgerBody:
      type: object
      required: [schema, entries, today, limits, note]
      properties:
        schema:
          type: string
          const: collex.ai.ledger/v1
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AiLedgerEntry"
        today:
          type: object
          properties:
            callsLastHour:
              type: integer
            inputTokensToday:
              type: integer
        limits:
          type: object
          properties:
            callsPerHour:
              type: integer
            inputTokensPerDay:
              type: integer
        note:
          type: string
          description: >
            Printed verbatim: the ledger stores counts, ids and the masking
            decision — the document text, the prompt and the model output are
            NOT stored.
    # ------------------------------------------------ contacts (B-42, L-MATTER)
