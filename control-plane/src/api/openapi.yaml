  # ------------------------------------ matters: exhaustive analysis (W19 G)
  /v1/matters/{matterId}/analysis:
    post:
      operationId: startMatterAnalysis
      summary: Dosyanın tamamını incele — a census, not a ranked search
      description: >
        W19 phase G. `POST /v1/answer` answers a question from the best
        passages it can rank; that is the right shape for "what is the
        limitation period" and is structurally incapable of answering "find
        EVERY contradiction in this file", because top-K is a ranking, not a
        census.


        This route walks EVERY analysis unit of the selected scope, extracts
        normalized propositions from each, and compares them across the whole
        matter. Nothing here consults a ranked retrieval result.


        SCOPE. The matter is expanded to its own uploads on the SERVER, the
        same way `POST /v1/answer`'s `scope.matterId` is, so "the whole file"
        means the same set of documents in both places. Naming `fileIds`
        restricts to a verified SUBSET; anything outside the matter is
        refused by name (409 FILES_OUTSIDE_MATTER) rather than dropped.


        COVERAGE. The response ALWAYS carries `processingCoverage`, whose
        `complete` field is DERIVED from the unit ledger and the page ledger —
        never produced by a model. One failed unit, or one unreadable page,
        and it is false with the gap itemized. `exhaustiveClaimRefusedBecause`
        is non-null exactly when a caller must NOT render a sentence like
        "tüm çelişkiler" or "dosyanın tamamı". W21: it is also non-null
        while extraction or an analytical stage is incomplete or still
        running (a source reason, when there is one, keeps priority);
        `analysisCompleteness` states all three layers separately.


        W20 (changed on purpose): the route no longer runs the analysis. It
        freezes the run's IDENTITY (tenant, matter, task, files, pinned
        document VERSION ids, unit builder, extractor, model schema, model)
        and its whole CENSUS in one transaction, answers 202 with the run,
        and the durable worker processes units under leases — observations
        and the unit's done flag are committed together, so a crash at unit
        846 resumes at unit 846. A request for exactly the same work joins
        the ACTIVE run (`resumed: true`); a finished run is never reused, and
        a task never resumes another task's run. Poll GET .../{runId}. A
        model-required task (claim_evidence, full_review, red_team) with no
        local model configured is refused with 409 MODEL_REQUIRED — it is
        never downgraded to its deterministic part.
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatterAnalysisRequest"
      responses:
        "202":
          description: >-
            Run created (or the identical active run joined); coverage is LIVE
            and cannot read complete until every unit is done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatterAnalysisRun"
        "400":
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: MATTER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            MATTER_EMPTY (no documents), FILES_OUTSIDE_MATTER (a named file
            is not linked to this matter) or MODEL_REQUIRED (the task needs
            the local model and none is configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: MATTER_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: STORE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listMatterAnalyses
      summary: Bu dosyada yapılmış incelemeler
      parameters:
        - name: matterId
          in: path
          required: true
          schema:
            type: string
