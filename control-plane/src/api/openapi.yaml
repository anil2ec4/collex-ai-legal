  /v1/drafts:
    get:
      operationId: listDrafts
      summary: List drafts (latest version per draft, newest activity first)
      parameters:
        - name: matterId
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: >
            Additive (W14 B-26, wired by W14-L-FIX §3e). Turkish-folded
            substring filter on the title. BOTH stores had implemented it all
            along; only the route dropped the parameter and answered a
            silently unfiltered list. An unrecognized query parameter is now
            a 400.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                type: object
                required: [drafts]
                properties:
                  drafts:
                    type: array
                    items:
                      $ref: "#/components/schemas/DraftSummary"
        "400":
          description: limit outside 1..500
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createDraft
      summary: Create an evidence-disciplined draft (dilekçe / sözleşme)
      description: >
        Composes a draft from the matter plus OPTIONAL evidence sources:
        `evidence.runId` reuses the validated claims of a stored answer
        (SUPPORTED / QUALIFIED / PARTIAL_SOURCE_COVERAGE verdicts only;
        everything else becomes a warning), `evidence.fileIds` materializes
        chunks of the tenant's uploaded documents through the same
        deterministic drafter. Every paragraph is either beyan/İRADE (needs
        no evidence), BOUND to validated evidence (`evidenceIds`), or loudly
        KAYNAKSIZ (`supported:false`, counted in `unsupportedCount`) — no
        citation is ever fabricated. `reviewRequired` is ALWAYS true: a
        machine draft is never final. Unknown runId/fileIds fail as a typed
        400 rather than degrading into an unsourced draft.


        W12: list-kind inputs accept a multiline string or an array; HMK
        m.119 party/vekil/court fields; `matter.matterId` files the draft
        under a matter (404 MATTER_NOT_FOUND before composing when the
        matter does not exist). The response is version 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRequest"
      responses:
        "200":
          description: The stored draft (collex.draft/v1)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          description: Invalid request, unknown template, unresolvable evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: matter.matterId names a matter that does not exist (MATTER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/drafts/{draftId}:
    get:
      operationId: getDraft
      summary: Fetch a stored draft (latest version)
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "404":
          description: Unknown draftId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: reviseDraft
      summary: Revise a draft (W12, contract [D]) -> new version
      description: >
        The body is the FULL section list (a section omitted is dropped,
        except the karşı içtihat section which is kept with an issue — send
        it with an empty paragraph list to remove it; `ek-dogrulama` is
        machine-owned and regenerated). Every paragraph is re-bound: a
        lexical binding must overlap the quote (words AND numbers) or the
        citation is not written; an entailment binding is NOT accepted over
        HTTP (the paragraph becomes KAYNAKSIZ) — only the server-side AI
        paragraph writer may vouch for one. Karşıt evidence can never back
        a legal paragraph; an uploaded document can never be a legal
        source. Structural problems (unknown section, duplicate, template
        order) are 400; soft problems are reported in the additive
        top-level `issues` array of the 200 response and as
        "Düzenleme uyarısı:" warnings on the draft. The stored draft's
        `matterId` is inherited and the matter item's version refreshed.
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftPatch"
      responses:
        "200":
          description: The new version (Draft + `issues`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Draft"
                  - type: object
                    required: [issues]
                    properties:
                      issues:
                        type: array
                        items:
                          type: object
                          required: [path, message]
                          properties:
                            path:
                              type: string
                            label:
                              type: string
                            message:
                              type: string
                            code:
                              type: string
                              description: >
                                Additive (W14 B-01, L-EVID). Today the only
                                value is QUOTE_ALTERED: the paragraph no
                                longer contains its cited quote verbatim in
                                NFC canonical form, so the citation was not
                                written and the paragraph fell to KAYNAKSIZ.
                                The console must draw these rows in RED and
                                break the evidence chip. `path` has the form
                                `sections.<i>.paragraphs.<j>.evidenceIds`.
        "400":
          description: Malformed body or structural violation (INVALID_REQUEST)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown draftId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >
            Additive (W12-FIX). The body named `baseVersion` and the stored
            draft has moved on (another tab, the AI paragraph writer, a retry):
            VERSION_CONFLICT with `currentVersion` and `baseVersion` in the
            error object and a Turkish message; nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: deleteDraft
      summary: Delete a draft and EVERY version of it
      description: >
        W14 B-26 (L-MATTER). Works in both modes since the integration phase
        gave `InMemoryDraftStore` a `remove` and both link wrappers stopped
        dropping the method on the floor (W14-L-FIX §3c). A second call is a
        404.
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted (no body)
        "404":
          description: Unknown draftId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: STORE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/drafts/{draftId}/versions:
    get:
      operationId: listDraftVersions
      summary: Version history of a draft (W12)
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Versions (one summary per stored version)
          content:
            application/json:
              schema:
