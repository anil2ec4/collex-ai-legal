    AmendingInstrument:
      type: object
      required: [chunkId, documentVersionId, title, kind]
      properties:
        chunkId:
          type: string
        documentVersionId:
          type: string
        title:
          type: string
        legislationNo:
          type: string
        kind:
          type: string
          description: legal.relation_kind, e.g. AMENDS.
    TemporalView:
      type: object
      description: >
        W14 B-09 (L-ANSWER). PRESENT ONLY on a temporal question. Temporality
        is read from the WORDS of the question (21 markers), NOT from a bare
        `asOf`: every console request carries `asOf`, so triggering on it
        would make every answer temporal and print an unread honesty line on
        every card (trap §C.6). When `present` is false the status can never
        be COMPLETE and the reason TEMPORAL_COMPARISON_MISSING is written.
      required: [applicable, present, asOf, versions, amendedBy, note]
      properties:
        applicable:
          type: boolean
        present:
          type: boolean
          description: True when two versions of the same document stand side by side.
        asOf:
          type: string
          format: date
        versions:
          type: array
          items:
            $ref: "#/components/schemas/TemporalVersion"
        amendedBy:
          type: array
          items:
            $ref: "#/components/schemas/AmendingInstrument"
        note:
          type: string
    MatterAnalysisRequest:
      type: object
      additionalProperties: false
      properties:
        task:
          type: string
          enum:
            - full_review
            - contradictions
            - chronology
            - claim_evidence
            - red_team
          default: full_review
        fileIds:
          type: array
          maxItems: 200
          description: >-
            Restrict to these uploads. Omitted means the WHOLE matter, which
            is the point of the route. Given ids are VERIFIED as members of
            the matter; scope never widens past it.
          items:
            type: string
            minLength: 1
            maxLength: 200
        clientRole:
          type: string
          minLength: 2
          maxLength: 100
          description: >-
            The client's procedural role ("davalı", ...). Used only to split
            favorable/unfavorable points (full_review) and to aim red_team;
            without it the result says the split was not made.
    CoverageGap:
      type: object
      required: [fileId, locator, reason]
      description: >-
        One thing in the selected scope that was NOT read, named so the
        lawyer can go and look at it.
      properties:
        fileId:
          type: string
        fileName:
          type: string
        locator:
          type: string
          description: 'As the reader would cite it, e.g. "s. 7".'
        reason:
          type: string
          enum:
            - UNREADABLE_NO_TEXT
            - SPARSE_TEXT
            - FILE_EXTRACTION_FAILED
            - UNIT_FAILED
            - EXCLUDED_BY_REQUEST
    ProcessingCoverage:
      type: object
      description: >
        How much of the SELECTED SCOPE was actually read.


        This is NOT the question `coverage` on `/v1/answer`, which measures
        how much of the QUESTION the evidence answers and gates abstention.
        The two are independent: an answer can have excellent question
        coverage over a matter that was only half read, and this field is
        what makes that visible.


        `complete` is DERIVED from the counts, never asserted by a model, and
        is false whenever anything was missed — including an empty scope,
        because reviewing zero documents is not a review. Percentages are
        deliberately absent: "97% covered" rounds to "covered" in a reader's
        head, counts do not.
      required:
        - filesTotal
        - filesProcessed
        - filesFailed
        - pagesTotal
        - pagesProcessed
        - pagesTextLayer
        - pagesOcr
        - pagesUnreadable
        - analysisUnitsTotal
        - analysisUnitsProcessed
        - analysisUnitsFailed
        - complete
        - gaps
      properties:
        filesTotal: { type: integer, minimum: 0 }
        filesProcessed: { type: integer, minimum: 0 }
        filesFailed: { type: integer, minimum: 0 }
        pagesTotal: { type: integer, minimum: 0 }
        pagesProcessed: { type: integer, minimum: 0 }
        pagesTextLayer: { type: integer, minimum: 0 }
        pagesOcr:
          type: integer
          minimum: 0
          description: Pages read by transcription rather than a text layer.
        pagesUnreadable:
          type: integer
          minimum: 0
          description: Pages with no usable text. NEVER counted as processed.
        analysisUnitsTotal: { type: integer, minimum: 0 }
        analysisUnitsProcessed: { type: integer, minimum: 0 }
        analysisUnitsFailed: { type: integer, minimum: 0 }
        complete:
          type: boolean
          description: Derived. True only when nothing in the scope was missed.
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/CoverageGap"
    ObservationRelation:
      type: object
      required: [relation, rationale, subjectOverlap, left, right]
      description: >
        How two extracted statements stand to each other.


        A DIFFERENCE IS NOT AUTOMATICALLY A CONTRADICTION: the weaker
        readings exist so the engine is not forced to overstate. Both sides
        carry their source so the reader can overrule the machine.
      properties:
        relation:
          type: string
          enum:
            - CONTRADICTION
            - TENSION
            - CORROBORATION
            - INDEPENDENT
            - INSUFFICIENT_EVIDENCE
        rationale:
          type: string
          description: Turkish, in terms of the two values.
        detector:
          type: string
          description: The detector that produced the relation (for example contradiction-v2 or semantic-v1).
        lane:
          type: string
          enum: [deterministic, semantic]
          description: >-
            W21 — the high-precision value lane (dates, amounts, ratios) or the
            semantic free-text lane (a model classifies a pair of verified
            propositions). The two stay distinguishable.
        subjectOverlap:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: >-
            Topic overlap that made the pair comparable. A HEURISTIC: it
            decides what is examined, never what is asserted, and has not
            been measured against real Turkish case files.
        left:
          $ref: "#/components/schemas/ObservationSide"
        right:
          $ref: "#/components/schemas/ObservationSide"
    ObservationSide:
      type: object
      required: [fileId, statement]
      properties:
        observationId: { type: string, format: uuid }
        fileId: { type: string }
        statement: { type: string }
        locator:
          type: string
          nullable: true
          description: Where in the file the statement is (for example "s. 2"); null when the file has no source map.
