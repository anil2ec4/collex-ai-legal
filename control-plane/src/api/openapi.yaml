          type: boolean
          description: >
            The boolean the CALCULATION uses. It is deliberately `false` for
            every rule whose adli-tatil treatment is disputed, so the computed
            date stays the SHORT and safe one.
        adliTatileTabi:
          oneOf:
            - type: boolean
            - type: string
              enum: ["belirsiz"]
          description: >
            Additive (W14 B-11, L-LEGAL). Three-valued: whether the rule is
            subject to adli tatil. `"belirsiz"` = disputed — the computation
            does NOT apply the HMK m.104 extension (the short, safe date) and
            the interface shows BOTH dates. Seven of the 41 rules are
            `"belirsiz"`.
        nasilDogrulanir:
          type: string
          description: >
            Additive (W14 B-11). One sentence telling the lawyer which article
            to open and what to compare, so a `dogrulanmadi` rule can be
            verified in a minute. A test requires at least 40 characters and
            an article number.
        verified:
          type: object
          required: [status, date, source]
          properties:
            status:
              type: string
              enum: [dogrulandi, dogrulanmadi]
              description: >
                W14 B-11: of 41 rules, 16 are `dogrulandi` (the article text
                was pulled from mevzuat.gov.tr through the yargi-mevzuat MCP
                tools on 02.09.2026) and 25 are still `dogrulanmadi`. A rule
                may only flip with the article text in hand, and
                `tests/deadlines/rules.test.ts` REJECTS a sourceless
                `dogrulandi`: the source must name the article, the access
                date (GG.AA.YYYY) and mevzuat.gov.tr.
            date:
              type: string
              format: date
            source:
              type: string
        computable:
          type: boolean
          description: false for note-only rules (ıslah, karar düzeltme, iş arabuluculuk dava şartı).
        transition:
          type: object
          description: Period change history (CMK 7499 s.K.); a start date before `effectiveFrom` gets a warning.
          properties:
            effectiveFrom:
              type: string
              format: date
            before:
              type: string
            law:
              type: string
