  /v1/research:
    post:
      operationId: research
      summary: Live deep research over the MCP provider gateway
      description: >
        Runs the bounded live-research loop (plan -> search -> fetch ->
        evidence -> verify) against the REAL upstream providers through the
        configured MCP gateway, and returns an AnswerResult
        (collex.answer.result/v1) extended with an additive `research` block
        (tool-call trace, fetched documents, budget spend, upstream health).
        Budgets are validated as positive integers and CLAMPED to the
        contract ceiling (maxToolCalls<=24, maxFetches<=10,
        maxWallTimeMs<=120000) — an oversized budget is a clamp, not a
        rejection.


        Without a configured gateway the route answers a typed 502
        UPSTREAM_UNAVAILABLE (start the server with --with-mcp). When every
        tool call fails at the transport level, the run is reported as a
        typed 502 as well — never a fake ABSTAIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchRequest"
      responses:
        "200":
          description: Live research result (AnswerResult + research block)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveResearchResult"
        "400":
          description: Invalid request or research intake
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "502":
          description: No gateway configured, or upstream unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: matterId names a matter that does not exist (MATTER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Research run terminated abnormally
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/research/start:
    post:
      operationId: startResearch
      summary: Start a live research run in the background (W12-F)
      description: >
        Same body as POST /v1/research plus an optional `matterId`. The body
        and the research intake are validated up front (400); the run then
        proceeds in the background and is polled through
        GET /v1/research/runs/{runId}. A finished run is persisted to the
        answer store exactly like a synchronous one (and filed under its
        matter), so GET /v1/answers/{runId}, the evidence bundle and
        drafting from it work afterwards. At most 16 runs are kept for
        30 minutes; when all slots are running the route answers 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [runId]
                properties:
                  runId:
                    type: string
        "400":
          description: Invalid request or research intake
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: matterId names a matter that does not exist (MATTER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          description: Every run slot is busy (TOO_MANY_RUNS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: No gateway configured (UPSTREAM_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/research/runs/{runId}:
    get:
      operationId: getResearchRunProgress
      summary: Poll a background research run (W12-F)
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run view with Turkish progress labels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchRunView"
        "404":
