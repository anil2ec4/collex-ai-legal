          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/deadlines/compute:
    post:
      operationId: computeDeadline
      summary: Compute a procedural deadline (start day excluded, roll-forward, adli tatil)
      description: >
        Exactly one of `ruleId` / `custom`. Conservative semantics — the
        EARLIEST defensible date, explained step by step in Turkish. Weekend
        and holiday roll-forward; HMK m.104 / İYUK m.8/3 adli tatil
        extension to 7 Eylül when the rule applies (`applyAdliTatil`
        defaults to the rule's flag and may be overridden with a warning);
        CMK m.331 is a warning only. The disclaimer is verbatim on every
        result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputeDeadlineRequest"
      responses:
        "200":
          description: The computation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadlineComputation"
        "400":
          description: INVALID_REQUEST (malformed, unknown rule, both/neither, impossible date) or RULE_NOT_COMPUTABLE (note-only rule)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  # ------------------------------------------------------------ cloud AI (W12-E)
  /v1/ai/status:
    get:
      operationId: aiStatus
      summary: Cloud-AI status (configured? model? what leaves the machine)
      description: >
        Default OFF. `configured` is true only when ANTHROPIC_API_KEY is set
        on the server; the key is never returned or logged. `liveTested` is
        false until a supervised live smoke has been recorded. `usage`
        appears once an adapter exists (after the first consented request).
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
  /v1/ai/analyze-document:
    post:
      operationId: aiAnalyzeDocument
      summary: Structured analysis of an uploaded document (consent per request)
      description: >
        Gates in order: `useCloudAi` must be exactly true (400
        AI_CONSENT_REQUIRED); the key must be configured (503
        AI_NOT_CONFIGURED); validation; the file must have chunks (404).
        The document's chunks (ordinal order, whole chunks within a token
        budget) are sent to Anthropic. Every finding must quote the chunk
        EXACTLY (NFC, code-point offsets); an unverifiable quote keeps the
        finding but marks it `kaynakli:false` and counts in
        `kaynaksizCount`.


        W14 B-23 (L-SAFE): `maskMode` is now REQUIRED — there is no default
        and therefore no path on which a document leaves the machine without
        a decision. `preview` masks the text and returns it WITHOUT sending
        anything (`MaskPreview`, `sent:false`); `mask` masks and sends;
        `as-is` sends unmasked and the response carries the warning "Bu belge
        MASKELENMEDEN gönderildi…". Verification runs against the chunks that
        were ACTUALLY SENT: verifying against the original would report
        "doğrulandı" for text the model never saw.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId, useCloudAi, maskMode]
              additionalProperties: false
              properties:
                fileId:
                  type: string
                useCloudAi:
                  type: boolean
                  const: true
                maskMode:
                  type: string
                  enum: [preview, mask, as-is]
                  description: >
                    Required (W14 B-23). Omitting it is a 400 INVALID_REQUEST
                    whose `issues[].path` names `maskMode`.
                matterId:
                  type: string
                  description: >
                    Additive (W14 B-23). Lets the masker replace the matter's
                    party names with `[MÜVEKKİL]` / `[KARŞI TARAF]`.
                focus:
                  type: string
                  enum: [dilekce, sozlesme, genel]
      responses:
        "200":
          description: >
            `collex.ai.document-analysis/v1`, or — when `maskMode` is
            `preview` — `collex.ai.mask-preview/v1` with `sent: false`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AiDocumentAnalysis"
                  - $ref: "#/components/schemas/MaskPreview"
        "400":
          description: >
            AI_CONSENT_REQUIRED or INVALID_REQUEST (including a missing
            `maskMode`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: File has no chunks / unknown fileId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          description: >
            NEW in W14 (B-23): AI_RATE_LIMITED. `AI_MAX_CALLS_PER_HOUR = 60`
            and `AI_MAX_INPUT_TOKENS_PER_DAY = 400 000`, checked on all three
            cloud routes BEFORE the model call. The body carries `limits` and
            `usage` so the console can say how far over the line the request
            was.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI_UPSTREAM_UNAVAILABLE, AI_AUTH_FAILED, AI_UPSTREAM_FAILED, AI_REFUSED, AI_OUTPUT_TRUNCATED, AI_MALFORMED_OUTPUT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI_NOT_CONFIGURED, STORE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: AI_TIMEOUT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/ai/ocr:
    post:
      operationId: aiOcr
      summary: Transcribe a scanned PDF through the cloud model (consent per request)
      description: >
        Multipart `file` (PDF) + `useCloudAi: 'true'`. Local guards run
        BEFORE any network call: 413 above 32 MB, 415 without a `%PDF-`
        signature, 413 above 100 pages. The WHOLE PDF leaves the machine.
        The response carries a provenance header ("AI OCR — kaynak: <file>
        — GG.AA.YYYY — <model>") and an `upload` handoff (`fileName`,
        `text`) the console posts to POST /v1/files so the transcript goes
        through the ordinary intake path.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, useCloudAi]
              properties:
                file:
                  type: string
                  format: binary
                useCloudAi:
                  type: string
                  const: "true"
      responses:
        "200":
          description: collex.ai.ocr/v1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiOcrResult"
        "400":
          description: AI_CONSENT_REQUIRED or INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: PAYLOAD_TOO_LARGE (bytes or pages)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: UNSUPPORTED_TYPE (not a PDF)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Upstream failure kinds (see analyze-document)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI_NOT_CONFIGURED, AI_RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: AI_TIMEOUT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/ai/draft-paragraph:
    post:
      operationId: aiDraftParagraph
      summary: Write ONE draft paragraph bound to selected evidence (consent per request)
      description: >
        The model writes a paragraph for a section of a stored draft and
        names the evidence ids it relied on; each citation is judged by an
        entailment call and DROPPED below 0.85. If nothing survives the
        paragraph is KAYNAKSIZ (visible, counted, never promoted). The
        revision goes through the SAME reviser as PUT /v1/drafts/{id} with
        the trusted entailment flag, is stored as a new version of the same
        draft, and a fixed warning records that a cloud-written paragraph
        exists. `paragraphId` (replace) and `insertAfter` are exclusive.


        W12-FIX2 (P2-17): `sectionId` may not name a machine- or
        court-owned section — `ek-dogrulama` (EK — DOĞRULAMA BİLGİLERİ) or
        `karsi-ictihat` (DEĞERLENDİRİLMESİ GEREKEN KARŞI İÇTİHAT). Such a
        request is refused with 400 INVALID_REQUEST (issue path `sectionId`,
        message AI_LOCKED_SECTION_MESSAGE_TR: "Bu bölüme yapay zekâ paragrafı
        yazılamaz: doğrulama eki makineye, karşı içtihat bölümü ise
        kararlara aittir.") before the store is read and before any model
        call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draftId, sectionId, instructions, evidenceIds, useCloudAi]
              additionalProperties: false
              properties:
                draftId:
                  type: string
                sectionId:
                  type: string
                paragraphId:
                  type: string
                insertAfter:
                  type: string
                instructions:
                  type: string
                  maxLength: 4000
                evidenceIds:
                  type: array
                  maxItems: 12
                  items:
                    type: string
                useCloudAi:
                  type: boolean
                  const: true
                length:
                  type: string
                  enum: [normal, uzun]
      responses:
        "200":
          description: The revised draft + the paragraph + the entailment table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiDraftParagraphResult"
        "400":
          description: AI_CONSENT_REQUIRED, INVALID_REQUEST (unknown section/anchor/evidence, both anchors, or an AI-locked section — ek-dogrulama / karsi-ictihat, W12-FIX2)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown draftId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "502":
          description: Upstream failure kinds (see analyze-document); the draft is left untouched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI_NOT_CONFIGURED, AI_RATE_LIMITED, DRAFTING_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: AI_TIMEOUT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  # ================================================================ W14 =====
  # Everything below landed in W14 (phase A lanes L-EVID / L-MATTER / L-LEGAL /
  # L-SOURCES / L-SAFE) and was mounted by the W14 phase-B1 integration lane
  # (W14-L-FIX). Every entry is ADDITIVE: no existing path, operation,
  # parameter or field changed meaning.
  # ------------------------------------------------------- citation audit (B-13)
  /v1/citation-audit:
    post:
      operationId: auditCitations
      summary: Atıf Denetim Raporu — audit every citation of an opposing brief
      description: >
        W14 B-13 (L-EVID). Extracts the citations of a document (or takes a
        pre-extracted list) and sorts each into exactly THREE buckets:
        `FOUND` (bulundu), `NOT_FOUND` (bulunamadı — "not in the sources we
        searched; it may be fabricated") and `UNCERTAIN` (belirsiz — "out of
        our coverage, or the source could not be reached"). The two negative
        buckets are NOT the same claim and are never merged.


        `asOf` is MANDATORY and is the DOCUMENT'S date, never today: currency
        is judged as the brief was written. A citation the resolver cannot
        resolve gets an EMPTY `kunye` string — the engine never synthesizes a
        künye, and the DOCX renderer verifies the empty cell inside the
        produced archive.


        Honesty boundary (W14-L-FIX §4): the corpus resolver wired today can
        NEVER answer `NOT_FOUND`, because the schema cannot say whether a
        legislation is stored whole or in part. Every unresolved citation is
        therefore `UNCERTAIN` with its reason. The report is a COVERAGE
        STATEMENT plus resolved künyeler — not yet a full citation
        verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitationAuditRequest"
      responses:
        "200":
          description: The audit report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitationAuditReport"
        "400":
          description: INVALID_REQUEST (missing/malformed asOf, no text and no citations)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/citation-audit/preview:
    post:
      operationId: previewCitationAudit
      summary: What WOULD be audited, without spending a single lookup
      description: >
        Accepts `{ text }` and nothing else (the schema is strict — an extra
        field is a 400). Answers the citations the parser sees so the console
        can ask "N atıf bulundu, denetlensin mi?" before any resolver runs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text:
                  type: string
      responses:
        "200":
          description: The citations that would be audited
          content:
            application/json:
              schema:
                type: object
                required: [citations]
                properties:
                  citations:
                    type: array
                    items:
                      type: object
                      required: [raw, count]
                      properties:
                        raw:
                          type: string
                        count:
                          type: integer
        "400":
          description: INVALID_REQUEST (empty text, or an unrecognized field)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  # ------------------------------------------------- contract review (B-24)
  /v1/contracts/review:
    post:
      operationId: reviewContract
      summary: Rule-based contract review against the lawyer's own checklist
      description: >
        W14 B-24 (L-EVID). Entirely RULE-BASED: no model, no cloud. Splits
        the text into clauses, then answers VAR / YOK / BELİRSİZ per checklist
        heading with the clause numbers that matched and WHICH phrase matched.


        Two rules cannot be switched off. (1) `YOK` means "this heading was
        not found in the text" — the report says verbatim that it does NOT
        mean the clause is legally required or that the contract is defective.
        (2) The word "risk" belongs to a quote the SERVER holds: an
        observation is sourced only when its `evidenceId` names an `evidence`
        entry whose `runId` is an answer run in this server's answer store,
        that run carries the same `evidenceId`, and the stored quote's digest
        equals `quoteSha256` (and the request's quote hashes to it). A digest
        the request computed over its own quote proves nothing and sources
        nothing. Every other observation is prefixed `⚠ KAYNAKSIZ — ` and the
        stem of every Turkish inflection of "risk" is replaced with "gözlem",
        keeping the suffix ("riskli" → "gözlemli").


        2026-09-27 (additive): matching folds İ/I/ı/i and â/î/û on both sides,
        requires every term word to START a word, rejects a privative
        -siz/-sız/-suz/-süz, accepts a closed set of inflection variants, and
        turns a match inside a negative sentence ("alınmamıştır") into
        BELİRSİZ with `reasonCode: NEGATED`. Every VAR/BELİRSİZ finding
        carries the contract's own sentence (`excerpt`, `matches[]`, at most
        300 code points) and section-aware clause labels (`clauseLabels`,
        "Özel Şartlar 1"). An observation whose `clauseIndex` names no clause
        is returned in `unattachedObservations`, never dropped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractReviewRequest"
      responses:
        "200":
          description: The review report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractReviewReport"
        "400":
          description: INVALID_REQUEST (empty text, empty checklist, unknown checklistId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/contracts/review/export:
    post:
      operationId: exportContractReview
      summary: Export a rule-based contract review as DOCX
      description: >
        Runs the same checklist review as `POST /v1/contracts/review`, then
        passes the resulting `collex.contract-review/v1` report to the
        repository's self-checking Python exporter. The response is an
        attachment named "<Belge> - İnceleme Raporu.docx". No model or cloud
        service is used. A failed exporter never returns a partial file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractReviewRequest"
      responses:
        "200":
          description: The self-checked DOCX report
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "400":
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown checklistId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: EXPORT_FAILED or EXPORT_REFUSED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/contracts/checklists:
    get:
      operationId: listChecklists
      summary: The lawyer's saved review checklists
      description: >
        Persisted through `app_private.settings` under the `contractChecklists`
        key (no DDL — W14-L-FIX §1). Without a store the router answers the
        built-in checklists only.
      responses:
        "200":
          description: Saved checklists
          content:
            application/json:
              schema:
                type: object
                required: [checklists]
                properties:
                  checklists:
                    type: array
                    items:
                      $ref: "#/components/schemas/Checklist"
        "503":
          description: STORE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/contracts/checklists/{id}:
    put:
      operationId: saveChecklist
      summary: Save a checklist (full replacement)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Checklist"
      responses:
        "200":
          description: The stored checklist
          content:
            application/json:
              schema:
                type: object
                required: [checklist]
                properties:
                  checklist:
                    $ref: "#/components/schemas/Checklist"
        "400":
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: STORE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  # ------------------------------------------ karşı dilekçe analizi (W16 · D)
  /v1/contracts/petition-analysis:
    post:
      operationId: analyzePetition
      summary: Karşı Dilekçe Analizi — claims, their citations, contrary sources
      description: >
        W16 lane D. RULE-BASED: no model, no cloud, no score. Extracts the
        petition's claims from its headings and numbered structure, then puts
        each claim into exactly THREE buckets — the claim's citations audited
        by the SAME engine `/v1/citation-audit` uses (FOUND / NOT_FOUND /
        UNCERTAIN, empty künye when unresolved), the contrary-authority lanes
        built for it, and its sentences that are bound to no citation.


        `summary` is a CONSTANT sentence, printed verbatim on every report:
        the report checks claims against their citations and against contrary
        sources; it does not measure a claim's legal worth and says nothing
        about the petition's chance of success. There is no strength score,
        no ranking and no "weak point" verdict anywhere in the response.


        A `⚠ KAYNAKSIZ` observation line may not carry an assessment word
        ("risk", "zayıf", "hatalı" …) in ANY Turkish inflection — the word is
        replaced by `[…]` in `unsourced[].line`. The petition's own sentence
        survives untouched in `unsourced[].alinti`, because the quote is the
        other side speaking and the line is ColleX speaking.


        Contrary lanes are always SHOWN, even when nothing runs them: with no
        search port wired every lane is `CALISTIRILMADI` with its reason in
        Turkish. A lane that never ran is never drawn as "aleyhe kaynak yok".


        Takes `text` OR `fileId`, never both. `fileId` needs the upload store
        wired into this router; without it the answer is a typed 503 that says
        so, rather than a 404 on a route the console can see.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetitionAnalysisRequest"
      responses:
        "200":
          description: The analysis report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetitionAnalysisReport"
        "400":
          description: >
            INVALID_REQUEST — no text and no fileId, both given at once, a
            malformed asOf, or an unrecognized field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: NOT_FOUND — the named document yielded no text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          description: STORE_UNAVAILABLE — uploads are not wired into this lane
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  # -------------------------------------------------------------- fees (B-35)
  /v1/fees/tariffs:
    get:
      operationId: getFeeTariffs
      summary: Harç, gider, vekâlet ücreti and kesinlik sınırı tariff for a year
      description: >
        W14 B-35 (L-LEGAL). A Turkish court fee has two halves: the STRUCTURE
        and RATE written in the statute (stable, quotable — e.g. the nispi
        karar ve ilam harcı of binde 68,31, 492 s.K. (1) sayılı tarife
        A/III-1-a), and the YEARLY MONETARY FIGURE republished every January
        in the Resmî Gazete. ColleX knows the first and does NOT know the
        second.


        Therefore a line whose yearly figure is unknown carries
        `amount: null` and `verified.status: dogrulanmadi`. That is the honest
        answer, not a defect: a wrong fee is a rejected filing. The lawyer
        supplies the figure once a year through `overrides` on
        POST /v1/fees/compute.
      parameters:
        - name: year
          in: query
          required: false
          description: Four-digit year; defaults to the newest tariff on file.
          schema:
            type: integer
      responses:
        "200":
          description: The year's tariff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeTariffResponse"
        "400":
          description: INVALID_REQUEST | TARIFF_YEAR_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/fees/compute:
    post:
      operationId: computeFees
      summary: Step-by-step fee / vekâlet ücreti / kesinlik sınırı computation
      description: >
        Shows the arithmetic step by step; a step whose tariff figure is
        missing answers `durum: TUTAR_GEREKLI` and the total becomes `null`
        rather than a guess. `FEE_DISCLAIMER` is carried verbatim on every
        response. Money is computed with JavaScript `number` and rounded to
        two decimals — an estimate, and the disclaimer says so.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeComputeRequest"
      responses:
        "200":
          description: The computation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeComputation"
        "400":
          description: INVALID_REQUEST | TARIFF_YEAR_NOT_FOUND | TARIFF_LINE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  # ----------------------------------------------------------- sources (B-14/16/20)
  /v1/sources/catalog:
    get:
      operationId: getSourceCatalog
      summary: The selectable sources of the "Karar ara" form
      description: >
        W14 B-16 (L-SOURCES). Data only: which sources exist, which take a
        daire filter, which decision types they offer, which full-text kinds
        and "içinde ara" lanes are available. Derived from the live routing
        tables, so a lane that is disconnected disappears here rather than
        failing at call time.
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceCatalog"
  /v1/sources/manifest:
    get:
      operationId: getCoverageManifest
      summary: Kapsam manifestosu — what we search and, above all, what we do NOT
      description: >
        W14 B-14 (L-SOURCES). `collex.sources.manifest/v1`. Its single rule is
        that no cell invents a number: every figure comes from the registry or
        from GET /v1/health, and an unmeasured cell is `null` — not 0, not an
        estimate, not a range. `sonErisim` is `null` for every source today
        because no per-source success log is kept.


        `bilinenBosluklar` is never shorter than five rows and today carries
        eight, including the verbatim heading "AİHM (HUDOC) kapsamda
        değildir". The page opens with the MCP gateway off and says so.
      responses:
        "200":
          description: The coverage manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageManifest"
  /v1/sources/search:
    post:
      operationId: searchSources
      summary: Search the selected upstream sources and return künye rows
      description: >
        W14 B-16. Three rules hold. (1) A search row is a KÜNYE, never
        evidence: it carries no `contentSha256` and no offsets. The only thing
        that produces a citable passage is POST /v1/sources/fetch. (2) A
        source that failed is NAMED in `failedSources[]` with a Turkish
        sentence saying "Bu kaynağın sonuçları listede YOK."; if every
        selected source fails the answer is `502 ALL_SOURCES_FAILED`, never an
        empty list. (3) No künye is fabricated — a payload row without an
        `externalId` is DROPPED, not padded.


        LIVE VERIFICATION IS PENDING: the government upstreams are not
        reachable from the development machine, so every acceptance run so far
        used an injected fake gateway with real payload shapes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceSearchRequest"
      responses:
        "200":
          description: Rows, plus the sources that failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSearchResult"
        "400":
          description: INVALID_REQUEST (field-level `issues[]`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: >
            ALL_SOURCES_FAILED — the gateway was reached but no selected
            source answered; the body carries `error.failedSources[]`, one
            NAMED entry per source with its own `kind` and Turkish sentence,
            never an empty result list. UPSTREAM_UNAVAILABLE means something
            else and something narrower since W14-F-API (V-3): the server has
            NO gateway at all. Until that pass this route read a dependency
            `serve.mjs` never supplied, so a server started WITH `--with-mcp`
            still answered UPSTREAM_UNAVAILABLE and advised the operator to do
            what they had already done; the sources router now shares the same
            live gateway as `/v1/research` (`gateway ?? researchGateway`), and
            an explicitly injected `gateway` still wins.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/sources/related:
    post:
      operationId: relatedSearch
      summary: >-
        "Olayı anlat" — one event, several searches, ranked by how many agree
      description: >
        W16 Şerit B. The lawyer describes the EVENT in their own words; the
        same concept engine the research planner uses (`analyzeIntake`)
        extracts the issues, and up to 8 DIFFERENT queries are built from them
        — exact phrase, concept + the statutory anchor the concept table wrote
        down, synonym variants, and any citation the lawyer named. Each query
        runs over the selected sources through the SAME service
        `POST /v1/sources/search` uses; no MCP tool is added and no tool
        contract changes.


        FOUR RULES HOLD. (1) Every generated query is RETURNED, including the
        ones the budget refused to run: they appear in `queries[]` with
        `calisti:false`, again in `skippedQueries[]` with a typed reason, and
        once more as a note that counts them. A silently trimmed query is
        forbidden. (2) `mutabakat` is a count of AGREEING SEARCHES — how many
        of our queries found the same decision. It is NOT a relevance score,
        not a percentage and not a confidence, and `siralamaNotu` says so
        verbatim in every response. (3) The order is TOTAL and DETERMINISTIC:
        mutabakat (desc) → merci weight (Yargıtay/Danıştay/AYM > BAM > yerel)
        → decision date (desc, unknown last) → decision identity. No random id,
        no insertion order and no clock takes part in it. (4) A row is a KÜNYE
        and never evidence — no digest, no offsets; a field the source did not
        publish is ABSENT rather than invented, and POST /v1/sources/fetch with
        the row's `fetchKind` + `externalId` is the only thing that produces a
        citable passage.


        `totalRecords` is the LARGEST count a single one of these queries was
        told about, never a sum: the queries overlap, so adding them would
        double-count the same decisions. `null` means no source published a
        count — never 0.


        LIVE VERIFICATION IS PENDING, exactly as for /v1/sources/search: the
        government upstreams are not reachable from the development machine,
        so every acceptance run so far used an injected fake gateway with real
        payload shapes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelatedSearchRequest"
      responses:
        "200":
          description: The generated queries, the ranked decisions and the notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedSearchResult"
        "400":
          description: >
            INVALID_REQUEST with field-level `issues[]` — a stray field is
            named by its own key, `filters.yearFrom` names a reversed year
            range, and `olay` names an event text too short to search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: >
            UPSTREAM_UNAVAILABLE (this server has no gateway at all) or
            ALL_SOURCES_FAILED (the gateway was reached but no selected source
            answered ANY query). The second carries `error.failedSources[]`,
            one NAMED entry per source, plus `queries[]` — even a failed run
            tells the lawyer what was searched on their behalf.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/sources/fetch:
    post:
      operationId: fetchSource
      summary: Fetch a full text and seal it into a hash-verified source card
      description: >
        Runs the SAME canonicalization as the live research lane (CRLF folded,
        NFC, SHA-256 over UTF-8, code-point offsets — ADR-003), so the passage
        is byte-identical to one produced by /v1/research. The card can be
        re-verified offline from itself. `originLabel` is "resmî kaynak" and
        the string "SENTETİK" never appears on it.


        When a local library directory is configured (`serve.mjs
        --library-dir`), the fetched document is queued there; a failed write
        NEVER fails the request — it becomes `library.action: "failed"` with a
        reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceFetchRequest"
      responses:
        "200":
          description: The sealed card, its canonical text and the library outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceCardResponse"
        "400":
          description: INVALID_REQUEST (unknown fetch kind, missing externalId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: >
            UPSTREAM_UNAVAILABLE / TIMEOUT / RATE_LIMITED / PARSER_ERROR /
            NOT_FOUND. Since W14-F-API (V-3) this route reaches the same live
            gateway `--with-mcp` starts, so a failure here is a DOCUMENT-level
            failure of a reachable lane, not "no gateway configured".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/sources/within:
    post:
      operationId: searchWithinSource
      summary: >-
        "İçinde ara" — search inside one legislation or arbitration file
      description: >
        Thin, honest wrapper over the `search_within_*` MCP lane. `sonuc` is
        the provider payload and is NOT evidence; the console prints it with
        `textContent` only. A provider failure is ALWAYS the typed 502 — also
        when the tool returned it as a result (an error string, or an `error`
        field next to an empty match list); `error.kind` is the FailureKind,
        `error.message` a Turkish sentence with the code in parentheses, and
        the provider's own text is never echoed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceWithinRequest"
      responses:
        "200":
          description: The provider's answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceWithinResult"
        "400":
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: UPSTREAM_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  # ------------------------------------------------------------- backup (B-03)
  /v1/backup:
    post:
      operationId: createBackup
      summary: Take a verifiable backup of the product database and the originals
      description: >
        W14 B-03 (L-SAFE). A backup is THREE parts, and two of them are not a
        backup: `<veritabanı>.dump` (`pg_dump -Fc`), `uploads/` (the original
        bytes) and `yedek.json` — the manifest that records the schema
        identity, the date, the database and the SIZE and SHA-256 of every
        file. A folder without a manifest does not count as a backup.


        W14 phase C (V-14): the archive is named after the database it holds
        (`collex_local` still yields `collex_local.dump`, so an existing
        backup folder keeps working), the name is DERIVED rather than trusted
        — every character outside `[A-Za-z0-9_.-]` becomes `_`, so no database
        name can produce a path separator, a parent-directory reference or a
        hidden file — and both `verifyBackup` and `ColleX-Geri-Yukle.cmd` read
        the name from `yedek.json` instead of assuming it. Until that pass the
        file was ALWAYS `collex_local.dump` while the manifest recorded the
        real database, so the restore script's existence check only worked by
        accident.


        Non-negotiable: the product database is never written to; `execFile`
        with an argument array (no shell); a restore NEVER starts with
        `drop database` — the existing database is RENAMED to
        `collex_local_eski_<tarih>`; `robocopy /E` merges originals and never
        purges. The response `warning` is shown verbatim wherever a backup is
        reported: "Bu klasör müvekkil verisi içerir — şifreli bir diske koyun
        (Windows'ta BitLocker, Mac'te FileVault ile şifrelenmiş bir disk)."
      responses:
        "200":
          description: The backup that was written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupResult"
        "409":
          description: BACKUP_IN_PROGRESS — another backup is still running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: PG_TOOLS_MISSING | DUMP_FAILED | COPY_FAILED | VERIFY_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
