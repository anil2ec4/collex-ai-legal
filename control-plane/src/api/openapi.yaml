                  type: object
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatterItem"
        "400":
          description: Validation failed, or a refId change on a file/answer/draft item (REF_ID_IMMUTABLE, W12-FIX2)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: MATTER_NOT_FOUND / ITEM_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: deleteMatterItem
      summary: Remove an item (an answer item is detached from the matter)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed
        "404":
          description: MATTER_NOT_FOUND / ITEM_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
