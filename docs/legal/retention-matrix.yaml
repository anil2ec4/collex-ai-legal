# Saklama / İmha Matrisi (Retention Matrix) — ŞABLON
#
# HUKUKÇU İNCELEMESİ GEREKLİ — şablondur; nihai hukuki değerlendirme değildir.
# Durum: TASLAK.
#
# Amaç: her veri kategorisi için saklama süresi, imha yöntemi ve türetilmiş
# kopyaların (embedding, özet, cache, backup) aynı politikaya bağlanması.
# Notlar (brief §12.3):
# - Silme/yok etme/anonimleştirme kayıtlarının saklanma süresi ve periyodik
#   imha politikası güncel resmî metinden uygulanmalıdır.
# - Tenant/matter silme; object, chunk, embedding, summary, cache ve derived
#   evidence üzerinde de geçmelidir (kabul kapısı).
# - Backup deletion/expiry kullanıcıya açıklanır.

