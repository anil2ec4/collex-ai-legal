# Kaynak hakkı / lisans / veritabanı riski kayıt defteri (brief §12.2 şablonu).
#
# DURUM: Bütün girdiler "legal_review.status: blocked" ile başlar.
# terms.url / captured_at alanları null'dur; her upstream'in güncel kullanım
# şartları ve robots.txt anlık görüntüsü TARİHLİ olarak araştırılıp
# doldurulacaktır (robots.txt lisans DEĞİLDİR). "unknown/prohibited" kalan
# kaynak, common corpus backfill'ine giremez (üretim ingestion kapısı).
#
# HUKUKÇU İNCELEMESİ GEREKLİ — bu dosya nihai hukuki değerlendirme değildir.
# Tamamlayan hukukçu: legal_review.reviewer / reviewed_at / evidence_paths
# alanlarını doldurur ve status'u günceller.

